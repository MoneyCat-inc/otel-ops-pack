<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail - ECRR v1.0.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #000000;
        }
        
        .thumbnail {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #7C5CFF 0%, #00D4AA 50%, #FF6B6B 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        
        .thumbnail::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="stars" width="50" height="50" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.3)"/><circle cx="10" cy="10" r="0.5" fill="rgba(255,255,255,0.2)"/><circle cx="40" cy="15" r="0.8" fill="rgba(255,255,255,0.25)"/></pattern></defs><rect width="100" height="100" fill="url(%23stars)"/></svg>');
            opacity: 0.4;
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px;
        }
        
        .rocket {
            font-size: 80px;
            margin-bottom: 30px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        .title {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #FFFFFF, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 40px;
            color: #00D4AA;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: 400;
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .feature-icon {
            font-size: 36px;
            margin-right: 20px;
        }
        
        .brand {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .hashtags {
            font-size: 24px;
            font-weight: 400;
            color: #7C5CFF;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #7C5CFF;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="thumbnail">
        <div class="play-button">▶</div>
        
        <div class="content">
            <div class="rocket">🚀</div>
            <div class="title">ECRR v1.0.0</div>
            <div class="subtitle">MILESTONE ACHIEVED!</div>
            
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">✅</span>
                    <span>Production Ready</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span>Privacy First</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">♿</span>
                    <span>Fully Accessible</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>Real-Time Performance</span>
                </div>
            </div>
            
            <div class="brand">Resonai Voice Training</div>
            <div class="hashtags">#VoiceTech #Accessibility</div>
        </div>
    </div>
</body>
</html>
