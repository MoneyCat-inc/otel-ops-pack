<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Header - ECRR v1.0.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        
        .header {
            width: 600px;
            height: 200px;
            background: linear-gradient(135deg, #7C5CFF 0%, #00D4AA 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="waves" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0,20 Q10,0 20,20 T40,20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23waves)"/></svg>');
            opacity: 0.3;
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }
        
        .rocket {
            font-size: 40px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        
        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .features {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.8;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="content">
            <div class="rocket">🚀</div>
            <div class="title">Resonai ECRR v1.0.0</div>
            <div class="subtitle">Production Ready!</div>
            <div class="features">Privacy • Accessible • Real-Time</div>
        </div>
    </div>
</body>
</html>
