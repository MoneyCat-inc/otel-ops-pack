# Stress Test Configuration File 2
# Additional extensive configuration to exceed LOC limits

extensions:
  stress_test_extension_1:
    type: health_check
    endpoint: 0.0.0.0:13133
    attributes:
      - key: stress.test
        value: "extension_1"
      - key: test.scenario
        value: "large_scale_conflict"

  stress_test_extension_2:
    type: pprof
    endpoint: 0.0.0.0:1777
    attributes:
      - key: stress.test
        value: "extension_2"

  stress_test_extension_3:
    type: zpages
    endpoint: 0.0.0.0:55679
    attributes:
      - key: stress.test
        value: "extension_3"

receivers:
  stress_test_advanced_1:
    type: otlp
    protocols:
      http:
        endpoint: 0.0.0.0:5432
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://localhost:8080"
            - "https://stress-test.example.com"
        cors_headers:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
      grpc:
        endpoint: 0.0.0.0:5433
        max_recv_msg_size: 4194304
        max_concurrent_streams: 16
    attributes:
      - key: stress.test
        value: "advanced_1"
      - key: test.scenario
        value: "large_scale_conflict"
      - key: codex.cloud
        value: "stress_test"

  stress_test_advanced_2:
    type: filelog
    include: 
      - C:/stress-test-logs/app/**/*.log
      - C:/stress-test-logs/system/**/*.log
      - C:/stress-test-logs/security/**/*.log
      - C:/stress-test-logs/audit/**/*.log
    exclude:
      - C:/stress-test-logs/temp/**/*
      - C:/stress-test-logs/cache/**/*
    start_at: end
    include_file_path: true
    include_file_name_resolved: true
    include_file_path_resolved: true
    operators:
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.timestamp
          layout: '2006-01-02 15:04:05'
        severity:
          parse_from: attributes.level
          preset: syslog
      - type: move
        from: attributes["log.file.name"]
        to: attributes["log.file.name"]
      - type: add
        field: attributes["stress.test"]
        value: "advanced_2"
      - type: add
        field: attributes["test.scenario"]
        value: "large_scale_conflict"
      - type: add
        field: attributes["processing.stage"]
        value: "initial"
      - type: add
        field: attributes["codex.cloud"]
        value: "stress_test"
      - type: router
        routes:
          - output: parser_1
            expr: attributes["log.level"] == "ERROR"
          - output: parser_2
            expr: attributes["log.level"] == "WARN"
          - output: parser_3
            expr: attributes["log.level"] == "INFO"

exporters:
  stress_test_advanced_exporter_1:
    type: otlp
    endpoint: "localhost:4317"
    tls:
      insecure: true
      ca_file: "/path/to/ca.pem"
      cert_file: "/path/to/cert.pem"
      key_file: "/path/to/key.pem"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 120s
      max_elapsed_time: 60m
      randomization_factor: 0.5
      multiplier: 1.5
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 20000
      num_consumers: 16
      persistent_storage:
        directory: "/tmp/stress-test-queue"
    compression: gzip
    timeout: 30s
    headers:
      - key: "stress-test-header"
        value: "advanced-exporter-1"
      - key: "test-scenario"
        value: "large-scale-conflict"
      - key: "codex-cloud"
        value: "stress-test"

processors:
  stress_test_advanced_processor_1:
    type: memory_limiter
    check_interval: 500ms
    limit_percentage: 95
    spike_limit_percentage: 35
    attributes:
      - key: stress.test
        value: "advanced_processor_1"
      - key: test.scenario
        value: "large_scale_conflict"

  stress_test_advanced_processor_2:
    type: batch
    timeout: 500ms
    send_batch_size: 2048
    send_batch_max_size: 4096
    attributes:
      - key: stress.test
        value: "advanced_processor_2"

  stress_test_advanced_processor_3:
    type: filter
    logs:
      log_record:
        - attributes["stress.test"] == "advanced_1"
        - attributes["test.scenario"] == "large_scale_conflict"
        - IsMatch(attributes["log.level"], "ERROR|WARN")
        - attributes["codex.cloud"] == "stress_test"
    attributes:
      - key: stress.test
        value: "advanced_processor_3"

service:
  extensions: [stress_test_extension_1, stress_test_extension_2, stress_test_extension_3]
  pipelines:
    stress_test_advanced_traces:
      receivers: [stress_test_advanced_1]
      processors: [stress_test_advanced_processor_1, stress_test_advanced_processor_2]
      exporters: [stress_test_advanced_exporter_1]
    stress_test_advanced_metrics:
      receivers: [stress_test_advanced_2]
      processors: [stress_test_advanced_processor_2, stress_test_advanced_processor_3]
      exporters: [stress_test_advanced_exporter_1]
    stress_test_advanced_logs:
      receivers: [stress_test_advanced_1, stress_test_advanced_2]
      processors: [stress_test_advanced_processor_1, stress_test_advanced_processor_3]
      exporters: [stress_test_advanced_exporter_1]
