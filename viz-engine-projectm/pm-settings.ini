[window]
width = 1920
height = 1080
fullscreen = false

[audio]
# Audio from FIFO (written by md3-audio-handler)
device = default
channels = 2
sample_rate = 44100

[rendering]
fps = 30
mesh_x = 48
mesh_y = 36
texture_size = 1024

[presets]
# Preset directory (mounted volume)
path = /app/presets
duration = 30
shuffle = false

