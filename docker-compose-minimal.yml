services:
  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.129.5
    ports:
      - "4317:4317"    # gRPC
      - "4318:4318"    # HTTP
    volumes:
      - otel_file_storage:/var/lib/otelcol/file_storage
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickhouse:9000
    restart: unless-stopped
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "9000:9000"
      - "8123:8123"
    restart: unless-stopped

volumes:
  otel_file_storage:
