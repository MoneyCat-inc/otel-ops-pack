<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonai Data Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<style>
  body { background-color: #0b0d12; color: #e5e7eb; font-family: 'Roboto', sans-serif; margin: 0; }
  h1 { text-align: center; margin: 20px 0; color: #7c5cff; }
  .container { max-width: 1200px; margin: auto; padding: 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
  .controls button { flex: 1 1 150px; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; }
  .controls button.laminar { background-color: #4caf50; }
  .controls button.chaotic { background-color: #f57c00; }
  .controls button.stop { background-color: #d32f2f; }
  .controls button.test { background-color: #0288d1; }
  .section { background: #1f2330; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .section h2 { margin-top: 0; color: #7c5cff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #2c3040; }
  th { text-transform: uppercase; font-size: 12px; color: #9ca3af; }
  .log-info { color: #4caf50; }
  .log-warn { color: #fbc02d; }
  .log-error { color: #e53935; }
  canvas { width: 100% !important; height: 300px !important; }
</style>
</head>
<body>
  <h1>Data Room – Test Harness</h1>
  <div class="container">
    <div class="controls">
      <button class="laminar" onclick="generateData('laminar')">Send Laminar Data</button>
      <button class="chaotic" onclick="generateData('chaotic')">Send Chaotic Data</button>
      <button class="test" onclick="generateData('test')">Send Test Data</button>
      <button class="stop" onclick="stopData()">Stop Signals</button>
    </div>
    <div class="section">
      <h2>Live Metrics</h2>
      <canvas id="metricsChart"></canvas>
    </div>
    <div class="section">
      <h2>Logs</h2>
      <table>
        <thead>
          <tr><th>Timestamp</th><th>Level</th><th>Source</th><th>Message</th></tr>
        </thead>
        <tbody id="logsBody"></tbody>
      </table>
    </div>
  </div>
<script>
  let chart;
  let metricsData = {
    labels: [],
    datasets: [{ label: 'Throughput (req/sec)', data: [], borderColor: '#7c5cff', backgroundColor: 'rgba(124,92,255,0.2)' }]
  };
  function initChart() {
    const ctx = document.getElementById('metricsChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: metricsData,
      options: { scales: { x: { display: false }, y: { beginAtZero: true } }, plugins: { legend: { display: true } } }
    });
  }
  function updateMetrics(type) {
    const time = new Date().toLocaleTimeString();
    const value = type === 'laminar' ? Math.floor(Math.random()*100+400) : type === 'chaotic' ? Math.floor(Math.random()*300+500) : Math.floor(Math.random()*50+200);
    metricsData.labels.push(time);
    metricsData.datasets[0].data.push(value);
    if (metricsData.labels.length > 20) {
      metricsData.labels.shift();
      metricsData.datasets[0].data.shift();
    }
    chart.update();
  }
  function addLog(level, source, message) {
    const tb = document.getElementById('logsBody');
    const row = document.createElement('tr');
    const ts = new Date().toISOString().slice(0,19).replace('T',' ');
    row.innerHTML = `<td>${ts}</td><td class="log-${level.toLowerCase()}">${level}</td><td>${source}</td><td>${message}</td>`;
    tb.insertBefore(row, tb.firstChild);
    const maxLogs = 50;
    while(tb.children.length > maxLogs) { tb.removeChild(tb.lastChild); }
  }
  function generateData(type) {
    updateMetrics(type);
    if (type === 'laminar') {
      addLog('INFO','Laminar','Laminar flow operational');
    } else if (type === 'chaotic') {
      addLog('WARN','Chaotic','Turbulence detected');
    } else if (type === 'test') {
      addLog('ERROR','Test','Simulated error triggered');
    }
  }
  function stopData() {
    addLog('INFO','Control','Stop signal issued. Test halted.');
  }
  window.onload = initChart;
</script>
</body>
</html>
