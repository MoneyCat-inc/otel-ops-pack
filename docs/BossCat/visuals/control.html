<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BossCat Visual Control · Resonai</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: #cfe8ff;
      font-family: system-ui, "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      align-items: center;
      padding: .6rem .9rem;
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(115deg, rgba(19,41,61,.92), rgba(15,34,51,.54), rgba(19,41,61,.92));
      background-size: 220% 220%;
      animation: shimmer 14s ease infinite;
      border-bottom: 1px solid #12202d;
      transition: transform .25s ease, opacity .25s ease;
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .topbar h1 { font-size: 1rem; margin: 0 .75rem 0 0; color: #7dd3fc; white-space: nowrap; }
    button, select, input[type="checkbox"] { font: inherit; }
    button {
      background: #13293d;
      color: #cfe8ff;
      border: 1px solid #1b3a52;
      border-radius: 6px;
      padding: .45rem .65rem;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: #0f2233; transform: translateY(-1px); }
    select { background: #0b1520; color: #cfe8ff; border: 1px solid #1b3a52; border-radius: 6px; padding: .35rem .5rem; }
    label { display: inline-flex; align-items: center; gap: .35rem; }
    #blend { width: 160px; vertical-align: middle; }
    .hint { opacity: .7; font-size: .85rem; }
    body.theatre .topbar { transform: translateY(-110%); opacity: 0; pointer-events: none; }

    .layout {
      flex: 1;
      position: relative;
      display: flex;
      align-items: stretch;
      padding: .75rem;
      box-sizing: border-box;
      overflow: hidden;
    }
    .visual-area {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 20% 25%, rgba(125,211,252,.08), transparent);
      border-radius: 16px;
      border: 1px solid #17263a;
      box-shadow: 0 18px 34px rgba(5,7,13,.55);
      overflow: hidden;
      transition: margin-left .33s ease;
    }
    .visual-area canvas { width: 100%; height: 100%; display: block; }

    .slide-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: clamp(240px, 26vw, 340px);
      display: flex;
      flex-direction: column;
      gap: .75rem;
      padding: .9rem 1rem 1rem;
      background: rgba(11,15,20,.92);
      border: 1px solid #17263a;
      border-radius: 16px;
      box-shadow: 0 18px 36px rgba(5,7,13,.5);
      backdrop-filter: blur(10px);
      transform: translateX(calc(-100% - 18px));
      opacity: 0;
      transition: transform .33s ease, opacity .33s ease;
      pointer-events: none;
    }
    .slide-panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slide-panel h2 {
      margin: 0;
      font-size: .95rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #8fd5ff;
    }
    .beat-lamp {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #243246;
      box-shadow: 0 0 0 rgba(255,191,36,0);
      transition: background .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .beat-lamp.active { background: #facc15; box-shadow: 0 0 16px rgba(250,204,21,.9); transform: scale(1.3); }
    #metricsChart {
      width: 100%;
      height: 185px;
      border: 1px solid #1b2a3d;
      border-radius: 12px;
      background: #05070d;
    }
    .metrics-table {
      display: grid;
      grid-template-columns: auto auto;
      gap: .4rem .85rem;
      font-size: .85rem;
      letter-spacing: .02em;
    }
    .metrics-table span:first-child { opacity: .6; }
    .metrics-table span:last-child { font-variant-numeric: tabular-nums; }
    .input-block { display: flex; flex-direction: column; gap: .4rem; }
    .input-label { opacity: .6; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    .input-controls { display: flex; gap: .45rem; align-items: center; }
    .input-controls select {
      flex: 1;
      min-width: 0;
      background: #101b2b;
      color: #e0f3ff;
      border: 1px solid #20344a;
      border-radius: 6px;
      padding: .35rem .45rem;
    }
    .input-controls button {
      padding: .3rem .55rem;
      border-radius: 6px;
    }

    body.panel-open .slide-panel { transform: translateX(0); opacity: 1; pointer-events: auto; }
    body.panel-open .visual-area { margin-left: clamp(240px, 26vw, 340px); }
  </style>
  <!-- Butterchurn + presets (local vendor only) -->
  <script src="vendor/butterchurn.vend.js"></script>
  <script src="vendor/butterchurnPresets.vend.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%230b0f14'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%237dd3fc'/%3E%3C/svg%3E" />
  <meta name="description" content="BossCat Visual Control Surface for Resonai default visualization" />
  <meta name="x-bosscat-tetragram" content="MILK" />
  <meta name="robots" content="noindex" />
  <script>
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function ensureButterchurnLoaded() {
      if (window.butterchurn && window.butterchurnPresets) return true;
      try {
        const bc = await import('./vendor/butterchurn.vend.js').catch(() => ({}));
        const bp = await import('./vendor/butterchurnPresets.vend.js').catch(() => ({}));
        if (!window.butterchurn && (bc?.default || bc)) window.butterchurn = bc.default || bc;
        if (!window.butterchurnPresets && (bp?.default || bp)) window.butterchurnPresets = bp.default || bp;
      } catch (_) {}
      if (window.butterchurn && window.butterchurnPresets) return true;
      try {
        await loadScript('https://cdn.jsdelivr.net/npm/butterchurn/dist/butterchurn.min.js');
        await loadScript('https://cdn.jsdelivr.net/npm/butterchurn-presets/dist/butterchurnPresets.min.js');
      } catch (_) {}
      if (!(window.butterchurn && window.butterchurnPresets)) {
        try {
          await loadScript('https://unpkg.com/butterchurn/dist/butterchurn.min.js');
          await loadScript('https://unpkg.com/butterchurn-presets/dist/butterchurnPresets.min.js');
        } catch (_) {}
      }
      return !!(window.butterchurn && window.butterchurnPresets);
    }
  </script>
</head>
<body>
  <div class="topbar">
    <h1>🎶 BossCat Visual Control</h1>
    <button id="startMic">Start Mic</button>
    <button id="btnSelfTest" title="Generate a silent test tone">Self-Test</button>
    <button id="btnMetrics" title="Toggle metrics panel">📊 Metrics</button>
    <button id="btnTheatre" title="Toggle theatre mode">🎭 Theatre</button>
    <button id="btnFullscreen" title="Toggle fullscreen">⛶ Fullscreen</button>
    <button id="prev">◀ Prev</button>
    <select id="preset"></select>
    <button id="next">Next ▶</button>
    <label>Blend <input id="blend" type="range" min="0" max="5" step="0.1" value="1.5"></label>
    <label><input id="auto" type="checkbox"> Auto-cycle</label>
    <label><input id="lowIntensity" type="checkbox"> Low-Intensity</label>
    <label>Intensity <input id="intensity" type="range" min="0" max="100" step="1" value="0"> <span id="intensityVal">0</span></label>
    <span class="hint">Tip: select <b>Stereo Mix</b> on Windows to capture desktop audio.</span>
    <span id="fallbackNote" class="hint"></span>
  </div>

  <main class="layout">
    <aside id="metricsPanel" class="slide-panel">
      <header>
        <h2>Signal</h2>
        <div id="beatLamp" class="beat-lamp" title="Beat indicator"></div>
      </header>
      <canvas id="metricsChart"></canvas>
     <div class="metrics-table">
      <span>RMS</span><span id="metricRms">0.000</span>
      <span>Peak Bin</span><span id="metricPeak">0 (0)</span>
      <span>Bass</span><span id="metricBass">0</span>
      <span>Mid</span><span id="metricMid">0</span>
      <span>Treble</span><span id="metricTreble">0</span>
      <span>Blend / α</span><span id="metricIntensity">blend ≥1.5s, α≤0.50</span>
       <span>Favorites</span>
       <span>
         <button id="favSave" title="Save current preset">⭐ Save</button>
         <select id="favList" style="min-width:160px"></select>
         <button id="favLoad" title="Load selected favorite">Load</button>
       </span>
    </div>
    <div class="input-block">
      <span class="input-label">Input Source</span>
     <div class="input-controls">
       <div style="display:flex;align-items:center;gap:.5rem;flex:1;min-width:0">
         <div id="levelMeter" title="Input level" style="width:42px;height:10px;border-radius:4px;background:#0b1520;border:1px solid #20344a;position:relative;overflow:hidden">
           <div id="levelFill" style="position:absolute;inset:0;transform-origin:left center;background:linear-gradient(90deg,#18d,#6ef);transform:scaleX(0)"></div>
         </div>
         <select id="inputDevice" style="flex:1;min-width:0"></select>
         <button id="refreshDevices" title="Refresh available audio inputs">↻</button>
       </div>
     </div>
    </div>
  </aside>
    <div class="visual-area">
      <canvas id="vis"></canvas>
    </div>
  </main>

  <script>
    (async () => {
      const libsOk = await ensureButterchurnLoaded();

      const canvas = document.getElementById('vis');
      const presetSel = document.getElementById('preset');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const startMicBtn = document.getElementById('startMic');
      const btnSelfTest = document.getElementById('btnSelfTest');
      const btnMetrics = document.getElementById('btnMetrics');
      const btnTheatre = document.getElementById('btnTheatre');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const blend = document.getElementById('blend');
      const auto = document.getElementById('auto');
      const lowIntensity = document.getElementById('lowIntensity');
      const intensity = document.getElementById('intensity');
      const intensityVal = document.getElementById('intensityVal');
      const fallbackNote = document.getElementById('fallbackNote');

      const metricsCanvas = document.getElementById('metricsChart');
      const metricsCtx = metricsCanvas.getContext('2d');
      const metricRms = document.getElementById('metricRms');
      const metricPeak = document.getElementById('metricPeak');
      const metricBass = document.getElementById('metricBass');
      const metricMid = document.getElementById('metricMid');
      const metricTreble = document.getElementById('metricTreble');
       const metricIntensity = document.getElementById('metricIntensity');
       const beatLamp = document.getElementById('beatLamp');
       const inputSelect = document.getElementById('inputDevice');
      const btnRefreshDevices = document.getElementById('refreshDevices');
      const metricsPanel = document.getElementById('metricsPanel');
       const LS = window.localStorage;
       const levelFill = document.getElementById('levelFill');
       const favSave = document.getElementById('favSave');
       const favList = document.getElementById('favList');
       const favLoad = document.getElementById('favLoad');

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      const resume = () => { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); };
      document.addEventListener('pointerdown', resume, { once: true });
      document.addEventListener('keydown', resume, { once: true });

      const freqData = new Uint8Array(analyser.frequencyBinCount);
      const timeData = new Uint8Array(analyser.fftSize);
      const binHz = ctx.sampleRate / analyser.fftSize;

      let prevRms = 0;
      let beatHold = 0;
      let lastIntensityLabel = '';
      let inputStream = null;
      let inputNode = null;
      let availableInputs = [];

      window.MILK = window.MILK || {};
      window.MILK.analyser = analyser;
      window.MILK.getSpectrum = () => Uint8Array.from(freqData);
      window.MILK.currentDeviceId = window.MILK.currentDeviceId || '';

      let visualizer = null;
      let fallbackRenderer = null;

      function resizeMetricsCanvas() {
        const rect = metricsCanvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width * dpr));
        const h = Math.max(1, Math.round(rect.height * dpr));
        if (metricsCanvas.width !== w || metricsCanvas.height !== h) {
          metricsCanvas.width = w;
          metricsCanvas.height = h;
          metricsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

       async function enumerateInputs(forcePermission = false) {
        try {
          if (forcePermission) {
            const tmpStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            tmpStream.getTracks().forEach(track => track.stop());
          }
          const devices = await navigator.mediaDevices.enumerateDevices();
          availableInputs = devices.filter(d => d.kind === 'audioinput');
          inputSelect.replaceChildren();
          if (!availableInputs.length) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'No audio inputs found';
            inputSelect.appendChild(opt);
            inputSelect.disabled = true;
            return;
          }
          inputSelect.disabled = false;
          availableInputs.forEach((device, idx) => {
            const opt = document.createElement('option');
            const id = device.deviceId || `device-${idx}`;
            opt.value = id;
            opt.textContent = device.label || `Input ${idx + 1}`;
            inputSelect.appendChild(opt);
          });
           const preferred = window.MILK.currentDeviceId || LS.getItem('milk.inputDeviceId') || '';
          if (preferred && availableInputs.some(d => d.deviceId === preferred)) {
            inputSelect.value = preferred;
          } else {
            window.MILK.currentDeviceId = availableInputs[0].deviceId;
            inputSelect.value = window.MILK.currentDeviceId;
          }
        } catch (err) {
          console.warn('Enumerate inputs failed', err);
        }
      }

      async function connectInput(deviceId, forcePermission = false) {
        try {
          if (forcePermission) {
            await enumerateInputs(true);
            deviceId = inputSelect.value;
          }
          if (inputNode) {
            inputNode.disconnect();
            inputNode = null;
          }
          if (inputStream) {
            inputStream.getTracks().forEach(track => track.stop());
            inputStream = null;
          }
          const audioConstraints = { echoCancellation:false, noiseSuppression:false, autoGainControl:false };
          if (deviceId) {
            audioConstraints.deviceId = deviceId === 'default'
              ? 'default'
              : { exact: deviceId };
          }
          const constraints = { audio: audioConstraints };
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          const node = ctx.createMediaStreamSource(stream);
          node.connect(analyser);
          inputStream = stream;
          inputNode = node;
          const track = stream.getAudioTracks()[0];
          const settingsId = track?.getSettings?.().deviceId;
          window.MILK.currentDeviceId = settingsId || deviceId || track?.label || '';
           if (window.MILK.currentDeviceId) LS.setItem('milk.inputDeviceId', window.MILK.currentDeviceId);
          await enumerateInputs(false);
          if (!inputSelect.disabled && window.MILK.currentDeviceId) {
            const match = availableInputs.find(d => d.deviceId === window.MILK.currentDeviceId);
            inputSelect.value = match ? match.deviceId : inputSelect.value;
          }
        } catch (err) {
          console.error('Audio init failed', err);
        }
      }

      const pxRatio = Math.min(window.devicePixelRatio || 1, 2);
      if (libsOk && window.butterchurn) {
        const bc = window.butterchurn.createVisualizer
          ? window.butterchurn
          : (window.butterchurn.default && window.butterchurn.default.createVisualizer ? window.butterchurn.default : null);
        if (bc) {
          visualizer = bc.createVisualizer(ctx, canvas, {
        width: canvas.clientWidth,
        height: canvas.clientHeight,
        pixelRatio: pxRatio
      });
      visualizer.connectAudio(analyser);
        }
      }

      if (!visualizer) {
        const fallbackCtx = canvas.getContext('2d');
        fallbackRenderer = (spectrum) => {
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.round(rect.width * dpr));
          const h = Math.max(1, Math.round(rect.height * dpr));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            fallbackCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }
          fallbackCtx.fillStyle = '#05070d';
          fallbackCtx.fillRect(0, 0, rect.width, rect.height);
          const bars = 96;
          const step = Math.max(1, Math.floor(spectrum.length / bars));
          for (let i = 0; i < bars; i++) {
            const v = spectrum[i * step] / 255;
            const bw = rect.width / bars;
            const bh = Math.max(2, v * rect.height * 0.85);
            fallbackCtx.fillStyle = `hsl(${190 + i * 0.8}, 80%, ${30 + v * 50}%)`;
            fallbackCtx.fillRect(i * bw, rect.height - bh, bw * 0.9, bh);
          }
        };
        fallbackNote.textContent = 'Visualizer unavailable; using spectrum fallback.';
      } else {
        fallbackNote.textContent = '';
      }

      let presets = libsOk && window.butterchurnPresets
        ? Object.assign({}, window.butterchurnPresets.getPresets())
        : {};
      let presetKeys = Object.keys(presets).sort();
      if (!visualizer) {
        presetKeys = ['Fallback Spectrum'];
      } else if (!presetKeys.length) {
        presets = { 'Resonai - Default (Neon Pulse)': { baseVals: { wave_a: 0.35, fDecay: 0.97 } } };
        presetKeys = Object.keys(presets);
        fallbackNote.textContent = 'Preset pack unavailable; using minimal local preset.';
      }

      presetSel.replaceChildren();
      presetKeys.forEach((key) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key;
        presetSel.appendChild(opt);
      });

      let current = 0;

      function updateIntensityIndicator() {
        const val = Number(intensity.value);
        const low = lowIntensity.checked;
        let minBlend = val > 0 ? Math.min(2.0 + (val * 0.02), 4.0) : 1.5;
        if (low && minBlend < 2.0) minBlend = 2.0;
        let cap = 0.5;
        if (val > 0) cap = Math.max(0.5 - (val * 0.003), 0.2);
        intensityVal.textContent = val;
        lastIntensityLabel = (val > 0 || low)
          ? `blend ≥${minBlend.toFixed(1)}s, α≤${cap.toFixed(2)}`
          : 'blend ≥1.5s, α≤0.50';
        metricIntensity.textContent = lastIntensityLabel;
        return { minBlend, cap };
      }

      updateIntensityIndicator();

      function load(index, explicitBlend) {
        current = (index + presetKeys.length) % presetKeys.length;
        presetSel.value = presetKeys[current];
        if (!visualizer) return;

        let time = typeof explicitBlend === 'number' ? explicitBlend : Number(blend.value);
        const { minBlend, cap } = updateIntensityIndicator();
        if (time < minBlend) time = minBlend;

        let preset = presets[presetSel.value];
        if (preset) {
          preset = JSON.parse(JSON.stringify(preset));
          if (preset.baseVals) {
            if (preset.baseVals.wave_a !== undefined) {
              let newWave = preset.baseVals.wave_a;
              if (lowIntensity.checked) newWave *= 0.5;
              preset.baseVals.wave_a = Math.min(newWave, cap);
            }
            if (preset.baseVals.fDecay !== undefined && lowIntensity.checked) {
              preset.baseVals.fDecay = Math.min(preset.baseVals.fDecay + 0.005, 0.99);
            }
          }
        }
        visualizer.loadPreset(preset, time);
      }

      presetSel.addEventListener('change', () => load(presetKeys.indexOf(presetSel.value), Number(blend.value)));
      prevBtn.addEventListener('click', () => load(current - 1, Number(blend.value)));
      nextBtn.addEventListener('click', () => load(current + 1, Number(blend.value)));

       function refreshFavorites() {
         const raw = LS.getItem('milk.favorites') || '[]';
         let arr = [];
         try { arr = JSON.parse(raw); } catch { arr = []; }
         favList.replaceChildren();
         arr.forEach(name => {
           const opt = document.createElement('option');
           opt.value = name; opt.textContent = name; favList.appendChild(opt);
         });
       }
       favSave.addEventListener('click', () => {
         if (!presetSel.value || presetSel.value === 'Fallback Spectrum') return;
         const raw = LS.getItem('milk.favorites') || '[]';
         let arr = [];
         try { arr = JSON.parse(raw); } catch { arr = []; }
         if (!arr.includes(presetSel.value)) arr.push(presetSel.value);
         LS.setItem('milk.favorites', JSON.stringify(arr));
         refreshFavorites();
       });
       favLoad.addEventListener('click', () => {
         if (!favList.value) return;
         const idx = presetKeys.indexOf(favList.value);
         if (idx >= 0) load(idx, Number(blend.value));
       });

      function computeMetrics() {
        analyser.getByteFrequencyData(freqData);
        analyser.getByteTimeDomainData(timeData);

        let peakBin = 0;
        let peakVal = -Infinity;
        let sumSq = 0;
        for (let i = 0; i < freqData.length; i++) {
          const v = freqData[i];
          if (v > peakVal) { peakVal = v; peakBin = i; }
        }
        for (let i = 0; i < timeData.length; i++) {
          const centred = (timeData[i] - 128) / 128;
          sumSq += centred * centred;
        }
        const rms = Math.sqrt(sumSq / timeData.length);

        let bass = 0, mid = 0, tre = 0;
        let bassCount = 0, midCount = 0, treCount = 0;
        for (let i = 0; i < freqData.length; i++) {
          const hz = i * binHz;
          const v = freqData[i];
          if (hz < 250) { bass += v; bassCount++; }
          else if (hz < 2000) { mid += v; midCount++; }
          else if (hz < 8000) { tre += v; treCount++; }
        }

        const beat = (rms - prevRms) > 0.03 && rms > 0.06;
        prevRms = rms * 0.6 + prevRms * 0.4;

        return {
          rms,
          peakBin,
          peakVal,
          bass: bassCount ? bass / bassCount : 0,
          mid: midCount ? mid / midCount : 0,
          tre: treCount ? tre / treCount : 0,
          beat
        };
      }

      function updateMetricsHUD(stats) {
        metricRms.textContent = stats.rms.toFixed(3);
        metricPeak.textContent = `${stats.peakBin} (${stats.peakVal})`;
        metricBass.textContent = stats.bass.toFixed(0);
        metricMid.textContent = stats.mid.toFixed(0);
        metricTreble.textContent = stats.tre.toFixed(0);
        metricIntensity.textContent = lastIntensityLabel;
        if (stats.beat) beatHold = 6;
        if (beatHold > 0) beatHold--;
        beatLamp.classList.toggle('active', beatHold > 0);
      }

       function drawMetricsChart() {
        resizeMetricsCanvas();
        const width = metricsCanvas.clientWidth;
        const height = metricsCanvas.clientHeight;

        metricsCtx.fillStyle = '#05070d';
        metricsCtx.fillRect(0, 0, width, height);

        metricsCtx.beginPath();
        const len = freqData.length;
        for (let i = 0; i < len; i++) {
          const x = width * (i / (len - 1));
          const y = height - (freqData[i] / 255) * height;
          if (i === 0) metricsCtx.moveTo(x, y); else metricsCtx.lineTo(x, y);
        }
        metricsCtx.strokeStyle = '#7dd3fc';
        metricsCtx.lineWidth = 1.5;
        metricsCtx.stroke();
        metricsCtx.lineTo(width, height);
        metricsCtx.lineTo(0, height);
        metricsCtx.closePath();
        metricsCtx.fillStyle = 'rgba(125,211,252,0.12)';
        metricsCtx.fill();

         // Update compact input level meter (peak of recent FFT bins)
         const peak = Math.max(...freqData);
         if (levelFill) {
           const ratio = Math.max(0.02, peak / 255);
           levelFill.style.transform = `scaleX(${ratio.toFixed(3)})`;
         }
      }

       blend.addEventListener('input', () => { LS.setItem('milk.blend', String(blend.value)); load(current, Number(blend.value)); });
      intensity.addEventListener('input', () => { updateIntensityIndicator(); load(current, Number(blend.value)); });
      lowIntensity.addEventListener('change', () => {
         LS.setItem('milk.low', lowIntensity.checked ? '1' : '0');
         updateIntensityIndicator();
        load(current, Number(blend.value));
        if (auto.checked) startAuto();
      });

      btnSelfTest.addEventListener('click', () => {
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.0001;
          osc.type = 'sawtooth';
          osc.frequency.value = 110;
          osc.connect(gain).connect(analyser);
          gain.connect(ctx.destination);
          osc.start();
          console.log('[MILK] Self-Test tone started (near-silent)');
        } catch (e) {
          console.warn('[MILK] Self-Test failed', e);
        }
      });

      inputSelect.addEventListener('change', () => {
        if (inputSelect.disabled) return;
        connectInput(inputSelect.value).catch(err => console.error(err));
      });

      btnRefreshDevices.addEventListener('click', () => {
        enumerateInputs(true).catch(err => console.error(err));
      });

      startMicBtn.addEventListener('click', async () => {
        await connectInput(inputSelect.disabled ? '' : inputSelect.value, true);
      });

      let timer = null;
      function startAuto() {
        if (!visualizer) return;
        const interval = lowIntensity.checked ? 30000 : 20000;
        clearInterval(timer);
        timer = setInterval(() => load(current + 1, Number(blend.value)), interval);
      }
      auto.addEventListener('change', () => { if (auto.checked) startAuto(); else { clearInterval(timer); timer = null; } });

       btnMetrics.addEventListener('click', () => {
         const on = !document.body.classList.contains('panel-open');
         document.body.classList.toggle('panel-open', on);
         LS.setItem('milk.panelOpen', on ? '1' : '0');
         requestAnimationFrame(resizeMetricsCanvas);
       });
       btnTheatre.addEventListener('click', () => { const on=!document.body.classList.contains('theatre'); document.body.classList.toggle('theatre', on); LS.setItem('milk.theatre',''+on); });
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
        else document.exitFullscreen?.().catch(() => {});
      });

      document.addEventListener('keydown', (ev) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(ev.target.tagName)) return;
        switch (ev.key) {
          case 'ArrowLeft':
            ev.preventDefault();
            load(current - 1, Number(blend.value));
            break;
          case 'ArrowRight':
            ev.preventDefault();
            load(current + 1, Number(blend.value));
            break;
          case 'f': case 'F':
            ev.preventDefault();
            btnFullscreen.click();
            break;
          case 't': case 'T':
            ev.preventDefault();
            btnTheatre.click();
            break;
          case 'm': case 'M':
            ev.preventDefault();
            btnMetrics.click();
            break;
        }
      });

      function frame() {
        const stats = computeMetrics();
        updateMetricsHUD(stats);
        drawMetricsChart();
        if (visualizer) {
          visualizer.render();
          visualizer.setRendererSize(canvas.clientWidth, canvas.clientHeight);
        } else if (fallbackRenderer) {
          fallbackRenderer(freqData);
        }
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', () => {
        if (visualizer) visualizer.setRendererSize(canvas.clientWidth, canvas.clientHeight);
        resizeMetricsCanvas();
      });

       await enumerateInputs(false);
      resizeMetricsCanvas();
       // Restore session settings
       const savedBlend = LS.getItem('milk.blend'); if (savedBlend) { blend.value = savedBlend; }
       const savedLow = LS.getItem('milk.low')==='1'; lowIntensity.checked = savedLow;
       updateIntensityIndicator();
       // Restore session toggles
        if (LS.getItem('milk.theatre')==='true') document.body.classList.add('theatre');
        if (LS.getItem('milk.panelOpen')==='1') document.body.classList.add('panel-open');
       refreshFavorites();
      if (visualizer && presetKeys.length) load(Math.floor(Math.random() * presetKeys.length), 0);
      if (auto.checked) startAuto();
      frame();
    })();
  </script>
</body>
</html>
