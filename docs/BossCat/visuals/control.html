<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BossCat Visual Control — Resonai</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;background:#0b0f14;color:#cfe8ff;font-family:system-ui,"Segoe UI",Arial,sans-serif}
    .topbar{display:flex;gap:.5rem;align-items:center;padding:.5rem .75rem;position:sticky;top:0;background:#0b0f14cc;backdrop-filter:saturate(1.2) blur(6px);z-index:10;border-bottom:1px solid #12202d}
    .topbar h1{font-size:1rem;margin:.25rem .75rem .25rem 0;color:#7dd3fc}
    button,select,input[type="checkbox"]{font:inherit}
    button{background:#13293d;color:#cfe8ff;border:1px solid #1b3a52;border-radius:6px;padding:.45rem .65rem;cursor:pointer}
    button:hover{background:#0f2233}
    select{background:#0b1520;color:#cfe8ff;border:1px solid #1b3a52;border-radius:6px;padding:.35rem .5rem}
    label{display:inline-flex;align-items:center;gap:.35rem}
    #blend{width:160px;vertical-align:middle}
    .wrap{position:relative;height:calc(100% - 52px)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hint{opacity:.7;font-size:.85rem}
  </style>
  <!-- Butterchurn + presets (primary CDN: unpkg; fallback: jsDelivr) -->
  <script src="https://unpkg.com/butterchurn@2.6.7/dist/butterchurn.min.js"></script>
  <script src="https://unpkg.com/butterchurn-presets@2.6.7/dist/butterchurnPresets.min.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="description" content="BossCat Visual Control Surface for Resonai default visualization" />
  <meta name="x-bosscat-tetragram" content="MILK" />
  <meta name="robots" content="noindex" />
  <script>
    // Minimal command bridge via postMessage
    window.addEventListener('message', (ev) => {
      if (!ev || !ev.data) return;
      const msg = ev.data;
      if (msg && msg.type === 'bosscat:visu') {
        const { cmd, arg } = msg;
        if (cmd === 'setBlendTime') {
          const s = document.getElementById('blend'); if (s) s.value = String(arg || 1.5);
        } else if (cmd === 'next') {
          const b = document.getElementById('next'); b && b.click();
        } else if (cmd === 'prev') {
          const b = document.getElementById('prev'); b && b.click();
        } else if (cmd === 'auto' && typeof arg === 'boolean') {
          const c = document.getElementById('auto'); if (c) { c.checked = !!arg; c.dispatchEvent(new Event('change')); }
        }
      }
    });
  </script>
  <script>
    // Multi-CDN loader: ensure butterchurn is available; if unpkg is blocked, try jsDelivr
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function ensureButterchurnLoaded() {
      // If already present from unpkg tags, use it
      if (window.butterchurn && window.butterchurnPresets) return true;
      // Try jsDelivr fallback
      try {
        await loadScript('https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/dist/butterchurn.min.js');
        await loadScript('https://cdn.jsdelivr.net/npm/butterchurn-presets@2.6.7/dist/butterchurnPresets.min.js');
      } catch (_) {}
      return !!(window.butterchurn && window.butterchurnPresets);
    }
  </script>
  <script>
    // Prevent errors if butterchurn is not yet loaded
    window.butterchurn = window.butterchurn || undefined;
    window.butterchurnPresets = window.butterchurnPresets || { getPresets: () => ({}) };
  </script>
</head>
<body>
  <div class="topbar">
    <h1>🎨 BossCat Visual Control</h1>
    <button id="startMic">Start Mic</button>
    <button id="prev">◀ Prev</button>
    <select id="preset"></select>
    <button id="next">Next ▶</button>
    <button id="fullscreen" title="Fullscreen">⛶ Full</button>
    <label>Blend <input id="blend" type="range" min="0" max="5" step="0.1" value="1.5"></label>
    <label><input id="auto" type="checkbox"> Auto‑cycle</label>
    <label><input id="lowIntensity" type="checkbox"> Low‑Intensity</label>
    <label>Intensity <input id="intensity" type="range" min="0" max="100" step="1" value="0"> <span id="intensityVal">0</span></label>
    <span id="effectiveSettings" style="opacity:0.6;font-size:0.85rem"></span>
    <span class="hint">Tip: select <b>Stereo Mix</b> on Windows to capture desktop audio.</span>
  </div>
  <div class="wrap"><canvas id="vis"></canvas></div>

  <script>
    (async () => {
      const libsOk = await ensureButterchurnLoaded();
      const canvas = document.getElementById('vis');
      const presetSel = document.getElementById('preset');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const fsBtn = document.getElementById('fullscreen');
      const startMicBtn = document.getElementById('startMic');
      const blend = document.getElementById('blend');
      const auto = document.getElementById('auto');
      const lowIntensity = document.getElementById('lowIntensity');
      const intensity = document.getElementById('intensity');

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;

      const pxRatio = Math.min(window.devicePixelRatio || 1, 2);
      let visualizer = null;
      let fallbackRenderer = null;
      if (libsOk && window.butterchurn) {
        visualizer = butterchurn.createVisualizer(ctx, canvas, {
          width: canvas.clientWidth,
          height: canvas.clientHeight,
          pixelRatio: pxRatio
        });
        visualizer.connectAudio(analyser);
      } else {
        // Offline spectrum fallback so visuals still render
        const bar = { ctx, canvas, analyser };
        fallbackRenderer = () => {
          const { width, height } = canvas.getBoundingClientRect();
          const c = canvas.getContext('2d');
          const bins = 64; const data = new Uint8Array(bins);
          analyser.fftSize = 2048; analyser.getByteFrequencyData(data);
          c.fillStyle = '#0b0f14'; c.fillRect(0, 0, width, height);
          const w = width / bins;
          for (let i = 0; i < bins; i++) {
            const v = data[i] / 255; const h = v * (height - 10);
            c.fillStyle = `hsl(${200 + i},70%,${40 + v*40}%)`;
            c.fillRect(i * w, height - h, w * 0.9, h);
          }
        };
        const warn = document.createElement('span');
        warn.className = 'hint';
        warn.textContent = 'Visualizer CDN unavailable; using mic spectrum fallback.';
        document.querySelector('.topbar')?.appendChild(warn);
      }

      let presets = libsOk ? Object.assign({}, butterchurnPresets.getPresets()) : {};
      let presetKeys = Object.keys(presets).sort();
      if (!libsOk) {
        // No butterchurn available → single fallback option
        presetKeys = ['Fallback Spectrum'];
      } else if (!presetKeys.length) {
        // Library loaded but preset pack blocked → minimal safe preset
        presets = { 'Resonai - Default (Neon Pulse)': { baseVals: { wave_a: 0.35, fDecay: 0.97 } } };
        presetKeys = Object.keys(presets);
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = 'Preset pack unavailable; using minimal local preset.';
        document.querySelector('.topbar')?.appendChild(hint);
      }
      presetKeys.forEach(k => {
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = k; presetSel.appendChild(opt);
      });

      let current = 0;
      function load(i, t) {
        let time = typeof t === 'number' ? t : Number(blend.value);
        const intensityVal = Number(intensity.value);
        
        // Apply intensity scaling: minBlend = 2s + (intensity * 0.02) up to 4s
        if (intensityVal > 0) {
          const minBlend = Math.min(2.0 + (intensityVal * 0.02), 4.0);
          if (time < minBlend) time = minBlend;
        }
        
        // Low-Intensity as hard floor
        if (lowIntensity.checked && time < 2.0) time = 2.0;
        
        current = (i + presetKeys.length) % presetKeys.length;
        presetSel.value = presetKeys[current];
        if (!libsOk) { return; } // spectrum fallback ignores presets
        let preset = presets[presetSel.value];
        
        // Apply intensity + low-intensity adjustments
        if ((lowIntensity.checked || intensityVal > 0) && preset) {
          preset = JSON.parse(JSON.stringify(preset));
          if (preset.baseVals) {
            // Intensity wave_a cap: 0.5 − (intensity * 0.003) down to ~0.2
            let waveACap = 0.5;
            if (intensityVal > 0) waveACap = Math.max(0.5 - (intensityVal * 0.003), 0.2);
            
            if (preset.baseVals.wave_a !== undefined) {
              let newWave = preset.baseVals.wave_a;
              if (lowIntensity.checked) newWave = newWave * 0.5; // halve first
              preset.baseVals.wave_a = Math.min(newWave, waveACap); // apply cap
            }
            
            if (preset.baseVals.fDecay !== undefined && lowIntensity.checked) {
              preset.baseVals.fDecay = Math.min(preset.baseVals.fDecay + 0.005, 0.99);
            }
          }
        }
        
        visualizer.loadPreset(preset, time);
      }
      presetSel.addEventListener('change', () => load(presetKeys.indexOf(presetSel.value), Number(blend.value)));
      prevBtn.addEventListener('click', () => load(current - 1, Number(blend.value)));
      nextBtn.addEventListener('click', () => load(current + 1, Number(blend.value)));

      let timer = null;
      function startAuto() {
        const interval = lowIntensity.checked ? 30000 : 20000; // longer interval in low-intensity
        clearInterval(timer);
        timer = setInterval(() => load(current + 1, Number(blend.value)), interval);
      }
      auto.addEventListener('change', () => {
        if (auto.checked) { startAuto(); } else { clearInterval(timer); timer = null; }
      });
      lowIntensity.addEventListener('change', () => {
        if (auto.checked) startAuto(); // restart auto with new interval
        updateEffectiveSettings();
      });
      
      // Update effective settings display
      function updateEffectiveSettings() {
        const intensityVal = Number(intensity.value);
        const lowInt = lowIntensity.checked;
        let minBlend = 0, waveACap = 0.5;
        
        if (intensityVal > 0) minBlend = Math.min(2.0 + (intensityVal * 0.02), 4.0);
        if (lowInt && minBlend < 2.0) minBlend = 2.0;
        
        if (intensityVal > 0) waveACap = Math.max(0.5 - (intensityVal * 0.003), 0.2);
        
        document.getElementById('intensityVal').textContent = intensityVal;
        if (intensityVal > 0 || lowInt) {
          document.getElementById('effectiveSettings').textContent = 
            `blend ≥${minBlend.toFixed(1)}s, wave α ≤${waveACap.toFixed(2)}`;
        } else {
          document.getElementById('effectiveSettings').textContent = '';
        }
      }
      
      intensity.addEventListener('input', updateEffectiveSettings);
      updateEffectiveSettings(); // initial

      function resize(){ if (visualizer) visualizer.setRendererSize(canvas.clientWidth, canvas.clientHeight); }
      window.addEventListener('resize', resize);
      document.addEventListener('fullscreenchange', resize);

      if (presetKeys.length) { load(Math.floor(Math.random()*presetKeys.length), 0); }

      function frame(){
        if (visualizer) visualizer.render();
        else if (fallbackRenderer) fallbackRenderer();
        requestAnimationFrame(frame);
      }
      frame(); resize();

      // Fullscreen toggle for giant visualization
      fsBtn.addEventListener('click', async () => {
        const wrap = document.querySelector('.wrap');
        try {
          if (!document.fullscreenElement) {
            await wrap.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (e) { console.warn('Fullscreen not available', e); }
      });

      startMicBtn.addEventListener('click', async () => {
        try {
          // Request permission first to reveal device labels
          await navigator.mediaDevices.getUserMedia({ audio: true });
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(d => d.kind === 'audioinput');
          const stereo = audioInputs.find(d => /stereo\s*mix/i.test(d.label));
          const constraints = stereo ? 
            { audio: { deviceId: { exact: stereo.deviceId }, echoCancellation:false, noiseSuppression:false, autoGainControl:false } } :
            { audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } };
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          const src = ctx.createMediaStreamSource(stream); src.connect(analyser);
        } catch (e) {
          console.error('Audio init failed', e);
        }
      });
    })();
  </script>
</body>
</html>
