# Custom Feed Rules for SkyFeed or Feed Generator
# Copy/paste these into SkyFeed builder or use as reference for code implementation

feeds:
  - name: "Fact-Check Firehose (Trusted)"
    uri_suffix: factcheck-firehose
    description: "Real-time fact-checks from verified orgs (Full Fact, AFP, PolitiFact, Reuters) + community posts citing them."
    
    rules:
      include:
        - type: author
          values:
            - fullfact.org
            - factcheck.afp.com
            - politifact.bsky.social
            - reuters.com
        
        - type: quoted_post_author
          values:
            - fullfact.org
            - factcheck.afp.com
            - politifact.bsky.social
            - reuters.com
        
        - type: hashtag
          values:
            - FactCheck
            - Debunk
            - Misinformation
        
        - type: text_contains
          values:
            - "fact check"
            - "debunk"
            - "false claim"
      
      exclude:
        - type: text_contains
          values:
            - satire
            - parody
            - "[satirical]"

  - name: "OSINT + Verification"
    uri_suffix: osint-verification
    description: "Media forensics, geolocation, and verification threads from Bellingcat, Sector035, and the OSINT community."
    
    rules:
      include:
        - type: author
          values:
            - bellingcat.com
            - eliothiggins.bsky.social
            - sector035.bsky.social
            - mariannaspringbbc.bsky.social
            - quiztime.bsky.social
        
        - type: hashtag
          values:
            - OSINT
            - Geolocation
            - Verification
        
        - type: text_contains
          values:
            - "verify"
            - "verification"
            - "geolocation"
            - "media forensics"
            - "reverse image"
            - "EXIF"
            - "geolocate"
        
        - type: quoted_post_author
          values:
            - bellingcat.com
            - eliothiggins.bsky.social
            - sector035.bsky.social

  - name: "AntiClickbait HQ"
    uri_suffix: anticlickbait-hq
    description: "BossCat's evidence-first posts + community engagement with #AntiClickbait and transparent observability."
    
    rules:
      include:
        - type: author
          values:
            - resonai.bsky.social
        
        - type: hashtag
          values:
            - AntiClickbait
        
        - type: text_contains
          values:
            - "hub.resonai.uk"
        
        - type: quoted_post_author
          values:
            - resonai.bsky.social
        
        - type: hashtag_with_text
          hashtag: OpenTelemetry
          must_contain:
            - evidence
            - transparency
      
      boost:
        - type: has_quoted_post
          multiplier: 1.5
        - type: has_alt_text
          multiplier: 1.2

