<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Milk Viewer</title>
  <style>
    :root { font-family: system-ui, Segoe UI, Roboto, sans-serif }
    body { margin: 0; background: #0b0f14; color: #e6eef8; display: grid; place-items: center; min-height: 100vh }
    .card { width: min(92vw, 960px); background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px 16px 24px }
    .row { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 12px }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 999px; background:#0ea5e9; color:#00111a }
    img { width: 100%; height: auto; display: block; border-radius: 8px; background: #000 }
    .muted { color: #9ca3af; font-size: 13px; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #2c3440; background:#151b23; color:#e6eef8; cursor:pointer }
    button:hover { background:#1b2330 }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <h2 style="margin:0">Milk Viewer</h2>
      <span class="badge" id="status">Starting…</span>
    </div>
    <img id="stream" src="/milk.mjpg" alt="Visualization stream"/>
    <div class="row" style="margin-top:12px">
      <small class="muted">Source: md3-engine Butterchurn @ <span id="geom">1920×1080</span> · MJPEG <span id="fps">15</span> fps</small>
      <div>
        <button onclick="reload()">Reload</button>
      </div>
    </div>
  </div>
  <script>
    async function refreshMeta(){
      const elFps = document.getElementById('fps');
      const elGeom = document.getElementById('geom');
      const elStatus = document.getElementById('status');
      try {
        const r = await fetch('/milk/health', { cache: 'no-store' });
        const j = await r.json();
        elFps.textContent = j.fps;
        elGeom.textContent = j.geometry || '1280×720';
        elStatus.textContent = 'LIVE';
        elStatus.style.background = '#10b981';
        elStatus.style.color = '#00140f';
      } catch {
        elStatus.textContent = 'OFFLINE';
        elStatus.style.background = '#ef4444';
        elStatus.style.color = '#1a0000';
      }
    }
    function reload(){
      const img = document.getElementById('stream');
      img.src = '/milk.mjpg?t=' + Date.now();
    }
    refreshMeta();
    setInterval(refreshMeta, 3000);
  </script>
</body>
</html>
