# Edge Writer Configuration - Direct OTLP → ClickHouse v3
# Bypasses flaky SigNoz transformer hop for reliable trace persistence

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 8192
    timeout: 2s

exporters:
  # Direct ClickHouse exporter (v3 schema compatible)
  clickhousetraces:
    # Native TCP to ClickHouse inside the compose network
    datasource: "tcp://signoz-clickhouse:9000/signoz_traces"
    low_cardinal_exception_grouping: false
    use_new_schema: true
    # Keep default table mapping (v3) enabled by image
    # No resource upserts - preserves service.name=canary-test

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
  
  extensions: []
