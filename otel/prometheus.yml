# Prometheus Configuration for OpenTelemetry Agent Metrics
# Scrapes metrics from the OTel collector

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # Add alert rules here if needed

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
