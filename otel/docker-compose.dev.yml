# Docker Compose for OpenTelemetry Collector Development
# Provides local development environment for agent telemetry testing

version: '3.8'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-dev-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./collector.dev.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics
      - "13133:13133" # Health check
      - "1777:1777"   # pprof
      - "55679:55679" # zpages
    environment:
      - OTEL_LOG_LEVEL=info
    networks:
      - otel-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: otel-dev-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - otel-dev

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: otel-dev-zipkin
    ports:
      - "9411:9411" # Zipkin UI
    networks:
      - otel-dev

  prometheus:
    image: prom/prometheus:latest
    container_name: otel-dev-prometheus
    ports:
      - "9090:9090" # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - otel-dev

  grafana:
    image: grafana/grafana:latest
    container_name: otel-dev-grafana
    ports:
      - "3000:3000" # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - otel-dev

networks:
  otel-dev:
    driver: bridge

volumes:
  grafana-storage:
