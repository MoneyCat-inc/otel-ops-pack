# Jaeger Integration Template
# Copy this template and customize for your Jaeger setup
# 
# =============================================================================
# JAEGER EXPORTER CONFIGURATION
# =============================================================================
exporters:
  jaeger:
    # Basic Jaeger configuration
    endpoint: http://localhost:14268/api/traces # Jaeger collector endpoint
    tls:
      insecure: true # Set to false for production with TLS
    # Retry configuration
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    # Queue configuration
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 8192
      storage: file_storage
      # Optional: Custom headers
# headers:

#   X-Custom-Header: "value"

# Optional: Timeout configuration

# timeout: 30s

# =============================================================================

# JAEGER RECEIVER CONFIGURATION (Optional)

# =============================================================================

# If you want to receive traces directly from Jaeger clients:
receivers:
  jaeger:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14250
      thrift_http:
        endpoint: 127.0.0.1:14268
      thrift_compact:
        endpoint: 127.0.0.1:6831
      thrift_binary:
        endpoint: 127.0.0.1:6832
# =============================================================================
# PIPELINE INTEGRATION

# =============================================================================

# Add to your service pipelines:

# service:

#   pipelines:

#     traces:

#       receivers: [otlp, jaeger]  # Add jaeger receiver if needed

#       processors: [resource/defaults, tail_sampling, memory_limiter, batch]

#       exporters: [otlp, jaeger]  # Add jaeger exporter

# =============================================================================

# CUSTOMIZATION OPTIONS

# =============================================================================

# 1. Multiple Jaeger endpoints:

# endpoint: http://jaeger1:14268/api/traces,http://jaeger2:14268/api/traces

# 2. Authentication:

# headers:

#   Authorization: "Bearer ${JAEGER_TOKEN}"

# 3. Custom timeout:

# timeout: 60s

# 4. TLS configuration:

# tls:

#   insecure: false

#   ca_file: /path/to/ca.pem

#   cert_file: /path/to/client.pem

#   key_file: /path/to/client.key

# 5. Custom queue settings:

# sending_queue:

#   num_consumers: 8

#   queue_size: 16384

# =============================================================================

# VERIFICATION COMMANDS

# =============================================================================

# Test Jaeger connectivity:

# Invoke-WebRequest -Uri http://localhost:14268/api/traces -UseBasicParsing

# Validate configuration:

# C:\otel\config-schema.ps1 -ConfigPath C:\otel\config.yaml

# Apply configuration:

# C:\otel\safe-apply-config.ps1 -Candidate C:\otel\config.candidate.yaml

# Verify trace collection:

# C:\otel\canary-check-min.ps1
