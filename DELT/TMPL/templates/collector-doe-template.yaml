receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:{{INGEST_GRPC_PORT}}
      http:
        endpoint: 0.0.0.0:{{INGEST_HTTP_PORT}}

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: {{MEMORY_LIMIT_MIB}}
    spike_limit_mib: {{MEMORY_LIMIT_MIB}}
  
  batch/traces:
    timeout: {{TRACES_TIMEOUT_MS}}ms
    send_batch_size: {{SEND_BATCH_MAX_SIZE}}
    send_batch_max_size: {{SEND_BATCH_MAX_SIZE}}
    metadata_keys:
      - service.name
      - run.id
      - run.stage
  
  batch/metrics:
    timeout: {{METRICS_TIMEOUT_MS}}ms
    send_batch_size: {{SEND_BATCH_MAX_SIZE}}
    send_batch_max_size: {{SEND_BATCH_MAX_SIZE}}
    metadata_keys:
      - service.name
      - run.id
      - run.stage
  
  batch/logs:
    timeout: {{LOGS_TIMEOUT_MS}}ms
    send_batch_size: {{SEND_BATCH_MAX_SIZE}}
    send_batch_max_size: {{SEND_BATCH_MAX_SIZE}}
    metadata_keys:
      - service.name
      - run.id
      - run.stage
  
  attributes/run:
    actions:
      - action: upsert
        key: run.id
        value: {{RUN_ID}}
      - action: upsert
        key: run.stage
        value: {{RUN_STAGE}}
      - action: upsert
        key: run.label
        value: {{RUN_LABEL}}
      - action: upsert
        key: experiment.timestamp
        value: {{EXPERIMENT_TIMESTAMP}}
      - action: upsert
        key: service.name
        value: otel-doe-collector

exporters:
  debug:
    verbosity: basic
  
  otlp/signoz:
    endpoint: http://localhost:4317
    tls:
      insecure: true
    compression: {{COMPRESSION}}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: {{RETRY_MAX_ELAPSED_MINUTES}}m
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: {{NUM_CONSUMERS}}
      queue_size: {{QUEUE_SIZE}}

extensions:
  health_check:
    endpoint: 0.0.0.0:{{HEALTH_PORT}}
    path: /healthz
  pprof:
    endpoint: 0.0.0.0:{{PPROF_PORT}}
  file_storage:
    directory: C:\ProgramData\OTel\wal\{{RUN_ID}}

service:
  extensions: [health_check, pprof, file_storage]
  telemetry:
    metrics:
      address: 0.0.0.0:{{METRICS_PORT}}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/run, batch/traces]
      exporters: [debug, otlp/signoz]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/run, batch/metrics]
      exporters: [debug, otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/run, batch/logs]
      exporters: [debug, otlp/signoz]