# AWS Distro for OpenTelemetry (ADOT) Collector Configuration
# Compatible with current OTel setup - OTLP receivers preserved
# Deployment: EKS/ECS with ADOT Operator or ECS Task Definition

receivers:
  # OTLP receivers (gRPC + HTTP) - matches current setup
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"
  
  # AWS-specific receivers (optional, for hybrid cloud)
  awsxray:
    endpoint: 0.0.0.0:2000
    transport: udp
    # Remote sampling configuration (for legacy AWS X-Ray SDKs)
    proxy_server:
      endpoint: 0.0.0.0:2000
      proxy_address: ""  # Optional: forward to X-Ray service for sampling rules
  
  # Prometheus scraping (optional)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Batching for efficiency (matches current 200ms target)
  batch:
    timeout: 200ms
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  
  # Resource detection (AWS-specific)
  resourcedetection/aws:
    detectors: [env, ec2, ecs, eks]
    timeout: 5s
    override: false
  
  # Attribute filtering (noise reduction)
  attributes:
    actions:
      - key: dataset
        action: upsert
        value: "resonai_analytics"

exporters:
  # SigNoz OTLP exporter (primary)
  otlp/signoz:
    endpoint: ${SIGNOZ_ENDPOINT:-localhost:4317}
    tls:
      insecure: ${SIGNOZ_INSECURE:-true}
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  
  # AWS CloudWatch Logs (optional, for hybrid observability)
  awscloudwatchlogs:
    log_group_name: "/aws/otel/resonai"
    log_stream_name: "collector-logs"
    region: ${AWS_REGION:-us-east-1}
  
  # AWS X-Ray (optional, for distributed tracing)
  awsxray:
    region: ${AWS_REGION:-us-east-1}
  
  # Logging exporter (debug)
  logging:
    loglevel: ${COLLECTOR_LOG_LEVEL:-info}
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  pprof:
    endpoint: 0.0.0.0:1777
  
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # Traces pipeline
    # Environment variables for exporter selection:
    #   TRACE_EXPORTER=signoz (default) - Export to SigNoz only
    #   TRACE_EXPORTER=xray - Export to AWS X-Ray only
    #   TRACE_EXPORTER=dual - Export to both (2x cost/data)
    traces:
      receivers: [otlp, awsxray]
      processors: [memory_limiter, resourcedetection/aws, attributes, batch]
      exporters: ["${TRACE_EXPORTER_PRIMARY:-otlp/signoz}", "${TRACE_EXPORTER_SECONDARY:-}", logging]
    
    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resourcedetection/aws, attributes, batch]
      exporters: [otlp/signoz, logging]
    
    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/aws, attributes, batch]
      exporters: [otlp/signoz, awscloudwatchlogs, logging]
  
  telemetry:
    logs:
      level: ${COLLECTOR_LOG_LEVEL:-info}
    metrics:
      address: 0.0.0.0:8888
      level: detailed

# Configuration Notes:
# 1. OTLP endpoints (4317/4318) match current Windows collector setup
# 2. Batch timeout 200ms matches current low-latency pipeline
# 3. SigNoz exporter uses same OTLP protocol (vendor-neutral)
# 4. AWS-specific exporters (CloudWatch, X-Ray) are optional
# 5. Resource detection auto-tags with AWS metadata (EC2, EKS, ECS)
# 6. Memory limiter prevents OOM (512 MiB soft limit)

# Environment Variables (set in deployment):
# - SIGNOZ_ENDPOINT: SigNoz OTLP endpoint (default: localhost:4317)
# - SIGNOZ_INSECURE: Skip TLS verification (default: true for local)
# - AWS_REGION: AWS region for CloudWatch/X-Ray (default: us-east-1)
# - COLLECTOR_LOG_LEVEL: Logging verbosity (default: info)
# - TRACE_EXPORTER_PRIMARY: Primary trace exporter (default: otlp/signoz)
#     Options: otlp/signoz, awsxray
# - TRACE_EXPORTER_SECONDARY: Secondary trace exporter (default: "", disabled)
#     Options: "", awsxray, otlp/signoz (enables dual egress - 2x cost)
#     Example: TRACE_EXPORTER_PRIMARY=otlp/signoz TRACE_EXPORTER_SECONDARY=awsxray

# Deployment Compatibility:
# - Local: docker-compose with ADOT image
# - EKS: ADOT Operator with CustomResource (see adot-operator-cr.yaml)
# - ECS: Task definition with ADOT sidecar
# - EC2: Systemd service with ADOT binary

# Validation:
# - YAML lint: yamllint adot-collector-config.yaml
# - Schema check: otelcol validate --config adot-collector-config.yaml
# - Local test: docker run --rm -v $(pwd):/config amazon/aws-otel-collector:latest --config /config/adot-collector-config.yaml

