# ECRR Compliance Pipeline
trigger:
  branches:
    include:
    - main
    - develop

pr:
  branches:
    include:
    - main

schedules:
- cron: "0 */6 * * *"  # Every 6 hours
  displayName: ECRR Compliance Check
  branches:
    include:
    - main

pool:
  vmImage: 'windows-latest'

variables:
  complianceThreshold: 95

stages:
- stage: ECRRCompliance
  displayName: 'ECRR Compliance Check'
  jobs:
  - job: ComplianceCheck
    displayName: 'Run Compliance Monitor'
    steps:
    - checkout: self
      fetchDepth: 0
      
    - task: PowerShell@2
      displayName: 'Setup PowerShell'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          
    - task: PowerShell@2
      displayName: 'Run ECRR Compliance Monitor'
      inputs:
        targetType: 'filePath'
        filePath: 'scripts/ecrr-compliance-monitor.ps1'
        arguments: '-GenerateReport'
        
    - task: PowerShell@2
      displayName: 'Check Compliance Threshold'
      inputs:
        targetType: 'inline'
        script: |
          $jsonFiles = Get-ChildItem artifacts/ecrr-compliance-report-*.json
          if ($jsonFiles.Count -eq 0) {
            Write-Host "❌ No compliance report found" -ForegroundColor Red
            exit 1
          }
          
          $data = Get-Content $jsonFiles[0].FullName | ConvertFrom-Json
          $rate = $data.Summary.ComplianceRate
          Write-Host "Compliance Rate: $rate%"
          
          if ($rate -lt $(complianceThreshold)) {
            Write-Host "❌ Compliance below $(complianceThreshold)% threshold" -ForegroundColor Red
            Write-Host "Non-compliant reports:" -ForegroundColor Red
            foreach ($nc in $data.Summary.NonCompliantFiles) {
              Write-Host "  - $($nc.File): $($nc.Issues -join ', ')" -ForegroundColor Red
            }
            exit 1
          } else {
            Write-Host "✅ Compliance meets $(complianceThreshold)% threshold" -ForegroundColor Green
          }
          
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Compliance Artifacts'
      condition: always()
      inputs:
        pathToPublish: 'artifacts'
        artifactName: 'ecrr-compliance-report'
        publishLocation: 'Container'