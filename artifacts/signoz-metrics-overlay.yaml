receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  signozclickhousemetrics:
    dsn: clickhouse://clickhouse:9000?username=default&password=&database=signoz_metrics

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: []
      exporters: [signozclickhousemetrics]
