version: '3.8'

services:
  deployment-pipeline-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "architecture=tetragrammaton"
      - "component=yod-foundation"
      - "service=deployment-pipeline-api"
    networks:
      - deployment-network

  # Optional: Add a reverse proxy for production-like setup
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - deployment-pipeline-api
    labels:
      - "architecture=tetragrammaton"
      - "component=he-interface"
    networks:
      - deployment-network

networks:
  deployment-network:
    driver: bridge
    labels:
      - "architecture=tetragrammaton"
      - "component=vav-validation"
