# BOSSCAT-022A: Windows OpenTelemetry Collector config (REFERENCE TEMPLATE)
# Canonical production config: C:\otel\config.yaml (see README.md in this folder)
# Purpose: Collect Windows host metrics and event logs for pipeline observability
# Notes:
# - Exposes internal telemetry at :8888 for local diagnostics
# - Sends all data to SigNoz OTLP gRPC on localhost:4317
# - Override via OTLP_GRPC_ENDPOINT environment variable if needed

receivers:
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      process:

  # Windows Event Log receiver
  # Note: If your collector version uses 'windowseventlog' instead, rename accordingly
  windowseventlog:
    channel: Application
    start_at: end
    poll_interval: 1s

  windowseventlog/system:
    channel: System
    start_at: end
    poll_interval: 1s

  # OTLP receiver for application telemetry (Gate #029 fix)
  # Accepts traces/metrics/logs from instrumented applications
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:5320  # Listen on port 5320 for gRPC (avoids PlariumPlay 5300-5319 block)
      http:
        endpoint: 0.0.0.0:5321  # Listen on port 5321 for HTTP

processors:
  batch:
    timeout: 200ms
    send_batch_size: 512
    send_batch_max_size: 1024

  memory_limiter:
    check_interval: 2s
    limit_mib: 512
    spike_limit_mib: 128

  # Add resource attributes for Windows host identification
  resource:
    attributes:
      - key: host.type
        value: windows
        action: upsert
      - key: deployment.environment
        value: ${env:DEPLOY_ENV}
        action: upsert

exporters:
  # Primary OTLP export to aggregator (gRPC)
  otlp:
    endpoint: localhost:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Debug exporter (replaces removed `logging` exporter; otelcol-contrib ≥0.111)
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
    metrics:
      address: "0.0.0.0:8888"

  pipelines:
    # Host metrics pipeline
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp, debug]

    # Windows Event Logs pipeline
    logs:
      receivers: [windowseventlog, windowseventlog/system]
      processors: [resource, batch]
      exporters: [otlp, debug]

    # Application traces pipeline (Gate #029 fix)
    # Forwards OTLP traces from instrumented apps to SigNoz
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp, debug]

