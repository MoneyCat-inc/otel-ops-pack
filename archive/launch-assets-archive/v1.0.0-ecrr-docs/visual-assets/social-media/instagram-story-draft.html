<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Story - ECRR v1.0.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #000000;
        }
        
        .story {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, #7C5CFF 0%, #00D4AA 50%, #FF6B6B 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        
        .story::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23dots)"/></svg>');
            opacity: 0.4;
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
        }
        
        .milestone {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #FFFFFF, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .version {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .status {
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 60px;
            color: #00D4AA;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .features {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 60px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            font-size: 32px;
            font-weight: 400;
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .feature-icon {
            font-size: 40px;
            margin-right: 20px;
        }
        
        .brand {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .sparkle {
            position: absolute;
            top: 100px;
            right: 100px;
            font-size: 50px;
            animation: sparkle 2s ease-in-out infinite;
        }
        
        .sparkle:nth-child(2) {
            top: 200px;
            right: 150px;
            animation-delay: 0.5s;
        }
        
        .sparkle:nth-child(3) {
            top: 300px;
            right: 120px;
            animation-delay: 1s;
        }
        
        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="story">
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
        
        <div class="content">
            <div class="milestone">MILESTONE</div>
            <div class="version">ECRR v1.0.0</div>
            <div class="status">Production Ready! ✨</div>
            
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span>Privacy</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">♿</span>
                    <span>Accessible</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>Real-Time</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎯</span>
                    <span>Affirming</span>
                </div>
            </div>
            
            <div class="brand">Resonai Voice Training</div>
        </div>
    </div>
</body>
</html>
