<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluesky Banner - ECRR v1.0.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        
        .banner {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1A202C 0%, #2D3748 50%, #4A5568 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="hex" width="20" height="20" patternUnits="userSpaceOnUse"><polygon points="10,2 18,6 18,14 10,18 2,14 2,6" fill="none" stroke="rgba(124,92,255,0.2)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23hex)"/></svg>');
            opacity: 0.6;
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 50px;
        }
        
        .title {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #7C5CFF;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 400;
            background: rgba(124,92,255,0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(124,92,255,0.3);
            backdrop-filter: blur(10px);
        }
        
        .feature-icon {
            font-size: 28px;
            margin-right: 15px;
        }
        
        .timeline {
            font-size: 22px;
            font-weight: 500;
            color: #00D4AA;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .roadmap {
            font-size: 20px;
            font-weight: 400;
            color: #A0AEC0;
            margin-bottom: 30px;
        }
        
        .hashtags {
            font-size: 18px;
            font-weight: 400;
            color: #7C5CFF;
        }
        
        .tech-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #7C5CFF;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .code-icon {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 30px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="tech-badge">TECH</div>
        <div class="code-icon">💻</div>
        
        <div class="content">
            <div class="title">Resonai ECRR v1.0.0 is here!</div>
            
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🚀</span>
                    <span>Local-first voice training</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span>Privacy by design</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">♿</span>
                    <span>WCAG 2.2 AA accessible</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>60fps real-time feedback</span>
                </div>
            </div>
            
            <div class="timeline">Ready for controlled beta!</div>
            <div class="roadmap">Q4 2025 → Q1 2026 → Q2 2026</div>
            <div class="hashtags">#VoiceTech #Privacy #Accessibility</div>
        </div>
    </div>
</body>
</html>
