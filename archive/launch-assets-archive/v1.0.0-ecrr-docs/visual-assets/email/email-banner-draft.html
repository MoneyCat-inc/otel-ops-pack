<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Banner - ECRR v1.0.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        
        .banner {
            width: 600px;
            height: 300px;
            background: #FFFFFF;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1A202C;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #7C5CFF 0%, #00D4AA 100%);
            width: 100%;
            padding: 20px;
            text-align: center;
            color: white;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .content {
            padding: 30px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 400;
            background: #F7FAFC;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #7C5CFF;
        }
        
        .feature-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        
        .timeline {
            font-size: 18px;
            font-weight: 500;
            color: #00D4AA;
            margin-bottom: 15px;
        }
        
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FF6B6B;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="badge">NEW</div>
        <div class="header">
            <div class="title">Major Milestone Achieved!</div>
        </div>
        
        <div class="content">
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span>Privacy First</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">♿</span>
                    <span>WCAG 2.2 AA Accessible</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>60fps Real-Time Feedback</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎯</span>
                    <span>Affirming, Inclusive UX</span>
                </div>
            </div>
            
            <div class="timeline">Ready for Controlled Beta Q4 2025</div>
        </div>
    </div>
</body>
</html>
