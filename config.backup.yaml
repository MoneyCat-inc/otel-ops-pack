# C:\otel\config-hardened-plus.yaml
# Hardened, loopback-only, resilient Windows Collector → SigNoz + Kafka

extensions:
  health_check:
    endpoint: 127.0.0.1:13134
    path: /healthz
  file_storage:
    directory: C:\ProgramData\Otelcol\FileStorage
    timeout: 10s
    compaction:
      on_start: true

receivers:
  # OTLP (loopback only)
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:5318
      grpc:
        endpoint: 127.0.0.1:5317

  # Tail Windows logs directory (optional; safe defaults)
  filelog:
    include:
      - C:\logs\*.log
    start_at: end
    include_file_path: true
    include_file_name: true
    poll_interval: 1s
    # Minimal, widely compatible JSON parsing
    operators:
      - type: json_parser
        parse_to: body

  # Windows Event Logs (Application + System) - separate receivers for compatibility
  windowseventlog/application:
    channel: Application
    start_at: end
  windowseventlog/system:
    channel: System
    start_at: end

processors:
  # Resource defaults for unified attributes
  resource/defaults:
    attributes:
      - key: project
        value: common
        action: upsert
      - key: service.namespace
        value: core
        action: upsert

  # Tail-based sampling for traces (when traces pipeline is added)
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: high_latency
        type: latency
        latency:
          threshold_ms: 500

  # Keep memory in check under load
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
    spike_limit_mib: 256

  # Efficient, low-latency batching that preserves throughput
  batch:
    timeout: 2s
    send_batch_size: 2048
    send_batch_max_size: 4096

exporters:
  # Export to SigNoz collector running in Docker on localhost
  otlp:
    endpoint: 127.0.0.1:14318
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 8192
      storage: file_storage

  # Kafka fan-out exporter
  kafka:
    brokers: ["localhost:9092"]
    topic: otel-logs
    encoding: otlp_json
    protocol_version: 2.0.0

  # Optional local debug (uncomment if you want console logs)
  # logging:
  #   loglevel: info

service:
  extensions: [health_check, file_storage]

  pipelines:
    logs:
      receivers: [otlp, filelog, windowseventlog/application, windowseventlog/system]
      processors: [resource/defaults, memory_limiter, batch]
      exporters: [otlp, kafka]
      # For local debug add: , logging

  telemetry:
    metrics:
      address: 127.0.0.1:8889
