apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-test-config
  namespace: bosscat-testing
data:
  signoz_user_journey.py: |
    from locust import HttpUser, task, between
    import random
    import time
    import os

    class SigNozUser(HttpUser):
        wait_time = between(1, 3)
        
        def on_start(self):
            self.base_url = os.getenv('SIGNOZ_URL', 'http://signoz-frontend:8080')
            self.queries = [
                'message contains "canary test"',
                'attributes.dataset = "resonai_analytics"',
                'level = "error"',
                'service.name = "otelcol-contrib"',
                'otelcol_*',
            ]
        
        @task(3)
        def query_logs(self):
            query = random.choice(self.queries)
            params = {
                'query': query,
                'start': int(time.time()) - 3600,
                'end': int(time.time()),
                'limit': 100,
            }
            
            with self.client.get(
                f"{self.base_url}/api/v1/logs",
                params=params,
                catch_response=True,
                name="logs_query"
            ) as response:
                if response.status_code == 200:
                    response.success()
                else:
                    response.failure(f"Logs query failed with status {response.status_code}")
        
        @task(2)
        def query_metrics(self):
            metrics_queries = [
                'rate(otelcol_processor_batch_batch_send_size_sum[5m])',
                'otelcol_processor_batch_batch_send_size_count',
            ]
            
            query = random.choice(metrics_queries)
            params = {
                'query': query,
                'start': int(time.time()) - 3600,
                'end': int(time.time()),
            }
            
            with self.client.get(
                f"{self.base_url}/api/v1/metrics",
                params=params,
                catch_response=True,
                name="metrics_query"
            ) as response:
                if response.status_code == 200:
                    response.success()
                else:
                    response.failure(f"Metrics query failed with status {response.status_code}")
        
        @task(1)
        def check_health(self):
            with self.client.get(
                f"{self.base_url}/api/v1/health",
                catch_response=True,
                name="health_check"
            ) as response:
                if response.status_code == 200:
                    response.success()
                else:
                    response.failure(f"Health check failed with status {response.status_code}")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: bosscat-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
    spec:
      containers:
      - name: locust-master
        image: locustio/locust:latest
        command: ["locust", "-f", "/scripts/signoz_user_journey.py", "--master", "--host=http://signoz-frontend:8080"]
        ports:
        - containerPort: 8089
        - containerPort: 5557
        env:
        - name: SIGNOZ_URL
          value: "http://signoz-frontend:8080"
        volumeMounts:
        - name: test-scripts
          mountPath: /scripts
      volumes:
      - name: test-scripts
        configMap:
          name: locust-test-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: bosscat-testing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      containers:
      - name: locust-worker
        image: locustio/locust:latest
        command: ["locust", "-f", "/scripts/signoz_user_journey.py", "--worker", "--master-host=locust-master"]
        env:
        - name: SIGNOZ_URL
          value: "http://signoz-frontend:8080"
        volumeMounts:
        - name: test-scripts
          mountPath: /scripts
      volumes:
      - name: test-scripts
        configMap:
          name: locust-test-config
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master-service
  namespace: bosscat-testing
spec:
  selector:
    app: locust-master
  ports:
  - port: 8089
    targetPort: 8089
    name: web
  - port: 5557
    targetPort: 5557
    name: master
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: locust-worker-service
  namespace: bosscat-testing
spec:
  selector:
    app: locust-worker
  ports:
  - port: 8089
    targetPort: 8089
    name: web
  type: ClusterIP
