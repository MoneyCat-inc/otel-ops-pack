extensions:
  health_check:
    endpoint: 0.0.0.0:13134
    path: /healthz

receivers:
  windows_event_log:
    - channel: Application
      log_name: Application
      start_at: end
      poll_interval: 1s
      exclude_providers:
        - Microsoft-Windows-Security-SPP
  filelog:
    - include: C:\logs\**\*.log
      start_at: end
      poll_interval: 1s
      operators:
        - type: json_parser
          parse_from: body
        - type: add
          field: log.source
          value: file
processors:
  batch/logs:
    timeout: 200ms
    send_batch_size: 256
  memory_limiter:
    limit_mib: 256
  attributes/global:
    actions:
      - key: deployment.env
        value: local
        action: insert
  attributes/windows_event_log:
    include:
      match_type: instrumentation_scope
      instrumentation_scope_names: [otelcol/wineventlogreceiver]
    actions:
      - key: log.source
        value: windows_event_log
        action: insert
exporters:
  otlp:
    endpoint: localhost:14317
    tls:
      insecure: true
  otlphttp:
    endpoint: http://localhost:14318
    tls:
      insecure: true
service:
  extensions:
    - health_check
  pipelines:
    logs:
      receivers: [windows_event_log, filelog]
      processors: [memory_limiter, attributes/global, attributes/windows_event_log, batch]
      exporters: [otlp, otlphttp, debug]
    metrics:
      receivers: []
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp
        - otlphttp
    traces:
      receivers: []
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp
        - otlphttp
