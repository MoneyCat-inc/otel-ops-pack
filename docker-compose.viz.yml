# Docker Compose - Milkdrop Visual Engine Stack (Gate #009)
# ECRR: BossCat Mission - Containerized visual authoring loop
# Authority: BossCat OEM | Executor: Cursor{Implementer}
# Gate: #009 APPROVED - md3-engine + scorebot architecture
# Gate: #023 BOSSCAT-023A - Added Redis for cluster-aware AudioSwitch

services:
  # BOSSCAT-023A: Redis for distributed AudioSwitch
  redis:
    image: redis:7-alpine
    container_name: redis-audioswitch
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - viz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  md3-engine:
    build:
      context: ./viz-engine-butterchurn
      dockerfile: Dockerfile
    container_name: md3-engine
    ports:
      - "7001:7001"  # Control API (REST + WebSocket)
    shm_size: "1gb"
    environment:
      - VIZ_WIDTH=1920
      - VIZ_HEIGHT=1080
      - VIZ_ASPECT=16:9
      - VIZ_FPS=60
      - PRESET_DIR=/app/presets
      - NODE_ENV=production
    volumes:
      - ./viz-engine-butterchurn/presets:/app/presets
      - viz-snapshots:/app/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/src/health-check.js"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - viz-net

  scorebot:
    build:
      context: ./scorebot
      dockerfile: Dockerfile
    container_name: scorebot
    ports:
      - "7010:7010"  # Metrics API (Prometheus + validation)
    environment:
      - FRAME_TAP_URL=http://md3-engine:7001/snap.jpg
      - VIZ_ENGINE_URL=http://md3-engine:7001
      - METRICS_PORT=7010
      - SAMPLE_INTERVAL_MS=1000
      - FAIL_ON_SKEW=true
      - FAIL_ON_BLACKOUT=false  # Gate #012: Will enable after visual validation
    depends_on:
      md3-engine:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - viz-net

  # Gate #012: ProjectM container (native .milk renderer)
  pm-engine:
    build:
      context: ./viz-engine-projectm
    image: bosscat/viz-engine-projectm:latest
    # BOSSCAT-023A: container_name removed to enable scaling
    # BOSSCAT-023A: ports removed to allow multiple replicas (access via docker exec or internal network)
    shm_size: "512mb"
    environment:
      - DISPLAY=:99
      - PM_PRESET_DIR=/app/presets
      - PM_FIFO=/dev/shm/md3.pcm
      - PM_WIDTH=1280  # Match milk-v0 output (was 1920)
      - PM_HEIGHT=720  # Match milk-v0 output (was 1080)
      - PM_FPS=15      # Match milk-v0 output (was 30) - reduces CPU by 8×
      - PM_WIN_CLASS=projectM
      - PORT=7020
      - AUDIO_STATE_FILE=/app/config/audio-state.json  # BOSSCAT-021A: Persistent audio switch
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}  # BOSSCAT-021A: Optional admin API token
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}  # BOSSCAT-023A: Cluster coordination
      - AUDIO_STATE_KEY=${AUDIO_STATE_KEY:-audioswitch:state}  # BOSSCAT-023A: Redis key
      - AUDIO_PUBSUB_CHANNEL=${AUDIO_PUBSUB_CHANNEL:-audioswitch:events}  # BOSSCAT-023A: Pub/sub channel
      - AUDIO_VERSION_KEY=${AUDIO_VERSION_KEY:-audioswitch:version}  # BOSSCAT-023A: Version counter
    volumes:
      - ./presets-projectm:/app/presets:ro
      - ./artifacts/pm:/artifacts/pm
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # Share X11 socket with milk-v0
      - ./config:/app/config  # BOSSCAT-021A: Persistent audio-state.json
    command: ["/bin/bash", "-lc", "/app/pm-run.sh"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7020/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - viz-net

  # Gate #011: Milk v0 viewer (MJPEG stream from pm-engine X display)
  milk-v0:
    build:
      context: ./docs/milk-v0
    container_name: milk-v0
    ports:
      - "8090:8080"  # Milk viewer HTTP (host 8090 -> container 8080)
    environment:
      - DISPLAY=:99
      - GEOMETRY=1280x720  # Reduced from 1920x1080 to lower CPU load (44% fewer pixels)
      - FPS=15  # Reduced from 30 to 15 for CPU headroom and smoother encoding
    # Share X11 socket via bind mount from host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Start after pm-engine's Xvfb is ready
    depends_on:
      pm-engine:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - viz-net

  # Optional: WebRTC gateway for live streaming
  # webrtc-gateway:
  #   build:
  #     context: ./gateway
  #     dockerfile: Dockerfile
  #   container_name: viz-webrtc-gateway
  #   ports:
  #     - "8443:8443"  # HTTPS/WebRTC
  #   environment:
  #     - VIZ_ENGINE_URL=http://viz-engine:7001
  #   depends_on:
  #     viz-engine:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - viz-net

volumes:
  viz-snapshots:
    driver: local
  redis-data:
    driver: local

networks:
  viz-net:
    driver: bridge

