apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: codex-local }
  template:
    metadata:
      labels: { app: codex-local }
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
        - name: codex-local-watchdog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          args: {{ toJson .Values.watchdog.args }}
          env:
            - name: NO_COLOR
              value: "1"
          volumeMounts:
            - name: codex-data
              mountPath: "{{ .Values.watchdog.mountPath }}"
      volumes:
        - name: codex-data
          emptyDir: {}
