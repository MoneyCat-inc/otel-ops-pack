receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:5131
      http:
        endpoint: 0.0.0.0:5132

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 768
    spike_limit_mib: 768
  
  batch/traces:
    timeout: 150ms
    send_batch_size: 7500
    send_batch_max_size: 7500
    metadata_keys:
      - service.name
      - run.id
      - run.stage
  
  batch/metrics:
    timeout: 750ms
    send_batch_size: 7500
    send_batch_max_size: 7500
    metadata_keys:
      - service.name
      - run.id
      - run.stage
  
  batch/logs:
    timeout: 1500ms
    send_batch_size: 7500
    send_batch_max_size: 7500
    metadata_keys:
      - service.name
      - run.id
      - run.stage
  
  attributes/run:
    actions:
      - action: upsert
        key: run.id
        value: stage2_row05-r1-20250921-230856
      - action: upsert
        key: run.stage
        value: stage2
      - action: upsert
        key: run.label
        value: stage2_row05
      - action: upsert
        key: experiment.timestamp
        value: 20250921-230856
      - action: upsert
        key: service.name
        value: otel-doe-collector

exporters:
  debug:
    verbosity: basic
  
  otlp/signoz:
    endpoint: http://localhost:14317
    tls:
      insecure: true
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 7m
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 2
      queue_size: 4500

extensions:
  health_check:
    endpoint: 0.0.0.0:5133
    path: /healthz
  pprof:
    endpoint: 0.0.0.0:5134
  file_storage:
    directory: C:\ProgramData\OTel\wal\stage2_row05-r1-20250921-230856

service:
  extensions: [health_check, pprof, file_storage]
  telemetry:
    metrics:
      address: 0.0.0.0:5135
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/run, batch/traces]
      exporters: [debug, otlp/signoz]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/run, batch/metrics]
      exporters: [debug, otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/run, batch/logs]
      exporters: [debug, otlp/signoz]