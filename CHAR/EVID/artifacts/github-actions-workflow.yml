name: ECRR Compliance Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  ecrr-compliance:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        version: '7.4'
        
    - name: Run ECRR Compliance Check
      run: |
        pwsh -File scripts/ci-ecrr-compliance.ps1 -FailOnThreshold
      shell: pwsh
      
    - name: Upload Compliance Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ecrr-compliance-report
        path: |
          artifacts/ecrr-ci-validation.json
          artifacts/ecrr-ci-report.md
        retention-days: 30
        
    - name: Comment PR with Compliance Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const reportPath = 'artifacts/ecrr-ci-report.md';
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: ## ECRR Compliance Check Results\n\n\n\n*This comment was automatically generated by the ECRR Compliance Check workflow.*
              });
            }
          } catch (error) {
            console.log('Could not read compliance report:', error.message);
          }
