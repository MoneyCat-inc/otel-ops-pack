extensions:
  health_check:
    endpoint: 0.0.0.0:13134
    path: /healthz

receivers:
  # OTLP receivers for direct application log ingestion
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:5317
      http:
        endpoint: 127.0.0.1:5318
  windowseventlog/application:
    channel: Application
    start_at: end
    poll_interval: 1s
  windowseventlog/system:
    channel: System
    start_at: end
    poll_interval: 1s
  filelog/canary:
    include:
      - C:/logs/**/*.log
    start_at: end
    include_file_path: true
    include_file_name: true
    poll_interval: 1s
    operators:
      - type: json_parser
        parse_from: body
  

processors:
  memory_limiter:
    limit_mib: 512
    check_interval: 1s
    spike_limit_mib: 256
  resource/defaults:
    attributes:
      - key: deployment.env
        value: local
        action: upsert
      - key: service.name
        value: windows-gpu-metrics
        action: upsert
  filter/drop_noise:
    logs:
      log_record:
        - attributes["winlog.event_id"] == 6005
        - attributes["winlog.event_id"] == 6006
        - attributes["winlog.event_id"] == 7036
        - IsMatch(body, "(?i)windows update|service control manager")
  batch/logs:
    timeout: 2000ms
    send_batch_size: 512
  

exporters:
  otlp:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true
  otlphttp:
    endpoint: http://127.0.0.1:14318
    tls:
      insecure: true

service:
  extensions:
    - health_check
  pipelines:
    logs:
      receivers:
        - otlp
        - windowseventlog/application
        - windowseventlog/system
        - filelog/canary
      processors:
        - memory_limiter
        - filter/drop_noise
        - resource/defaults
        - batch/logs
      exporters:
        - otlp
        - otlphttp
    


















