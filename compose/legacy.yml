# SigNoz/OTel Docker Stack - Rebuilt from Scratch
# Schema migrators start last to ensure proper initialization order

services:
  # =============================================================================
  # GPU SERVICES
  # =============================================================================
  gpu-aggregation:
    image: otel-gpu-sidecar:latest
    container_name: gpu-aggregation
    gpus: all
    command: ["python3", "/app/sidecars/aggregation/aggregation_sidecar.py"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - signoz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  gpu-inference:
    image: otel-gpu-sidecar:latest
    container_name: gpu-inference
    gpus: all
    command: ["python3", "/app/sidecars/inference/inference_sidecar.py"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - signoz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  gpu-compression:
    image: otel-gpu-sidecar:latest
    container_name: gpu-compression
    gpus: all
    command: ["python3", "/app/sidecars/compression/compression_sidecar.py", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - signoz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================================
  # DEMO APPLICATION
  # =============================================================================
  demo-app:
    image: otel-otel-demo-app
    container_name: demo-app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=otel-demo-app
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=production
    depends_on:
      signoz-otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      - signoz-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================================
  # SIGNOZ INFRASTRUCTURE (Foundation Services)
  # =============================================================================
  signoz-zookeeper:
    image: signoz/zookeeper:3.9.3
    container_name: signoz-zookeeper
    restart: unless-stopped
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: "9141"
    volumes:
      - signoz_zookeeper_data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep -q 'error.*null'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-clickhouse
    restart: unless-stopped
    depends_on:
      signoz-zookeeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-cluster-config.xml:/etc/clickhouse-server/config.d/signoz-cluster.xml:ro
      - ./clickhouse-zookeeper-config.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================================
  # SIGNOZ CORE SERVICES
  # =============================================================================
  signoz:
    image: signoz/signoz:v0.96.1
    container_name: signoz
    restart: unless-stopped
    depends_on:
      signoz-zookeeper:
        condition: service_healthy
      signoz-clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - signoz_data:/var/lib/signoz
      - ./configs/prometheus/prometheus.yml:/root/config/prometheus.yml:ro
      - ./configs/dashboards:/root/config/dashboards:ro
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_JWT_SECRET: '${SIGNOZ_JWT_SECRET:-local-signoz-jwt-secret-rotate}'
      STORAGE: clickhouse
      GODEBUG: netdns=go
      DOT_METRICS_ENABLED: "true"
      DEPLOYMENT_TYPE: docker-local
      SIGNOZ_USAGE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.129.6
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      signoz:
        condition: service_healthy
      signoz-schema-migrator-sync:
        condition: service_completed_successfully
    command:
      - --config=/etc/otel-collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    volumes:
      - ./signoz-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "18888:8888"   # Prometheus metrics
      - "18889:8889"   # Prometheus exporter metrics
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/13133'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================================
  # SCHEMA MIGRATORS (Start Last - T Priority)
  # =============================================================================
  signoz-schema-migrator-sync:
    image: signoz/signoz-schema-migrator:v0.129.6
    container_name: signoz-schema-migrator-sync
    command: ["sync", "--dsn=tcp://signoz-clickhouse:9000", "--up="]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: on-failure
    networks:
      - signoz-net
    labels:
      - "order=T"
      - "priority=last"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  signoz-schema-migrator-async:
    image: signoz/signoz-schema-migrator:v0.129.6
    container_name: signoz-schema-migrator-async
    command: ["async", "--dsn=tcp://signoz-clickhouse:9000", "--up="]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: on-failure
    networks:
      - signoz-net
    labels:
      - "order=T"
      - "priority=last"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  clickhouse_data:
    driver: local
  signoz_data:
    driver: local
  signoz_zookeeper_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  signoz-net:
    name: signoz-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
