name: BossCat Gate Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_types:
        description: 'Test types to run (comma-separated)'
        required: false
        default: 'baseline,load'
        type: string
      use_mock:
        description: 'Use mock SigNoz API'
        required: false
        default: true
        type: boolean

jobs:
  gate-verification:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'  # Updated for Python 3.13 compatibility
        
    - name: Create required directories
      run: |
        mkdir -p artifacts
        mkdir -p docs/BossCat/reports
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust flake8 black  # Add missing dependencies
        
    - name: Install k6
      run: |
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: Verify installations
      run: |
        python --version
        k6 version
        locust --version
        
    - name: Run linting (optional)
      run: |
        python -m flake8 scripts/ --max-line-length=100 --ignore=E203,W503 || echo "Linting issues found but continuing..."
        python -m black --check scripts/ || echo "Black formatting issues found but continuing..."
      continue-on-error: true
        
    - name: Run OTLP smoke test
      run: |
        python scripts/test-otlp-smoke.py --verbose || echo "OTLP smoke test failed but continuing..."
      continue-on-error: true
        
    - name: Run BossCat pipeline
      run: |
        python scripts/run-local-pipeline.py \
          --use-mock=${{ github.event.inputs.use_mock || 'true' }} \
          --test-types="${{ github.event.inputs.test_types || 'baseline,load' }}" \
          --verbose
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bosscat-test-results-${{ github.run_number }}
        path: |
          artifacts/
          docs/BossCat/reports/
        retention-days: 30
        
    - name: Generate ECRR Report
      if: always()
      run: |
        python scripts/generate-ecrr-report.py \
          --gate-results artifacts/gate-verification-results.json \
          --output docs/BossCat/reports/ECRR_CI_RUN.md \
          --pdf docs/BossCat/reports/ECRR_CI_RUN.pdf || echo "ECRR report generation failed"
      continue-on-error: true
          
    - name: Generate BOSS v2 Report
      if: always()
      run: |
        python scripts/generate-boss-v2-report.py \
          --gate-results artifacts/gate-verification-results.json \
          --output docs/BossCat/reports/BOSS_v2_CI_RUN.md \
          --pdf docs/BossCat/reports/BOSS_v2_CI_RUN.pdf || echo "BOSS v2 report generation failed"
      continue-on-error: true
          
    - name: Commit reports
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/BossCat/reports/ || echo "No reports to add"
        git diff --staged --quiet || git commit -m "docs(bosscat): Update CI reports [skip ci]" || echo "No changes to commit"
        git push || echo "Push failed but continuing"
      continue-on-error: true
