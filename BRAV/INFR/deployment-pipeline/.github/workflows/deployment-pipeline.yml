name: Deployment Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - "deployment-pipeline/**"
  pull_request:
    branches: [ main ]
    paths:
      - "deployment-pipeline/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      skip_security:
        description: "Skip security scans"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/deployment-pipeline-api
  NODE_VERSION: "18"
  SERVICE_PORT: 3000
  HEALTH_CHECK_URL: http://localhost:8080/health

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: deployment-pipeline/package-lock.json
          
      - name: Install dependencies
        working-directory: deployment-pipeline
        run: npm ci
        
      - name: Run linting
        working-directory: deployment-pipeline
        run: npm run lint
        if: ${{ !inputs.skip_tests }}
        
      - name: Run tests
        working-directory: deployment-pipeline
        run: npm run test:coverage
        if: ${{ !inputs.skip_tests }}
        
      - name: Build application
        working-directory: deployment-pipeline
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ !inputs.skip_security }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: deployment-pipeline/package-lock.json
          
      - name: Install dependencies
        working-directory: deployment-pipeline
        run: npm ci
        
      - name: Run npm audit
        working-directory: deployment-pipeline
        run: npm audit --audit-level=high
        continue-on-error: true
        
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true
        
      - name: GitLeaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: deployment-pipeline/
          retention-days: 30
        if: always()

  docker-build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != "pull_request"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: deployment-pipeline
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Docker image security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif
        if: always()

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name != "pull_request"
    environment: ${{ inputs.environment || "staging" }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Docker Compose (Local Testing)
        run: |
          echo "🚀 Deploying to Docker Compose for local testing"
          cd deployment-pipeline
          
          # Stop any existing containers
          docker-compose down --remove-orphans || true
          
          # Build and start services
          docker-compose up -d --build
          
          # Wait for service to be ready
          echo "⏳ Waiting for service to be ready..."
          timeout 60 bash -c "until curl -f http://localhost:3000/health; do sleep 2; done"
          
          # Verify deployment
          echo "✅ Service deployed successfully"
          curl -f http://localhost:3000/health
          
      # GKE Authentication and Deployment
      - name: Authenticate to GKE
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.GCP_PROJECT_ID }}
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Set up Cloud SDK for GKE
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.GCP_PROJECT_ID }}
        uses: google-github-actions/setup-gcloud@v1
          
      - name: Configure kubectl for GKE
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.GCP_PROJECT_ID }}
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}
            
      # EKS Authentication and Deployment  
      - name: Configure AWS credentials for EKS
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.AWS_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Update kubeconfig for EKS
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.AWS_ACCESS_KEY_ID }}
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
            
      # AKS Authentication and Deployment
      - name: Azure Login for AKS
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.AZURE_CLIENT_ID }}
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Configure kubectl for AKS
        if: ${{ (inputs.environment == "staging" || inputs.environment == "production") && secrets.AZURE_CLIENT_ID }}
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }}
          
      - name: Deploy to Kubernetes (Staging)
        if: ${{ (inputs.environment == "staging" || (inputs.environment == "" && github.ref == "refs/heads/main")) && (secrets.GCP_PROJECT_ID || secrets.AWS_ACCESS_KEY_ID || secrets.AZURE_CLIENT_ID) }}
        run: |
          echo "🚀 Deploying to Kubernetes staging environment"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          # Update image in deployment manifest
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g" deployment-pipeline/k8s/deployment.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f deployment-pipeline/k8s/deployment.yaml
          
          # Wait for deployment rollout
          kubectl rollout status deployment/deployment-pipeline-api --timeout=300s
          
          # Verify deployment
          kubectl get pods -l app=deployment-pipeline-api
          kubectl get services deployment-pipeline-api-service
          
          # Port forward for health check (aligned with HEALTH_CHECK_URL)
          kubectl port-forward service/deployment-pipeline-api-service 8080:80 &
          sleep 10
          
          # Health check against forwarded port
          curl -f ${{ env.HEALTH_CHECK_URL }} || echo "Health check failed - service may still be starting"
          
          echo "✅ Kubernetes staging deployment completed"
          
      - name: Deploy to Kubernetes (Production)
        if: ${{ inputs.environment == "production" && (secrets.GCP_PROJECT_ID || secrets.AWS_ACCESS_KEY_ID || secrets.AZURE_CLIENT_ID) }}
        run: |
          echo "🚀 Deploying to Kubernetes production environment"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          # Update image in deployment manifest
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g" deployment-pipeline/k8s/deployment.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f deployment-pipeline/k8s/deployment.yaml
          
          # Wait for deployment rollout
          kubectl rollout status deployment/deployment-pipeline-api --timeout=600s
          
          # Verify deployment
          kubectl get pods -l app=deployment-pipeline-api
          kubectl get services deployment-pipeline-api-service
          
          # Port forward for health check (aligned with HEALTH_CHECK_URL)
          kubectl port-forward service/deployment-pipeline-api-service 8080:80 &
          sleep 15
          
          # Health check against forwarded port
          curl -f ${{ env.HEALTH_CHECK_URL }} || echo "Health check failed - service may still be starting"
          
          echo "✅ Kubernetes production deployment completed"
          
      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for deployment to be ready"
          sleep 10
          
          # Verify service is responding (check both local and forwarded ports)
          curl -f http://localhost:3000/health || curl -f ${{ env.HEALTH_CHECK_URL }} || echo "Health check failed - service may still be starting"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Wait for service readiness
        run: |
          echo "⏳ Waiting for service to be fully ready..."
          # Check both local Docker Compose and forwarded Kubernetes ports
          timeout 60 bash -c "until curl -f http://localhost:3000/health || curl -f ${{ env.HEALTH_CHECK_URL }}; do sleep 2; done"
          
      - name: Run comprehensive smoke tests
        run: |
          echo "🧪 Running comprehensive smoke tests against deployed service"
          
          # Determine which service endpoint to use
          if curl -f http://localhost:3000/health >/dev/null 2>&1; then
            SERVICE_BASE="http://localhost:3000"
            echo "Testing against Docker Compose service"
          elif curl -f ${{ env.HEALTH_CHECK_URL }} >/dev/null 2>&1; then
            SERVICE_BASE="http://localhost:8080"
            echo "Testing against Kubernetes port-forwarded service"
          else
            echo "❌ No service endpoint available for testing"
            exit 1
          fi
          
          # Health check
          echo "Testing health endpoint..."
          curl -f $SERVICE_BASE/health
          
          # Status check
          echo "Testing status endpoint..."
          curl -f $SERVICE_BASE/api/v1/status
          
          # Echo test
          echo "Testing echo endpoint..."
          curl -f -X POST $SERVICE_BASE/api/v1/echo \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"Smoke Test - Tetragrammaton Validation\"}"
          
          # Metrics check
          echo "Testing metrics endpoint..."
          curl -f $SERVICE_BASE/api/v1/metrics
          
          echo "✅ All smoke tests completed successfully"
          
      - name: Validate Tetragrammaton architecture
        run: |
          echo "🐾 Validating Tetragrammaton YHWH architecture..."
          
          # Determine which service endpoint to use
          if curl -f http://localhost:3000/health >/dev/null 2>&1; then
            SERVICE_BASE="http://localhost:3000"
          elif curl -f ${{ env.HEALTH_CHECK_URL }} >/dev/null 2>&1; then
            SERVICE_BASE="http://localhost:8080"
          else
            echo "❌ No service endpoint available for validation"
            exit 1
          fi
          
          METRICS_RESPONSE=$(curl -s -f $SERVICE_BASE/api/v1/metrics)
          
          # Check for Tetragrammaton components in metrics
          if echo "$METRICS_RESPONSE" | grep -q "tetragrammaton"; then
            echo "✅ Tetragrammaton architecture detected in metrics"
          else
            echo "❌ Tetragrammaton architecture not found in metrics"
            exit 1
          fi
          
          if echo "$METRICS_RESPONSE" | grep -q "YHWH"; then
            echo "✅ YHWH structure validated"
          else
            echo "❌ YHWH structure not found"
            exit 1
          fi
          
          echo "✅ Tetragrammaton YHWH architecture validation completed"

  ecrr-evidence:
    name: ECRR Evidence Collection
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, docker-build, deploy, smoke-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: "7.x"
          
      - name: Wait for service readiness
        run: |
          echo "⏳ Ensuring service is ready for metrics collection..."
          # Check both local Docker Compose and forwarded Kubernetes ports
          timeout 60 bash -c "until curl -f http://localhost:3000/health || curl -f ${{ env.HEALTH_CHECK_URL }}; do sleep 2; done"
          
      - name: Capture deployment metrics
        run: |
          echo "📊 Capturing comprehensive deployment metrics..."
          
          cd deployment-pipeline
          
          # Determine service base URL for metrics collection
          if curl -f http://localhost:3000/health >/dev/null 2>&1; then
            SERVICE_BASE_URL="http://localhost:3000"
            echo "Collecting metrics from Docker Compose service"
          elif curl -f ${{ env.HEALTH_CHECK_URL }} >/dev/null 2>&1; then
            SERVICE_BASE_URL="http://localhost:8080"
            echo "Collecting metrics from Kubernetes port-forwarded service"
          else
            echo "⚠️ No service endpoint available for metrics collection"
            SERVICE_BASE_URL="http://localhost:3000"
          fi
          
          # Capture metrics using the deployment metrics script
          pwsh scripts/deployment-metrics.ps1 -Action capture -Environment ${{ inputs.environment || "staging" }} -BaseUrl $SERVICE_BASE_URL -OutputPath "docs/metrics"
          
          # Generate ECRR report
          pwsh scripts/deployment-metrics.ps1 -Action ecrr -Environment ${{ inputs.environment || "staging" }} -BaseUrl $SERVICE_BASE_URL -ECRRReportDir "CHAR/ECRR/ECRR_REPORTS"
          
      - name: Upload ECRR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecrr-deployment-artifacts
          path: |
            deployment-pipeline/docs/metrics/
            deployment-pipeline/docs/ecrr/
          retention-days: 30
        if: always()

