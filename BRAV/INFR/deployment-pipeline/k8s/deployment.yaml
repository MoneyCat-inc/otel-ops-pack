apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-pipeline-api
  labels:
    app: deployment-pipeline-api
    architecture: tetragrammaton
    component: yod-foundation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deployment-pipeline-api
  template:
    metadata:
      labels:
        app: deployment-pipeline-api
        architecture: tetragrammaton
        component: yod-foundation
    spec:
      containers:
      - name: deployment-pipeline-api
        image: ghcr.io/moneycat-inc/otel-ops-pack/deployment-pipeline-api:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-pipeline-api-service
  labels:
    app: deployment-pipeline-api
    architecture: tetragrammaton
    component: he-interface
spec:
  selector:
    app: deployment-pipeline-api
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployment-pipeline-api-ingress
  labels:
    app: deployment-pipeline-api
    architecture: tetragrammaton
    component: he-integration
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: deployment-pipeline-api.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deployment-pipeline-api-service
            port:
              number: 80
