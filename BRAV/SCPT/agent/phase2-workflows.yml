name: codex-local-phase2-ops
on:
  schedule:
    # Nightly chaos engineering at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        default: 'chaos'
        type: choice
        options:
          - chaos
          - telemetry
          - doc-refresh
          - all

jobs:
  nightly-chaos:
    if: github.event_name == 'schedule' || github.event.inputs.operation == 'chaos' || github.event.inputs.operation == 'all'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with: 
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22.x'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run nightly chaos engineering
        run: pnpm agent:nightly-chaos -Archive
        
      - name: Upload chaos artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results-${{ github.run_number }}
          path: |
            .agent/chaos-archive/
            TASKS.md
          retention-days: 90

  synthetic-telemetry:
    if: github.event_name == 'schedule' || github.event.inputs.operation == 'telemetry' || github.event.inputs.operation == 'all'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with: 
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22.x'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Start SigNoz (if available)
        run: |
          # Check if SigNoz is available
          if (Test-NetConnection -ComputerName localhost -Port 5321 -InformationLevel Quiet) {
            Write-Host "SigNoz OTLP endpoint is available"
          } else {
            Write-Host "SigNoz not available, using dry-run mode"
            $env:DRY_RUN = "true"
          }
        
      - name: Send synthetic telemetry
        run: |
          if ($env:DRY_RUN) {
            pnpm agent:synthetic-telemetry -DryRun
          } else {
            pnpm agent:synthetic-telemetry
          }
        
      - name: Upload telemetry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-${{ github.run_number }}
          path: |
            .agent/alert-rules.json
            TASKS.md
          retention-days: 30

  doc-auto-refresh:
    if: github.event_name == 'schedule' || github.event.inputs.operation == 'doc-refresh' || github.event.inputs.operation == 'all'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with: 
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22.x'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Auto-refresh documentation
        run: pnpm agent:doc-auto-refresh -Backup
        
      - name: Commit updated documentation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md .agent/status-report.md
          git diff --staged --quiet || git commit -m "Auto-update: Refresh codex-local status documentation [skip ci]"
          git push

  pr-badge-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with: 
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22.x'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Check guardrails status
        id: guardrails
        run: |
          $result = pnpm agent:pr-badge-check -CheckOnly
          echo "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          
      - name: Comment PR with badge status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = '${{ steps.guardrails.outputs.exit_code }}';
            const badgeUrl = exitCode === '0' 
              ? 'https://img.shields.io/badge/codex--local-guardrails-passing-green.svg?label=Guardrails&message=PASS'
              : 'https://img.shields.io/badge/codex--local-guardrails-failing-red.svg?label=Guardrails&message=FAIL';
            
            const comment = `## 🛡️ Guardrail Status
            
            ![Guardrails](${badgeUrl})
            
            ${exitCode === '0' 
              ? '✅ All guardrails passed - Ready to merge!' 
              : '❌ Guardrail violations detected - Please fix before merging'}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
