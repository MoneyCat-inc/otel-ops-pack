receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      network: {}
  prometheus:
    config:
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: signoz-otel-collector
          metrics_path: /metrics
          static_configs:
            - targets:
                - localhost:8888
              labels:
                job_name: signoz-otel-collector
        - job_name: windows-otel-collector
          metrics_path: /metrics
          static_configs:
            - targets:
                - host.docker.internal:8888
              labels:
                job_name: windows-otel-collector

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048
  memory_limiter:
    limit_mib: 4096
    spike_limit_mib: 1024
    check_interval: 5s
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  # ────────────────────────────────────────────────────────────
  # resource/defaults: Sets default resource attributes for all spans
  # 
  # CURRENT BEHAVIOR (action: upsert):
  #   - Overwrites ALL incoming service.name values to "resonai-backend"
  #   - Advantage: Single service identity for aggregation
  #   - Disadvantage: Loses original service names for tracing multi-service calls
  # 
  # ALTERNATIVE (action: insert):
  #   - Preserves original service.name if present
  #   - Sets default only for spans without service.name
  #   - Better for multi-service observability
  # 
  # To enable alternative: Change line 51 from "action: upsert" to "action: insert"
  # ────────────────────────────────────────────────────────────
  resource/defaults:
    attributes:
      - key: service.name
        value: resonai-backend
        action: insert
      - key: deployment.environment
        value: production
        action: upsert
  attributes/redact_sensitive:
    actions:
      - key: http.request.header.user-agent
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: user.email
        action: delete
      - key: user.name
        action: delete
      - key: user.phone
        action: delete
  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
    dimensions_cache_size: 100000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
      - name: signoz.collector.id
      - name: service.version
      - name: browser.platform
      - name: browser.mobile
      - name: k8s.cluster.name
      - name: k8s.node.name
      - name: k8s.namespace.name
      - name: host.name
      - name: host.type
      - name: container.name

exporters:
  clickhousetraces:
    datasource: tcp://signoz-clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: false
    use_new_schema: true
  signozclickhousemetrics:
    dsn: tcp://signoz-clickhouse:9000/signoz_metrics
  clickhouselogsexporter:
    dsn: tcp://signoz-clickhouse:9000/signoz_logs
    timeout: 10s
    use_new_schema: true
    sending_queue:
      enabled: true
      num_consumers: 8
      queue_size: 2048

service:
  telemetry:
    logs:
      level: debug
      encoding: json
  extensions:
    - health_check
    - pprof
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/defaults, signozspanmetrics/delta, batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [signozclickhousemetrics]
    metrics/prometheus:
      receivers: [prometheus]
      processors: [batch]
      exporters: [signozclickhousemetrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/redact_sensitive, batch]
      exporters: [clickhouselogsexporter]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
