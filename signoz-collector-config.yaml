# Resonai Backend - SigNoz Collector Configuration
# OpenTelemetry collector configuration for observability

receivers:
  # =============================================================================
  # OTLP RECEIVERS
  # =============================================================================
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # =============================================================================
  # HOST METRICS RECEIVER
  # =============================================================================
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.time: true
          system.cpu.utilization: true
      memory:
        metrics:
          system.memory.usage: true
          system.memory.utilization: true
      disk:
        metrics:
          system.disk.io: true
          system.disk.io_time: true
      network:
        metrics:
          system.network.io: true
          system.network.packets: true

  # =============================================================================
  # PROMETHEUS RECEIVER
  # =============================================================================
  prometheus:
    config:
      scrape_configs:
        - job_name: 'resonai-backend'
          static_configs:
            - targets: ['resonai-backend:3000']
          metrics_path: '/api/metrics'
          scrape_interval: 30s

processors:
  # =============================================================================
  # BATCH PROCESSOR
  # =============================================================================
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # =============================================================================
  # MEMORY LIMITER
  # =============================================================================
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  # =============================================================================
  # RESOURCE PROCESSOR
  # =============================================================================
  resource:
    attributes:
      - key: service.name
        value: resonai-backend
        action: upsert
      - key: service.version
        value: 1.0.0
        action: upsert
      - key: deployment.environment
        value: production
        action: upsert

  # =============================================================================
  # ATTRIBUTE PROCESSOR
  # =============================================================================
  attributes:
    actions:
      - key: http.request.header.user-agent
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: user.email
        action: delete
      - key: user.name
        action: delete
      - key: user.phone
        action: delete

  # =============================================================================
  # FILTER PROCESSOR
  # =============================================================================
  filter:
    traces:
      span:
        - 'attributes["http.route"] == "/api/health"'
        - 'attributes["http.route"] == "/api/health/detailed"'
    metrics:
      metric:
        - 'name == "http_requests_total"'
        - 'name == "http_request_duration_seconds"'
        - 'name == "resonai_engagement_events_total"'
        - 'name == "resonai_privacy_events_total"'

exporters:
  # =============================================================================
  # CLICKHOUSE EXPORTER
  # =============================================================================
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: signoz
    table_name: otel_traces
    timeout_settings:
      timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # =============================================================================
  # PROMETHEUS EXPORTER
  # =============================================================================
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: resonai
    const_labels:
      service: resonai-backend
      version: 1.0.0
      environment: production

  # =============================================================================
  # LOGGING EXPORTER
  # =============================================================================
  logging:
    loglevel: info
    sampling_initial: 2
    sampling_thereafter: 500

service:
  # =============================================================================
  # PIPELINES
  # =============================================================================
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes, filter]
      exporters: [clickhouse, logging]

    # Metrics pipeline
    metrics:
      receivers: [otlp, hostmetrics, prometheus]
      processors: [memory_limiter, batch, resource, attributes, filter]
      exporters: [prometheus, logging]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [logging]

  # =============================================================================
  # EXTENSIONS
  # =============================================================================
  extensions: [health_check, pprof, zpages]

  # =============================================================================
  # TELEMETRY
  # =============================================================================
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

extensions:
  # =============================================================================
  # HEALTH CHECK EXTENSION
  # =============================================================================
  health_check:
    endpoint: 0.0.0.0:13133

  # =============================================================================
  # PPROF EXTENSION
  # =============================================================================
  pprof:
    endpoint: 0.0.0.0:1777

  # =============================================================================
  # ZPAGES EXTENSION
  # =============================================================================
  zpages:
    endpoint: 0.0.0.0:55679
