name: CI PR

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run typecheck

  e2e-pr:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run e2e:pr
      - name: Emit SSOT
        run: npx ts-node scripts/ci/emit-ssot.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-pr
          path: playwright-report/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssot-pr
          path: .artifacts/SSOT.md

  e2e-pr-mobile:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run e2e:pr:mobile
      - name: Emit SSOT
        run: npx ts-node scripts/ci/emit-ssot.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-pr-mobile
          path: playwright-report/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssot-pr-mobile
          path: .artifacts/SSOT.md

  csp-prod:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Build + start prod
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000
      - name: CSP smoke (prod build only)
        env:
          PW_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/csp.spec.ts --grep-invert @flaky --workers=1 --retries=0
      - name: Emit SSOT
        run: npx ts-node scripts/ci/emit-ssot.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-csp
          path: playwright-report/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssot-csp
          path: .artifacts/SSOT.md
