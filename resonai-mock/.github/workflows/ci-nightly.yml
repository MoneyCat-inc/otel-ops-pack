name: CI (Nightly)
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  e2e-flaky-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Start app
        run: |
          npm run build || true
          npm run start &
          npx wait-on http://localhost:3000
      - name: Run flakies with retries
        run: npm run e2e:grep:flaky
      - name: Export JSON reports (optional)
        run: |
          mkdir -p .artifacts/test-reports
          # example: if you enabled JSON reporters, copy them here
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nightly
          path: playwright-report/**
