name: CI (PR lane)
on:
  pull_request:
    branches: [ main ]
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run test:unit
      - name: Save unit report
        if: always()
        run: |
          mkdir -p .artifacts
          echo "Units completed" > .artifacts/unit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-artifacts
          path: .artifacts/**

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Start app
        run: |
          npm run build || true
          npm run start &
          npx wait-on http://localhost:3000
      - name: Run PR-stable E2E
        run: npm run e2e:grep:noflake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-pr
          path: playwright-report/**
