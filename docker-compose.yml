# Resonai Backend - Docker Compose Configuration
# Complete development and production environment setup

version: '3.8'

services:
  # =============================================================================
  # RESONAI BACKEND
  # =============================================================================
  resonai-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://resonai:password@postgres:5432/resonai
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - USER_HASH_SALT=${USER_HASH_SALT}
      - ALLOWED_ORIGIN=http://localhost:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_SERVICE_NAME=resonai-backend
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=production
      - SIGNOZ_API_URL=http://signoz-frontend:8080/api/v1
      - SIGNOZ_API_KEY=YMJnm6c+/poKMuEGsjOQZCKrOealu8NjX22QE66VdnQ=
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      signoz-otel-collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - resonai-network

  # =============================================================================
  # POSTGRESQL DATABASE
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=resonai
      - POSTGRES_USER=resonai
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonai -d resonai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resonai-network

  # =============================================================================
  # REDIS (for rate limiting and caching)
  # =============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - resonai-network

  # =============================================================================
  # SIGNOZ OBSERVABILITY STACK
  # =============================================================================
  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.88.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./signoz-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter metrics
    environment:
      - SIGNALFX_ACCESS_TOKEN=${SIGNALFX_ACCESS_TOKEN:-}
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - resonai-network

  signoz-frontend:
    image: signoz/signoz-frontend:0.25.0
    ports:
      - "8080:8080"
    environment:
      - SIGNOZ_OTEL_COLLECTOR_URL=http://signoz-otel-collector:4317
      - SIGNOZ_OTEL_COLLECTOR_HTTP_URL=http://signoz-otel-collector:4318
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      - resonai-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8.2-alpine
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.xml
    environment:
      - CLICKHOUSE_DB=signoz
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    restart: unless-stopped
    networks:
      - resonai-network

  # =============================================================================
  # DEVELOPMENT SERVICES
  # =============================================================================
  resonai-backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://resonai:password@postgres:5432/resonai_dev
      - NEXTAUTH_SECRET=dev-secret-key
      - NEXTAUTH_URL=http://localhost:3001
      - USER_HASH_SALT=dev-salt
      - ALLOWED_ORIGIN=http://localhost:3001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - DEBUG=resonai:*
      - PRISMA_LOG_LEVEL=query
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres-dev
      - redis
    restart: unless-stopped
    networks:
      - resonai-network
    profiles:
      - dev

  postgres-dev:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=resonai_dev
      - POSTGRES_USER=resonai
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - resonai-network
    profiles:
      - dev

  # =============================================================================
  # MONITORING AND UTILITIES
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@resonai.app
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - resonai-network
    profiles:
      - dev

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - resonai-network
    profiles:
      - dev

  # =============================================================================
  # BACKGROUND JOBS
  # =============================================================================
  resonai-background-jobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "scripts/background-jobs.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://resonai:password@postgres:5432/resonai
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
    depends_on:
      - postgres
      - redis
      - signoz-otel-collector
    restart: unless-stopped
    networks:
      - resonai-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  postgres_dev_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  resonai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16