# SigNoz/OTel Docker Stack - Optimized Configuration
# Schema migrators start last to ensure proper initialization order
# Includes graceful handling of optional services and comprehensive health checks

services:
  # =============================================================================
  # FOUNDATION SERVICES (Start First)
  # =============================================================================
  signoz-zookeeper:
    image: signoz/zookeeper:3.9.3
    container_name: signoz-zookeeper
    restart: unless-stopped
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: "9141"
    volumes:
      - signoz_zookeeper_data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep -q 'error.*null' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-clickhouse
    restart: unless-stopped
    depends_on:
      signoz-zookeeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DB: "signoz"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-cluster-config.xml:/etc/clickhouse-server/config.d/signoz-cluster.xml:ro
      - ./clickhouse-zookeeper-config.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =============================================================================
  # SIGNOZ CORE SERVICES
  # =============================================================================
  signoz:
    image: signoz/signoz:v0.96.1
    container_name: signoz
    restart: unless-stopped
    depends_on:
      signoz-zookeeper:
        condition: service_healthy
      signoz-clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - signoz_data:/var/lib/signoz
      - ./configs/prometheus/prometheus.yml:/root/config/prometheus.yml:ro
      - ./configs/dashboards:/root/config/dashboards:ro
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_JWT_SECRET: '${SIGNOZ_JWT_SECRET:-local-signoz-jwt-secret-rotate}'
      STORAGE: clickhouse
      GODEBUG: netdns=go
      DOT_METRICS_ENABLED: "true"
      DEPLOYMENT_TYPE: docker-local
      SIGNOZ_USAGE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =============================================================================
  # SCHEMA MIGRATORS (Critical - Must Complete Before Collector)
  # =============================================================================
  signoz-schema-migrator-sync:
    image: signoz/signoz-schema-migrator:v0.129.6
    container_name: signoz-schema-migrator-sync
    command: ["sync", "--dsn=tcp://signoz-clickhouse:9000", "--dev", "--up="]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: "no"
    networks:
      - signoz-net
    labels:
      - "order=T"
      - "priority=critical"
      - "service.type=migrator"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  signoz-schema-migrator-async:
    image: signoz/signoz-schema-migrator:v0.129.6
    container_name: signoz-schema-migrator-async
    command: ["async", "--dsn=tcp://signoz-clickhouse:9000", "--dev", "--up="]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    restart: "no"
    networks:
      - signoz-net
    labels:
      - "order=T"
      - "priority=critical"
      - "service.type=migrator"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # =============================================================================
  # OBSERVABILITY SERVICES
  # =============================================================================
  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.129.6
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      signoz:
        condition: service_healthy
    command:
      - --config=/etc/otel-collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    volumes:
      - ./signoz-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "18888:8888"   # Prometheus metrics
      - "18889:8889"   # Prometheus exporter metrics
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/13133' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  demo-app:
    image: otel-otel-demo-app
    container_name: demo-app
    restart: unless-stopped
    profiles:
      - demo
    depends_on:
      signoz-otel-collector:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=otel-demo-app
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # =============================================================================
  # GPU SERVICES (Optional - Only if images exist)
  # =============================================================================
  gpu-aggregation:
    image: otel-gpu-sidecar:latest
    container_name: gpu-aggregation
    restart: "no"
    ports:
      - "8002:8002"
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  gpu-inference:
    image: otel-gpu-sidecar:latest
    container_name: gpu-inference
    restart: "no"
    ports:
      - "8003:8003"
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  gpu-compression:
    image: otel-gpu-sidecar:latest
    container_name: gpu-compression
    restart: "no"
    ports:
      - "8001:8001"
    networks:
      - signoz-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  clickhouse_data:
    driver: local
  signoz_data:
    driver: local
  signoz_zookeeper_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  signoz-net:
    name: signoz-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: signoz-br

