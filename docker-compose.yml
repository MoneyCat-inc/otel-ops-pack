services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    # Enhanced for Codex-Cloud multi-file testing and agent automation

    container_name: signoz-clickhouse
    ports:
      - 9000:9000
      - 8123:8123
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - "clickhouse-client --query 'select 1'"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - otel_default
  signoz:
    image: signoz/signoz:v0.95.0
    container_name: signoz
    ports:
      - 8080:8080
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_ANALYTICS_ENABLED=true
      - SIGNOZ_JWT_SECRET=YourSuperSecretJWTToken123!@#WithAtLeast32CharactersLong
      - DEPLOYMENT_TYPE=docker-standalone-amd
    volumes:
      - signoz_data:/var/lib/signoz
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks:
      - otel_default
  otel-collector:
    image: signoz/signoz-otel-collector:v0.129.5
    container_name: signoz-otel-collector
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./signoz-collector-fixed.yaml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP HTTP receiver
      - 14317:4317 # OTLP gRPC for Windows collector
      - 14318:4318 # OTLP HTTP for Windows collector
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
    depends_on:
      signoz:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:13133/healthz
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - otel_default
volumes:
  clickhouse_data:
  signoz_data:

networks:
  otel_default:
    external: true
