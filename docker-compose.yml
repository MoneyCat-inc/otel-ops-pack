services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    # Enhanced for Codex-Cloud multi-file testing and agent automation

    container_name: signoz-clickhouse
    ports:
      - 9000:9000
      - 8123:8123
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_DB_DEFAULT=signoz_logs
      - CLICKHOUSE_USER_DEFAULT=default
      - CLICKHOUSE_PASSWORD_DEFAULT=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./config/clickhouse-logger.xml:/etc/clickhouse-server/config.d/logger.xml
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - 0.0.0.0:8123/ping
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'
  signoz:
    image: signoz/signoz:v0.95.0
    container_name: signoz
    ports:
      - 8080:8080
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_ANALYTICS_ENABLED=true
      - SIGNOZ_JWT_SECRET=YourSuperSecretJWTToken123!@#WithAtLeast32CharactersLong
      - DEPLOYMENT_TYPE=docker-standalone-amd
    volumes:
      - signoz_data:/var/lib/signoz
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
  otel-collector:
    image: signoz/signoz-otel-collector:v0.129.5
    container_name: signoz-otel-collector
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./config/signoz-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP HTTP receiver
      - 14317:4317 # OTLP gRPC for Windows collector
      - 14318:4318 # OTLP HTTP for Windows collector
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - OTEL_BATCH_PROCESSOR_TIMEOUT=200ms
      - OTEL_BATCH_PROCESSOR_SEND_BATCH_SIZE=1024
      - OTEL_BATCH_PROCESSOR_SEND_BATCH_MAX_SIZE=2048
      - OTEL_MEMORY_LIMITER_LIMIT_MIB=1024
      - OTEL_SENDING_QUEUE_NUM_CONSUMERS=8
      - OTEL_SENDING_QUEUE_QUEUE_SIZE=2048
    depends_on:
      signoz:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
volumes:
  clickhouse_data:
  signoz_data:
