# Lychee configuration tuned for BossCat docs lane checks
verbose = "info"
no_progress = true
cache = false
max_cache_age = "0s"

# Allow limited redirect chains so docs with short-link wrappers still resolve.
max_redirects = 5

# Retry once for transient CDN hiccups; values mirror docs lane gate defaults.
max_retries = 2
retry_wait_time = 2

# Accept HTTP 200 (OK) and 429 (rate limited) responses during gate checks.
accept = ["200", "429"]

include_fragments = false
skip_missing = false
include_verbatim = false
glob_ignore_case = false

exclude = [
  "^mailto:",
  "^tel:",
  "^https://localhost",
  "^http://localhost",
  "^https://127\\.0\\.0\\.1",
  "^http://127\\.0\\.0\\.1",
  # Private Pack 3B siblings: GitHub HTML returns 404 without session; prove via gh api in lane Report
  "^https://github\\.com/MoneyCat-inc/socm",
  "^https://github\\.com/MoneyCat-inc/scorebot",
  "^https://github\\.com/MoneyCat-inc/viz-engine"
]

max_concurrency = 8
timeout = 10
