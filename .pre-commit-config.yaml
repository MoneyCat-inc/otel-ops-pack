repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks: [ { id: black } ]
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks: [ { id: isort } ]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks: [ { id: flake8 } ]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks: [ { id: mypy } ]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks: [ { id: yamllint } ]
  - repo: local
    hooks:
      - id: pssa
        name: PSScriptAnalyzer
        language: system
        entry: pwsh -NoLogo -NoProfile -Command "Install-Module PSScriptAnalyzer -Scope CurrentUser -Force; Invoke-ScriptAnalyzer -Path scripts -Recurse"
        files: ^scripts/.*\.ps1$