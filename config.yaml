receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:5318
      grpc:
        endpoint: 0.0.0.0:5317

  prometheus/gpu:
    config:
      scrape_configs:
        - job_name: 'gpu-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:9400']

  filelog:
    include: [C:/logs/**/*.log]
    start_at: end
    include_file_path: true
    include_file_name_resolved: true
    operators:
      - type: json_parser
        parse_from: body
      - type: move
        from: attributes["log.file.name"]
        to: attributes["log.file.name"]

exporters:
  logging:
    loglevel: info

  otlp/sigz:
    endpoint: "localhost:14317"
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      queue_size: 2048

processors:
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  resource/defaults:
    attributes:
      - action: upsert
        key: service.name
        value: windows-otel-collector
      - action: upsert
        key: service.namespace
        value: platform
      - action: upsert
        key: deployment.environment
        value: local

  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-traces
        type: latency
        latency:
          threshold_ms: 500
      - name: canary
        type: string_attribute
        string_attribute:
          key: canary
          values: ["true"]
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: user.email
        action: delete

extensions:
  health_check:
    endpoint: 0.0.0.0:13134
    path: /healthz
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, tail_sampling, batch]
      exporters: [logging, otlp/sigz]
    metrics:
      receivers: [otlp, prometheus/gpu]
      processors: [memory_limiter, resource/defaults, batch]
      exporters: [logging, otlp/sigz]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource/defaults, batch, attributes/redact]
      exporters: [logging, otlp/sigz]
