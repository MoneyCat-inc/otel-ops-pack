# Canonical Windows collector config (otelcol-contrib service loads this file).
# Reference template: windows/otelcol/otelcol-contrib-config.yaml
extensions:
  health_check:
    endpoint: 127.0.0.1:13134
    path: /healthz
  file_storage:
    directory: C:\ProgramData\Otelcol\FileStorage
    timeout: 10s
    compaction:
      on_start: true

receivers:
  # OTLP receivers for direct application log ingestion
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:5320
      http:
        endpoint: 127.0.0.1:5321
  windowseventlog/application:
    channel: Application
    start_at: end
    poll_interval: 200ms
  windowseventlog/system:
    channel: System
    start_at: end
    poll_interval: 200ms
  filelog/queue:
    include:
      - C:/logs/queue/*.log
    start_at: end
    include_file_path: true
    include_file_name: true
    poll_interval: 200ms
    operators:
      - type: json_parser
        parse_from: body
  filelog/canary:
    include:
      - C:/logs/**/*.log
    start_at: end
    include_file_path: true
    include_file_name: true
    poll_interval: 200ms

processors:
  memory_limiter:
    limit_mib: 1024
    check_interval: 500ms
    spike_limit_mib: 512
  filter/drop_noise:
    logs:
      log_record:
        - attributes["winlog.event_id"] == 6005
        - attributes["winlog.event_id"] == 6006
        - attributes["winlog.event_id"] == 7036
        - IsMatch(body, "(?i)windows update|service control manager")
  attributes/redact_sensitive:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.response.header.authorization
        action: delete
      - key: http.request.header.x-api-key
        action: delete
  resource/defaults:
    attributes:
      - key: deployment.env
        value: local
        action: upsert
  resource/logs_only:
    attributes:
      - key: service.name
        value: windows-logs
        action: upsert
  attributes/label_source:
    actions:
      - key: log.source
        value: win-filelog
        action: upsert
  batch/logs:
    timeout: 200ms
    send_batch_size: 1024
    send_batch_max_size: 2048
  batch/traces:
    timeout: 200ms
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/metrics:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp:
    endpoint: localhost:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 8
      queue_size: 2048
      storage: file_storage
  kafka/logs:
    brokers:
      - localhost:9092
    topic: otel-logs
    encoding: otlp_json
    protocol_version: 2.0.0
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 8192
  kafka/traces:
    brokers:
      - localhost:9092
    topic: otel-traces
    encoding: otlp_json
    protocol_version: 2.0.0
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 8192
  kafka/metrics:
    brokers:
      - localhost:9092
    topic: otel-metrics
    encoding: otlp_json
    protocol_version: 2.0.0
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 8192

service:
  extensions:
    - health_check
    - file_storage
  pipelines:
    # Gate #026: Traces pipeline for .NET auto-instrumentation
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/defaults
        - attributes/redact_sensitive
        - batch/traces
      exporters:
        - otlp
        - kafka/traces
    
    # Gate #026: Metrics pipeline for .NET runtime metrics
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/defaults
        - batch/metrics
      exporters:
        - otlp
        - kafka/metrics
    
    logs:
      receivers:
        - otlp
        - windowseventlog/application
        - windowseventlog/system
        - filelog/queue
        - filelog/canary
      processors:
        - memory_limiter
        - filter/drop_noise
        - attributes/redact_sensitive
        - resource/defaults
        - resource/logs_only
        - attributes/label_source
        - batch/logs
      exporters:
        - otlp
        - kafka/logs

