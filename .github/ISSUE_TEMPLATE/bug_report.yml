name: "\U0001F41B Bug Report"
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels:
  - bug
  - needs-triage
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the OTel Ops Pack are you using?
      placeholder: e.g., v1.2.3 or commit hash
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - OpenTelemetry Collector
        - SigNoz Stack
        - PowerShell Scripts
        - Docker Compose
        - CI/CD Workflows
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Output
      description: Relevant logs, error messages, or command output
      placeholder: Paste relevant logs here...
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., Windows 11, Ubuntu 22.04]
        - PowerShell Version: [e.g., 7.3.0]
        - Docker Version: [e.g., 24.0.0]
        - OTel Collector Version: [e.g., 0.88.0]
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene Checklist
      description: Please confirm you've completed these checks
      options:
        - label: Ran `pwsh .\tools\hygiene.ps1` and reviewed results
          required: true
        - label: Checked for similar issues in existing issues/PRs
          required: true
        - label: Verified the issue occurs with latest main branch
          required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem here
      placeholder: Add any other context about the problem here...
