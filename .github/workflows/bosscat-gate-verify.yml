      ✅ **Gate×Site Matrix** - Event-based USE_MOCK (all sites mock for PRs)  
      ✅ **BossCat Verification** - Matching USE_MOCK strategy  
      ✅ **Prod-Only Evidence Rule** - `queueRequired = ($Site -eq 'prod' -and -not $useMock)`  
      ✅ **Synthetic Emitter** - Mock→httpbin, Real→OTLP  
      ✅ **ECRR Preflight** - Kill-switch + workspace prep  
