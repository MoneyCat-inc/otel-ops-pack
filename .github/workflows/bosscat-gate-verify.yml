name: BossCat Gate Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_types:
        description: 'Test types to run (space-separated)'
        required: false
        default: 'baseline load'
        type: string
      use_mock:
        description: 'Use mock SigNoz API'
        required: false
        default: true
        type: boolean
      gate:
        description: 'Gate target (e.g., IONA, GATE_006)'
        required: false
        default: 'IONA'
        type: string
      site:
        description: 'Site/environment (e.g., ci, local, prod)'
        required: false
        default: 'ci'
        type: string
      gpu_option_b:
        description: 'Require GPU_FIX Option B pass (<200ms P95)'
        required: false
        default: true
        type: boolean

jobs:
  gate-verification:
    name: Gate Verify (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ci, local, prod]
    env:
      GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'IONA' }}
      SITE: ${{ matrix.site }}
      SIGNOZ_API_KEY: ${{ secrets.SIGNOZ_API_KEY }}
      USE_MOCK: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      OTEL_SERVICE_NAME: iona-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:5318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      BASE_URL: https://httpbin.org
    concurrency:
      group: bosscat-gate-verify-${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.site }}
      cancel-in-progress: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'  # Using stable Python 3.12 for GitHub runners

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Enable corepack and install deps
      run: |
        corepack enable
        pnpm i --frozen-lockfile=false
        pnpm -v
        
    - name: Create required directories
      run: |
        mkdir -p DELT/ARTF
        mkdir -p docs/BossCat/reports
        mkdir -p docs/ecrr/ECRR_REPORTS
        mkdir -p docs/observability/snapshots
        
    - name: ECRR Preflight
      run: pnpm agent:preflight
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust flake8 black  # Add missing dependencies
        
    - name: Install k6 (Modern GPG method)
      run: |
        sudo apt-get install -y gnupg2 dirmngr
        curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: Verify installations
      run: |
        python --version
        k6 version
        locust --version
        
    - name: Run linting (optional)
      run: |
        python -m flake8 BRAV/SCPT/ --max-line-length=100 --ignore=E203,W503 || echo "Linting issues found but continuing..."
        python -m black --check BRAV/SCPT/ || echo "Black formatting issues found but continuing..."
      continue-on-error: true
        
    - name: Run OTLP smoke test
      run: |
        python BRAV/SCPT/test-otlp-smoke.py --verbose || echo "OTLP smoke test failed but continuing..."
      continue-on-error: true
        
    - name: Run BossCat pipeline
      run: |
        python BRAV/SCPT/run-local-pipeline.py \
          --use-mock \
          --test-types baseline load \
          --verbose

    - name: Run IONA Gate Verification
      shell: pwsh
      run: |
        pwsh -File scripts/verify-iona-gate.ps1 -Strict:$true -OutputJson 'DELT/ARTF/gate-verification-results.json' -PrCommentPath 'PR_COMMENT_IONA_GATE_002_FINAL.md' -Gate "$env:GATE" -Site "$env:SITE"

    - name: GPU_FIX lane (Option B)
      shell: pwsh
      run: |
        $require = $true
        if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $require = [System.Convert]::ToBoolean('${{ inputs.gpu_option_b }}') }
        ./scripts/gpu-fix-lane.ps1 -OptionBRequired:$require
      continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_option_b == false }}

    - name: GPU_FIX — start local mock target
      if: env.USE_MOCK == 'true' && matrix.gate == 'GPU_FIX'
      shell: bash
      run: |
        docker run -d --rm --name httpbin -p 8080:80 kennethreitz/httpbin
        for i in {1..20}; do
          if curl -fsS http://localhost:8080/status/200 >/dev/null 2>&1; then
            echo "httpbin is up"; break
          fi
          sleep 1
        done

    - name: GPU_FIX — resolve target & SLOs
      if: ${{ matrix.gate == 'GPU_FIX' }}
      shell: bash
      run: |
        echo "SITE=${{ matrix.site }}" >> "$GITHUB_ENV"
        if [ "${{ matrix.site }}" = "prod" ] && [ "${{ env.USE_MOCK }}" != "true" ]; then
          echo "SLO_P95_MS=200" >> $GITHUB_ENV
          echo "SLO_ERR_RATE=0.005" >> $GITHUB_ENV
        else
          echo "SLO_P95_MS=500" >> $GITHUB_ENV
          echo "SLO_ERR_RATE=0.01" >> $GITHUB_ENV
        fi
        if [ "${{ env.USE_MOCK }}" = "true" ]; then
          echo "TARGET_URL=http://localhost:8080/get?gpu_fix=true" >> "$GITHUB_ENV"
        else
          echo "TARGET_URL=https://httpbin.org/get?gpu_fix=true" >> "$GITHUB_ENV"
        fi
        echo "ARTIFACT_DIR=DELT/ARTF" >> $GITHUB_ENV

    - name: Ensure artifacts dir exists
      if: ${{ matrix.gate == 'GPU_FIX' }}
      run: |
        mkdir -p DELT/ARTF
        mkdir -p DELT/ARTF/gpu_fix

    - name: GPU_FIX — run k6 smoke (gated)
      if: ${{ matrix.gate == 'GPU_FIX' }}
      uses: grafana/k6-action@v0.2.0
      with:
        filename: ./BRAV/SCPT/load/gpu_fix.js
        flags: >-
          --vus 20 --duration 60s
          --summary-export DELT/ARTF/gpu_fix/k6-summary.json
      env:
        TARGET_URL: ${{ env.TARGET_URL }}
        SLO_P95_MS: ${{ env.SLO_P95_MS }}
        SLO_ERR_RATE: ${{ env.SLO_ERR_RATE }}

    - name: PERF_SUMMARY — roll up GPU_FIX (non-gating)
      if: always() && matrix.gate == 'GPU_FIX'
      run: node scripts/summarize-perf.js

    - name: GPU_FIX — stop mock target
      if: always() && env.USE_MOCK == 'true' && matrix.gate == 'GPU_FIX'
      run: docker stop httpbin || true
      shell: bash

    - name: Upload GPU_FIX artifacts (scoped)
      if: always() && matrix.gate == 'GPU_FIX'
      uses: actions/upload-artifact@v4
      with:
        name: gpu_fix-${{ matrix.site }}-${{ github.run_number }}
        path: |
          DELT/ARTF/gpu_fix/k6-summary.json
          DELT/ARTF/gpu_fix/gpu_fix_summary.json
        retention-days: 14

    
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bosscat-test-results-${{ matrix.site }}-${{ github.run_number }}
        path: |
          DELT/ARTF/
          docs/BossCat/reports/
          PR_COMMENT_IONA_GATE_002_FINAL.md
          artifacts/*.txt
        retention-days: 14
        
    - name: Generate ECRR Report
      if: always()
      run: |
        python BRAV/SCPT/generate-ecrr-report.py \
          --gate-results DELT/ARTF/gate-verification-results.json \
          --output docs/BossCat/reports/ECRR_CI_RUN.md \
          --pdf docs/BossCat/reports/ECRR_CI_RUN.pdf || echo "ECRR report generation failed"
      continue-on-error: true
          
    - name: Generate BOSS v2 Report
      if: always()
      run: |
        python BRAV/SCPT/generate-boss-v2-report.py \
          --gate-results DELT/ARTF/gate-verification-results.json \
          --output docs/BossCat/reports/BOSS_v2_CI_RUN.md \
          --pdf docs/BossCat/reports/BOSS_v2_CI_RUN.pdf || echo "BOSS v2 report generation failed"
      continue-on-error: true

    - name: Generate queue steward evidence (best-effort)
      if: always()
      shell: pwsh
      run: |
        if (!(Test-Path 'docs/observability/snapshots')) {
          Write-Host "No snapshots directory found; skipping evidence generation"; return
        }
        $candidates = @(
          'BRAV/SCPT/generate-queue-steward-evidence.ps1',
          'brav/scpt/generate-queue-steward-evidence.ps1',
          'scripts/generate-queue-steward-evidence.ps1'
        )
        $hit = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if ($hit) { pwsh -File $hit } else { Write-Host 'evidence script not found — skipping' }
      continue-on-error: true
          
    - name: Upload Final Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bosscat-reports-${{ matrix.site }}-${{ github.run_number }}
        path: docs/BossCat/reports/
        retention-days: 14

    - name: Run ECRR benchmark and append trend
      if: always()
      shell: pwsh
      run: |
        if (Test-Path 'BRAV/SCPT/benchmark-process-all-ecrr-reports.ps1') {
          ./BRAV/SCPT/benchmark-process-all-ecrr-reports.ps1
        } elseif (Test-Path 'scripts/benchmark-process-all-ecrr-reports.ps1') {
          ./scripts/benchmark-process-all-ecrr-reports.ps1
        } else {
          Write-Host "ECRR benchmark script not found; skipping"
        }
        if (Test-Path 'scripts/append-ecrr-benchmark-trend.ps1') {
          ./scripts/append-ecrr-benchmark-trend.ps1 -BenchmarkJson 'DELT/ARTF/ecrr-benchmark.json' -OutputCsv 'DELT/ARTF/ecrr-benchmark-trend.csv' -MirrorCsv 'artifacts/ecrr-benchmark-trend.csv' -Dedup
        }
      continue-on-error: true

    - name: Upload ECRR benchmark artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ecrr-benchmark-${{ matrix.site }}-${{ github.run_number }}
        path: |
          DELT/ARTF/ecrr-benchmark.json
          DELT/ARTF/ecrr-benchmark-trend.csv
          artifacts/ecrr-benchmark-trend.csv
        retention-days: 14

    - name: Publish Perf Summary (GPU_FIX)
      if: always()
      shell: pwsh
      run: |
        $summaryFile = $env:GITHUB_STEP_SUMMARY
        if (Test-Path 'DELT/ARTF/gate-verification-results.json') {
          try {
            $j = Get-Content 'DELT/ARTF/gate-verification-results.json' -Raw | ConvertFrom-Json
            $gate = $env:GATE; $site = $env:SITE
            $p95 = $null
            if ($j.k6 -and $j.k6.p95) { $p95 = $j.k6.p95 } elseif ($j.k6 -and $j.k6.'p95') { $p95 = $j.k6.'p95' }
            $p5317 = $false; if ($j.otlp_ports -and $j.otlp_ports.'5317' -ne $null) { $p5317 = [bool]$j.otlp_ports.'5317' }
            $p5318 = $false; if ($j.otlp_ports -and $j.otlp_ports.'5318' -ne $null) { $p5318 = [bool]$j.otlp_ports.'5318' }
            $span = $false; if ($j.synthetic_span -and $j.synthetic_span.success -ne $null) { $span = [bool]$j.synthetic_span.success }
            $status = $j.status
            Add-Content -Path $summaryFile -Value "## GPU_FIX Summary"
            Add-Content -Path $summaryFile -Value "- Gate: $gate"
            Add-Content -Path $summaryFile -Value "- Site: $site"
            Add-Content -Path $summaryFile -Value "- Status: $status"
            Add-Content -Path $summaryFile -Value "- Ports: 5317=$p5317 5318=$p5318"
            Add-Content -Path $summaryFile -Value "- Synthetic Span (iona.boot): $span"
            if ($p95 -ne $null) { Add-Content -Path $summaryFile -Value "- P95 (ms): $p95" }
            Add-Content -Path $summaryFile -Value ""
            # IONA Gate Verdict from PR comment file (with guards)
            Add-Content -Path $summaryFile -Value "## IONA Gate Verdict"
            if (Test-Path 'PR_COMMENT_IONA_GATE_002_FINAL.md') {
              try {
                $comment = Get-Content 'PR_COMMENT_IONA_GATE_002_FINAL.md' -Raw
                $verdict = $null
                if ($comment -match 'Verdict:\s*(\w+)') { $verdict = $Matches[1] }
                if ($verdict) {
                  Add-Content -Path $summaryFile -Value "- Verdict: $verdict"
                  Add-Content -Path $summaryFile -Value "- Gate: $gate"
                  Add-Content -Path $summaryFile -Value "- Site: $site"
                } else {
                  Add-Content -Path $summaryFile -Value "⚠️ Verdict not found in PR comment"
                }
              } catch {
                Add-Content -Path $summaryFile -Value "⚠️ Error parsing PR comment: $($_.Exception.Message)"
              }
            } else {
              Add-Content -Path $summaryFile -Value "⚠️ PR comment file not generated"
            }
          } catch {
            Add-Content -Path $summaryFile -Value "⚠️ Unable to parse gate-verification-results.json: $($_.Exception.Message)"
          }
        } else {
          Add-Content -Path $summaryFile -Value "⚠️ Gate verification results not found"
        }

    - name: ECRR Process (pilot)
      if: always()
      shell: bash
      run: |
        RUN_DIR="artifacts/ecrr/org=${GITHUB_REPOSITORY%/*}/repo=${GITHUB_REPOSITORY#*/}/dt=$(date -u +%Y)/$(date -u +%m)/$(date -u +%d)/run=${GITHUB_RUN_ID}"
        mkdir -p "$RUN_DIR/logs"
        printf "workflow=%s run=%s status=%s\n" "$GITHUB_WORKFLOW" "$GITHUB_RUN_NUMBER" "${{ job.status }}" > "$RUN_DIR/logs/ci.log"
        cat > "$RUN_DIR/meta.json" <<'META'
        { "org":"${GITHUB_REPOSITORY%/*}", "repo":"${GITHUB_REPOSITORY#*/}", "run_id": ${GITHUB_RUN_ID}, "run_number": ${GITHUB_RUN_NUMBER}, "name": "${GITHUB_WORKFLOW}", "event": "${GITHUB_EVENT_NAME}", "status": "completed", "conclusion": "${{ job.status }}", "head_branch": "${GITHUB_REF_NAME}", "head_sha": "${GITHUB_SHA}", "created_at": "$(date -u +%FT%TZ)", "updated_at": "$(date -u +%FT%TZ)", "storage": { "root": "artifacts/ecrr", "date": "$(date -u +%Y-%m-%d)", "dir": "$RUN_DIR" } }
        META
        export RUN_DIR
        pnpm normalize:run || true
        pnpm classify:run || true
        pnpm summarize:run || true
        echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV

    - name: ECRR PR Comment (pilot)
      if: github.event_name == 'pull_request'
      env:
        RUN_DIR: ${{ env.RUN_DIR }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tsx scripts/actor-pr-comment.ts --dir "$RUN_DIR"

    - name: Publish Job Summary
      if: always()
      shell: bash
      run: |
        echo "## BossCat Gate Verification" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
        echo "- Run: #$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
        echo "- Ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
        echo "- Actor: $GITHUB_ACTOR" >> "$GITHUB_STEP_SUMMARY"
        echo "- Gate: ${GATE:-IONA}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Site: ${{ matrix.site }}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
        echo "- \\`DELT/ARTF\\` (logs, metrics)" >> "$GITHUB_STEP_SUMMARY"
        echo "- \\`docs/BossCat/reports\\` (ECRR/BOSS reports)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Artifact name: \`bosscat-test-results-${{ matrix.site }}-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "> Retention set to 14 days for uploaded artifacts." >> "$GITHUB_STEP_SUMMARY"


    - name: Emit synthetic trace (IONA)
      run: pnpm emit

      **🐾 cursor{implementer} - SESSION COMPLETE & CONFIRMED**

