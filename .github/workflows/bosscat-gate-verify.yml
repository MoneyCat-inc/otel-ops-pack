# KEEP -- Phase 0 workflow audit 2026-08-03: primary IONA gate verification on main; candidate for Phase 2 slimming
name: BossCat Gate Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: bosscat-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate Verify (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site: [local, ci, stg, prod]
        gate: [IONA]

    env:
      STRICTNESS: ${{ matrix.site == 'prod' && 'prod' || 'ci' }}
      GATE: ${{ matrix.gate }}
      SITE: ${{ matrix.site }}
      SBOM_STRICT: ${{ vars.SBOM_STRICT || 'false' }}

    steps:
      - name: Matrix Selection Echo
        shell: bash
        run: |
          echo "::notice title=Matrix Selection::Site=${{ matrix.site }} Gate=${{ matrix.gate }} selected"
          echo "Event: ${{ github.event_name }}"
          echo "Site: ${{ matrix.site }}"
          echo "Gate: ${{ matrix.gate }}"
          echo "Strictness: $STRICTNESS"
      
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Guard - Required files tracked by git
        shell: bash
        run: bash scripts/guard-required-files.sh

      - name: Guard - Inflated metrics blocked
        shell: pwsh
        run: pwsh -File scripts/guard-inflated-metrics.ps1

      - name: Guard - OTel ports JSON matches collector YAML
        shell: pwsh
        run: pwsh -File BRAV/SCPT/check-otel-ports-drift.ps1

      - name: Lint workflow (actionlint)
        uses: rhysd/actionlint@v1.7.12
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Assert required artifacts in repo
        run: |
          test -f signature-registry.json || { echo "::error title=Missing file::signature-registry.json not found"; exit 1; }
          test -f Vasilisa_High_Priestess_TinCanForest.jpg || { echo "::error title=Missing mascot::Vasilisa_High_Priestess_TinCanForest.jpg not found"; exit 1; }
          echo "[OK] Required artifacts present"

      - name: Compute LOC delta
        shell: bash
        run: |
          mkdir -p gate
          base_ref="${{ github.base_ref || 'main' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --numstat HEAD~1..HEAD > gate/numstat.txt || echo "0 0 none" > gate/numstat.txt
          else
            git fetch origin +refs/heads/$base_ref:refs/remotes/origin/$base_ref 2>/dev/null || true
            git diff --numstat origin/$base_ref...HEAD > gate/numstat.txt || echo "0 0 none" > gate/numstat.txt
          fi
          awk '{add+=$1; del+=$2} END {print "{\"added\":" add ",\"deleted\":" del ",\"total\":" add+del "}"}' gate/numstat.txt > gate/loc.json
          cat gate/loc.json

      - name: Run gate verification script
        shell: pwsh
        continue-on-error: true
        run: |
          pwsh -File scripts/verify-iona-gate.ps1 `
            -Gate $env:GATE `
            -Site $env:SITE `
            -OutputJson artifacts/gate-verification-results.json `
            -PrCommentPath PR_COMMENT_IONA_GATE_002_FINAL.md

      - name: Generate SBOM + Attestation (prod only)
        if: matrix.site == 'prod'
        shell: bash
        run: |
          mkdir -p DELT/ARTF/sbom
          pnpm comp:sbom || { echo "WARNING: SBOM generation failed"; exit 1; }
          
          # Search for SBOM in expected locations
          if [ -f "DELT/ARTF/sbom.json" ]; then
            echo "[OK] SBOM already at canonical location"
          elif [ -f "sbom.json" ]; then
            mv sbom.json DELT/ARTF/sbom.json
            echo "[OK] SBOM moved to DELT/ARTF"
          elif [ -f "artifacts/sbom.json" ]; then
            cp artifacts/sbom.json DELT/ARTF/sbom.json
            echo "[OK] SBOM copied from artifacts/"
          else
            echo "::error::SBOM not found in expected locations"
            exit 1
          fi
          
          # Generate checksums for audit trail
          sha256sum DELT/ARTF/sbom.json > DELT/ARTF/sbom.json.sha256 || true
          
          # Generate signature registry
          pnpm guard:signatures || echo "WARNING: Signature registry generation failed"
          if [ -f "signature-registry.json" ]; then
            cp signature-registry.json DELT/ARTF/sbom/
            sha256sum DELT/ARTF/sbom/signature-registry.json > DELT/ARTF/sbom/signature-registry.json.sha256 || true
          fi
        continue-on-error: ${{ matrix.site != 'prod' }}
      
      - name: Verify SBOM (strict when SBOM_STRICT=true)
        if: matrix.site == 'prod' && always()
        shell: bash
        run: |
          if [ -f "DELT/ARTF/sbom.json" ]; then
            echo "[OK] SBOM verification passed"
          else
            echo "::error::SBOM missing (strict mode: $SBOM_STRICT)"
            exit 1
          fi
        continue-on-error: ${{ env.SBOM_STRICT != 'true' }}

      - name: RSI metrics extraction
        if: always()
        shell: bash
        run: |
          node scripts/rsi-extract.mjs docs/BossCat/README.md || echo "WARNING: RSI extraction failed"
        continue-on-error: true

      - name: ICF rollup (panel feeder)
        if: always()
        shell: bash
        run: |
          pnpm icf:rollup || echo "WARNING: ICF rollup failed"
        continue-on-error: true
      - name: Archive ICF rollup (timestamped)
        if: matrix.site == 'ci' && always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/icf
          if [[ -f artifacts/icf/rollup.json ]]; then
            ts=$(jq -r '.timestamp // empty' artifacts/icf/rollup.json || true)
            [[ -z "$ts" ]] && ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            # Keep ISO format but replace colons with hyphens for filename safety
            ts2="$(echo "$ts" | sed 's/:/-/g')"
            cp artifacts/icf/rollup.json "artifacts/icf/rollup.demo-${ts2}.json"
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.site == 'ci' && always()
        with:
          name: icf-rollup-${{ github.run_number }}
          path: artifacts/icf/rollup*.json
          retention-days: 14      
      - name: Publish RSI metrics for status UI (main branch only)
        if: github.ref == 'refs/heads/main' && always()
        shell: bash
        run: |
          mkdir -p docs/artifacts/rsi
          if [ -f "artifacts/rsi/rsi.json" ]; then
            cp -f artifacts/rsi/rsi.json docs/artifacts/rsi/metrics.json
            echo "[OK] RSI metrics published for status UI"
          fi
        continue-on-error: true

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.site }}-${{ github.run_number }}
          path: |
            DELT/ARTF/
            gate/
            PR_COMMENT_IONA_GATE_002_FINAL.md
            artifacts/rsi/
          retention-days: 90

      - name: Upload SBOM artifacts (prod only)
        if: matrix.site == 'prod' && always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-attestation-${{ github.run_number }}
          path: |
            DELT/ARTF/sbom.json
            DELT/ARTF/sbom.json.sha256
            DELT/ARTF/sbom/signature-registry.json
            DELT/ARTF/sbom/signature-registry.json.sha256
          retention-days: 90

      - name: Check consecutive green prod runs (>=3) and propose SBOM_STRICT=true
        if: matrix.site == 'prod' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          file="bosscat-gate-verify.yml"
          ok=$(gh api \
            "/repos/$REPO/actions/workflows/$file/runs?branch=main&status=success&per_page=5" \
            --jq '.workflow_runs | map(select(.event=="push")) | length' || echo 0)
          if [[ "$ok" -ge 3 ]]; then
            git config user.name  "bosscat-oem-bot"
            git config user.email "bosscat@users.noreply.github.com"
            git checkout -b chore/sbom-strict-on || true
            sed -i 's/SBOM_STRICT\s*:\s*.*/SBOM_STRICT: true/' .github/workflows/bosscat-gate-verify.yml || true
            git commit -am "chore(gate): SBOM_STRICT=true after >=3 consecutive green prod runs" || true
            git push --set-upstream origin chore/sbom-strict-on || true
            gh pr create --title "Ratchet: SBOM_STRICT=true" \
              --body "Automated proposal after >=3 consecutive green prod runs. Human review required." || true
          fi
      - name: Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### BossCat Gate Verification"
            echo ""
            echo "**Site**: ${{ matrix.site }}"
            echo "**Strictness**: $STRICTNESS"
            echo "**Gate**: $GATE"
            echo "**SBOM Strict**: $SBOM_STRICT"
            echo ""
            gate_json="artifacts/gate-verification-results.json"
            if [ ! -f "$gate_json" ] && [ -f "DELT/ARTF/gate-verification-results.json" ]; then
              echo "::warning::BossCat gate verifier is still reading from DELT/ARTF; migrate workflows to artifacts/."
              gate_json="DELT/ARTF/gate-verification-results.json"
            fi
            if [ -f "$gate_json" ]; then
              verdict=$(jq -r '.verdict // "UNKNOWN"' "$gate_json")
              echo "**Verdict**: $verdict"
            fi
            if [ -f "gate/loc.json" ]; then
              echo ""
              echo "**LOC Delta**:"
              cat gate/loc.json
            fi
            if [ "${{ matrix.site }}" = "prod" ] && [ -f "DELT/ARTF/sbom.json" ]; then
              echo ""
              echo "[OK] **SBOM Generated**: DELT/ARTF/sbom.json"
              echo "**Artifact**: sbom-attestation-${{ github.run_number }}"
            fi
            echo ""
            echo "---"
            echo "**ECRR**: Examine ✓ | Contain ✓ | Rollback ✓ | Report ✓"
          } >> $GITHUB_STEP_SUMMARY

