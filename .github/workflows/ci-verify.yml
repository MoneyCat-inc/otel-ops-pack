name: Observability Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: obs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability-verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        version: '7.4'
        
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /var/lib/docker
        key: docker-layers-${{ hashFiles('docker-compose.yml', 'deploy/signoz/docker-compose.yml') }}
        restore-keys: |
          docker-layers-
      
    - name: Start SigNoz Stack
      run: |
        # Start ClickHouse first for cold-start stability
        docker compose -f docker-compose.yml up -d signoz-clickhouse
        docker compose -f deploy/signoz/docker-compose.yml -f deploy/signoz/docker-compose.override.yml up -d zookeeper-1
        
        # Wait for ClickHouse to be ready
        echo "Waiting for ClickHouse to be ready..."
        timeout 60 bash -c 'until docker exec signoz-clickhouse clickhouse-client -q "SELECT 1"; do sleep 2; done'
        
        # Start remaining services
        docker compose -f docker-compose.yml up -d
        docker compose -f deploy/signoz/docker-compose.yml up -d
        
        # Run schema migrations
        echo "Running schema migrations..."
        docker compose -f deploy/signoz/docker-compose.yml -f deploy/signoz/docker-compose.override.yml run --rm signoz-schema-migrator
        
        # Restart query service to pick up schema changes
        docker compose -f deploy/signoz/docker-compose.yml restart signoz-query-service
        
        # Wait for services to stabilize
        echo "Waiting for services to stabilize..."
        timeout 30 bash -c 'until curl -f http://localhost:8080/api/v1/query?query=up; do sleep 2; done'
        
    - name: Install OpenTelemetry Collector
      run: |
        # Download and install otelcol-contrib for Linux
        $url = "https://github.com/open-telemetry/opentelemetry-collector-contrib/releases/latest/download/otelcol-contrib_linux_amd64.tar.gz"
        $output = "otelcol-contrib.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile $output
        tar -xzf $output -C /usr/local/bin/
        chmod +x /usr/local/bin/otelcol-contrib
        
        # Validate config
        /usr/local/bin/otelcol-contrib --config "config.yaml" --dry-run
        
    - name: Generate Test Data
      run: |
        # Create logs directory
        mkdir -p /tmp/logs/synthetic
        
        # Generate synthetic test data (shorter for CI)
        pwsh -File "scripts/dataset/generate-logs.ps1" -Rate 10 -Duration 15 -ErrorRate 0.15
        
        # Start collector in background
        /usr/local/bin/otelcol-contrib --config "config.yaml" &
        COLLECTOR_PID=$!
        
        # Wait for ingestion
        echo "Waiting for data ingestion..."
        sleep 10
        
    - name: Run Observability Verification
      id: verify
      env:
        SIGNOZ_API_TOKEN: ${{ secrets.SIGNOZ_API_TOKEN }}
      run: |
        # Run the verification script
        $result = pwsh -File "scripts/ci-verify.ps1"
        
        # Write result to file for artifact
        $result | Out-File -FilePath "verification-report.md" -Encoding UTF8
        
        # Extract PASS/FAIL status
        if ($result -match "Overall: ✅ PASS") {
          echo "status=PASS" >> $env:GITHUB_OUTPUT
        } else {
          echo "status=FAIL" >> $env:GITHUB_OUTPUT
        }
        
    - name: Generate Job Summary
      if: always()
      run: |
        echo "## 🔍 Observability Verify — Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Extract key metrics from verification report
        if [ -f "verification-report.md" ]; then
          echo "### Verification Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(Status:|Overall:)" verification-report.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Key Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- **Collector**: $(if [ "${{ steps.verify.outputs.status }}" = "PASS" ]; then echo "✅ healthz 200"; else echo "❌ failed"; fi)" >> $GITHUB_STEP_SUMMARY
        echo "- **SigNoz**: $(if [ "${{ steps.verify.outputs.status }}" = "PASS" ]; then echo "✅ schema ok"; else echo "❌ failed"; fi)" >> $GITHUB_STEP_SUMMARY
        echo "- **API**: $(if [ "${{ steps.verify.outputs.status }}" = "PASS" ]; then echo "✅ synthetic_id found"; else echo "❌ failed"; fi)" >> $GITHUB_STEP_SUMMARY
        
    - name: Upload Verification Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: observability-verification-report
        path: verification-report.md
        retention-days: 30
        
    - name: Upload observability evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: observability-evidence
        path: artifacts/*
        if-no-files-found: ignore
        retention-days: 7

    - name: Summarize observability evidence
      if: always()
      shell: bash
      run: |
        set -euo pipefail

        RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        echo "## 🔍 Observability Verify — Job Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Run artifacts:** $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
        echo "- **PR checklist:** \`artifacts/GO_TIME_CHECKLIST.md\` (in repo)" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        # Helper: safely print a redacted tail of a file (Bearer/pwd masks)
        redact_tail () {
          local file="$1"
          local title="$2"
          echo "### ${title} (tail, redacted)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```txt' >> "$GITHUB_STEP_SUMMARY"
          # mask Bearer tokens and pwd= values before printing
          tail -n 60 "$file" \
            | sed -E 's/(Bearer[[:space:]]+)[A-Za-z0-9._-]+/\1***/g' \
            | sed -E 's/(pwd=)[^[:space:]]+/\1***/g' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        }

        if [ -f artifacts/verify-run.txt ]; then
          redact_tail artifacts/verify-run.txt "verify-run.txt"
          # Try to surface the success line clearly
          if grep -q "== Verification complete: all checks passed ==" artifacts/verify-run.txt; then
            echo "- ✅ **Verification result:** all checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ **Verification result:** did not find success line" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -f artifacts/api-sample.json ]; then
          # Print a compact, redacted JSON preview
          echo "### api-sample.json (preview, redacted)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          # jq for pretty print if available; otherwise cat
          if command -v jq >/dev/null 2>&1; then
            jq '.' artifacts/api-sample.json \
              | sed -E 's/(\"auth_header\"\s*:\s*\")([^\"]+)(\")/\1***\3/g' \
              | sed -E 's/(\"secret_example\"\s*:\s*\")([^\"]+)(\")/\1***\3/g' >> "$GITHUB_STEP_SUMMARY"
          else
            sed -E 's/(\"auth_header\"\s*:\s*\")([^\"]+)(\")/\1***\3/g; s/(\"secret_example\"\s*:\s*\")([^\"]+)(\")/\1***\3/g' artifacts/api-sample.json \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "> 🔐 **Note:** Full files are attached as artifacts (7-day retention). Redaction is applied in this summary." >> "$GITHUB_STEP_SUMMARY"
        
        # Add direct artifact links for easy reviewer access
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### 🔗 Direct Artifact Links" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "For quick reviewer access:" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Download all artifacts:** [observability-evidence.zip]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Quick Approver's Guide:** Check the 3-point checklist above" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Full Checklist:** [artifacts/REVIEWER_CHECKLIST.md](https://github.com/$GITHUB_REPOSITORY/blob/main/artifacts/REVIEWER_CHECKLIST.md)" >> "$GITHUB_STEP_SUMMARY"
        
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('verification-report.md', 'utf8');
          
          const comment = `## 🔍 Observability Health Check Results
          
          ${report}
          
          <details>
          <summary>📋 Full Report</summary>
          
          \`\`\`markdown
          ${report}
          \`\`\`
          </details>`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
          
    - name: Set Status Check
      if: steps.verify.outputs.status == 'FAIL'
      run: |
        Write-Error "Observability verification failed. Check the verification report for details."
        exit 1
        
    - name: Cleanup
      if: always()
      run: |
        # Stop collector
        if [ ! -z "$COLLECTOR_PID" ]; then
          kill $COLLECTOR_PID 2>/dev/null || true
        fi
        
        # Stop services
        docker compose -f docker-compose.yml down
        docker compose -f deploy/signoz/docker-compose.yml down
