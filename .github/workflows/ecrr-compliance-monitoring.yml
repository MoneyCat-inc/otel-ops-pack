name: ECRR Compliance Monitoring

on:
  push:
    branches: [ main, develop ]
    paths:
      - "docs/ECRR_REPORTS/**"
      - "scripts/ecrr-*.ps1"
  pull_request:
    branches: [ main ]
    paths:
      - "docs/ECRR_REPORTS/**"
      - "scripts/ecrr-*.ps1"
  schedule:
    # Run daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "ECRR Action to perform"
        required: true
        default: "check"
        type: choice
        options:
        - check
        - gate
        - report
        - notify

jobs:
  ecrr-compliance-check:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        version: "7.4"
    
    - name: Initialize ECRR Monitoring
      run: |
        pwsh -File scripts/ecrr-compliance-monitoring.ps1 -OutputPath "artifacts/ecrr-compliance-monitoring" -ConfigPath "config/ecrr-monitoring.json"
    
    - name: Run ECRR Compliance Check
      run: |
        pwsh -File scripts/ecrr-cicd-integration.ps1 -Action "check" -Branch "${{ github.ref_name }}" -CommitHash "${{ github.sha }}"
    
    - name: Generate Compliance Report
      if: always()
      run: |
        pwsh -File scripts/ecrr-compliance-monitoring.ps1 -Dashboard -OutputPath "artifacts/ecrr-compliance-monitoring"
    
    - name: Upload Compliance Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ecrr-compliance-report-${{ github.run_number }}
        path: |
          artifacts/ecrr-compliance-monitoring/
          artifacts/ci-compliance-report.json
        retention-days: 30
    
    - name: ECRR Compliance Gate
      if: github.event_name == "pull_request" || github.event.inputs.action == "gate"
      run: |
        pwsh -File scripts/ecrr-cicd-integration.ps1 -Action "gate" -FailOnRegression -Branch "${{ github.ref_name }}" -CommitHash "${{ github.sha }}"
    
    - name: Send Slack Notification
      if: failure() && github.event_name == "push"
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "ECRR Compliance Check Failed - Score below threshold"
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Comment PR with Compliance Report
      if: github.event_name == "pull_request"
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require("fs");
          const path = require("path");
          
          try {
            const reportPath = "artifacts/ci-compliance-report.json";
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              const compliance = report.Compliance;
              
              const comment = `## 🔍 ECRR Compliance Check Results
              
              **Status**: ${compliance.Status}
              **Overall Score**: ${Math.round(compliance.OverallScore * 10) / 10}%
              **Previous Score**: ${Math.round(compliance.PreviousScore * 10) / 10}%
              **Regression**: ${Math.round(compliance.Regression * 10) / 10}%
              **Total Reports**: ${compliance.TotalReports}
              
              ${compliance.Status === "PASS" ? "✅" : "❌"} ${compliance.Status === "PASS" ? "Compliance check passed" : "Compliance issues detected"}
              
              <details>
              <summary>View detailed report</summary>
              
              \`\`\`json
              ${JSON.stringify(report, null, 2)}
              \`\`\`
              </details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log("Could not create compliance comment:", error.message);
          }

  ecrr-compliance-monitoring:
    runs-on: windows-latest
    if: github.event_name == "schedule" || github.event.inputs.action == "notify"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        version: "7.4"
    
    - name: Run Continuous Monitoring
      run: |
        pwsh -File scripts/ecrr-compliance-monitoring.ps1 -Continuous -Dashboard -Alert -OutputPath "artifacts/ecrr-compliance-monitoring"
      timeout-minutes: 10
    
    - name: Upload Monitoring Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ecrr-monitoring-results-${{ github.run_number }}
        path: artifacts/ecrr-compliance-monitoring/
        retention-days: 7
