name: Nightly Tetragrammaton Benchmarks

on:
  schedule:
    # Run daily at 2 AM UTC (executive dashboard export time)
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering
    inputs:
      include_dashboard_export:
        description: "Include SigNoz dashboard export"
        required: false
        default: "true"
        type: boolean
      include_cross_language:
        description: "Include cross-language comparison"
        required: false
        default: "true"
        type: boolean
      include_quadrant_matrix:
        description: "Include quadrant matrix analysis"
        required: false
        default: "true"
        type: boolean

env:
  SIGNOZ_URL: http://localhost:8080
  NODEJS_BENCHMARK_PATH: C:\Users\fubum\nodejs_benchmark
  PYTHON_BENCHMARK_PATH: C:\Users\fubum\codex_local_test
  OUTPUT_ROOT: artifacts/nightly-tetragrammaton-ci
  ECRR_REPORT_DIR: docs/ecrr/ECRR_REPORTS
  BOSSCAT_SNAPSHOT_DIR: docs/observability/snapshots

jobs:
  tetragrammaton-benchmarks:
    name: Tetragrammaton Cross-Language Benchmarks
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for BossCat compliance

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: "7.x"

      - name: Validate Benchmark Environments
        run: |
          Write-Host "🔍 Validating Tetragrammaton benchmark environments..." -ForegroundColor Cyan
          
          # Check NodeJS benchmark path
          if (Test-Path "$env:NODEJS_BENCHMARK_PATH") {
            Write-Host "✅ NodeJS benchmark path accessible: $env:NODEJS_BENCHMARK_PATH" -ForegroundColor Green
          } else {
            Write-Host "❌ NodeJS benchmark path not found: $env:NODEJS_BENCHMARK_PATH" -ForegroundColor Red
            exit 1
          }
          
          # Check Python benchmark path
          if (Test-Path "$env:PYTHON_BENCHMARK_PATH") {
            Write-Host "✅ Python benchmark path accessible: $env:PYTHON_BENCHMARK_PATH" -ForegroundColor Green
          } else {
            Write-Host "❌ Python benchmark path not found: $env:PYTHON_BENCHMARK_PATH" -ForegroundColor Red
            exit 1
          }

      - name: Dry Run Validation
        run: |
          Write-Host "🧪 Executing dry run validation..." -ForegroundColor Cyan
          pwsh -File BRAV/SCPT/nightly-tetragrammaton-ci.ps1 -DryRun
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Dry run validation failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ Dry run validation passed" -ForegroundColor Green

      - name: Execute Tetragrammaton Benchmarks
        run: |
          Write-Host "🐾 Executing Tetragrammaton cross-language benchmarks..." -ForegroundColor Cyan
          
          pwsh -File BRAV/SCPT/nightly-tetragrammaton-ci.ps1 -SignozUrl $env:SIGNOZ_URL -BenchmarkPaths @($env:NODEJS_BENCHMARK_PATH, $env:PYTHON_BENCHMARK_PATH) -OutputRoot $env:OUTPUT_ROOT -ECRRReportDir $env:ECRR_REPORT_DIR -BossCatSnapshotDir $env:BOSSCAT_SNAPSHOT_DIR
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Tetragrammaton benchmarks failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ Tetragrammaton benchmarks completed successfully" -ForegroundColor Green

      - name: BossCat Compliance Check
        run: |
          Write-Host "🏛️ Performing BossCat compliance validation..." -ForegroundColor Cyan
          
          # Check ECRR report generation
          $ecrrReports = Get-ChildItem "$env:ECRR_REPORT_DIR" -Filter "*tetragrammaton*" -File
          if ($ecrrReports.Count -gt 0) {
            Write-Host "✅ ECRR reports generated: $($ecrrReports.Count) files" -ForegroundColor Green
          } else {
            Write-Host "❌ ECRR reports not found" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "🏛️ BossCat compliance validation PASSED" -ForegroundColor Green

      - name: Notify Success
        if: success()
        run: |
          Write-Host "🐾 Tetragrammaton Nightly Benchmarks - SUCCESS" -ForegroundColor Green
          Write-Host "📊 Cross-Language Capability: PROVEN" -ForegroundColor Yellow
          Write-Host "🏛️ BossCat Governance: COMPLIANT" -ForegroundColor Yellow
          Write-Host "✅ Ready for BossCat Production Approval" -ForegroundColor Green
      include_hehe_integration:
        description: "Include Tetragrammaton HE-HE dual integration"
        required: false
        default: "false"
        type: boolean
