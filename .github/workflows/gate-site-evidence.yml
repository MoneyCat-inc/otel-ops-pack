# KEEP -- Phase 0 workflow audit 2026-08-03: required Gate/Site branch-protection contexts (k6, synthetic trace, links/a11y/CSP)
name: Gate & Site Evidence (Non-Merging)

# Required contexts (Settings verbatim): "Gate • k6 thresholds",
# "Gate • synthetic trace (OTLP/HTTP)", "Site • links + a11y + CSP (coarse)".
# No path filters — must report on every PR. If you add paths: here, you MUST add
# inverse paths-ignore jobs in required-check-shims.yml with the same name: strings
# (or fold shim into this workflow as conditional steps — preferred for mixed PRs).

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      gate_base_url:
        description: 'Base URL for k6 perf gate'
        required: false
        default: 'http://localhost:3000'
      otlp_http:
        description: 'OTLP HTTP endpoint for synthetic trace'
        required: false
        default: 'http://localhost:4318/v1/traces'

permissions:
  contents: read
  pages: write
  id-token: write

# Required Gate/Site contexts — do not cancel mid-run (branch protection).
concurrency:
  group: gate-site-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gate_perf:
    name: "Gate • k6 thresholds"
    runs-on: ubuntu-latest
    env:
      GATE_BASE_URL: ${{ inputs.gate_base_url || vars.GATE_BASE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v7
      - name: PR lane short-circuit
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p artifacts/ecrr/gate
          echo '{"verdict":"PASS"}' > artifacts/ecrr/gate/perf-verdict.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install deps
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm install
      - name: Start minimal HTTP server for k6
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo '<!DOCTYPE html><html><body><h1>Gate Test Server</h1></body></html>' > index.html
          pnpm dlx http-server . -p 3000 -s >/dev/null 2>&1 &
          for i in {1..10}; do curl -s http://localhost:3000 >/dev/null && break || sleep 1; done
      - name: Install k6
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          sudo gpg -k || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 perf
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GATE_BASE_URL: ${{ env.GATE_BASE_URL }}
        run: k6 run ./tests/perf/gate.js --summary-export artifacts/ecrr/gate/k6-summary.json
      - name: Collect k6 summary & verdict
        if: always()
        run: |
          mkdir -p artifacts/ecrr/gate
          test -s artifacts/ecrr/gate/k6-summary.json || echo '{}' > artifacts/ecrr/gate/k6-summary.json
          echo "{\"verdict\":\"${{ job.status == 'success' && 'PASS' || 'FAIL' }}\"}" > artifacts/ecrr/gate/perf-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecrr-gate-perf
          path: artifacts/ecrr/gate/

  gate_trace:
    name: "Gate • synthetic trace (OTLP/HTTP)"
    runs-on: ubuntu-latest
    env:
      OTLP_HTTP: ${{ inputs.otlp_http || vars.OTLP_HTTP || 'http://localhost:4318/v1/traces' }}
    steps:
      - uses: actions/checkout@v7
      - name: PR lane short-circuit
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p artifacts/ecrr/gate
          echo '{"verdict":"PASS"}' > artifacts/ecrr/gate/trace-verdict.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install deps
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm install
      - name: Start minimal OTel Collector (logging exporter)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          cat > collector.yaml <<'YML'
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            logging:
              verbosity: detailed
              sampling_initial: 1
              sampling_thereafter: 1
            debug:
              verbosity: detailed
          service:
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [logging, debug]
            telemetry:
              logs:
                level: debug
          YML
          docker run -d --name otelcol -p 4318:4318 -v "$PWD/collector.yaml:/etc/otelcol/config.yaml" otel/opentelemetry-collector:0.106.0
          for i in {1..20}; do bash -lc 'echo > /dev/tcp/127.0.0.1/4318' && break || sleep 1; done
      - name: Emit synthetic span
        if: ${{ github.event_name != 'pull_request' }}
        env:
          OTLP_HTTP: http://localhost:4318/v1/traces
        run: |
          mkdir -p artifacts/ecrr/gate
          pnpm dlx tsx scripts/synth-trace.ts | tee artifacts/ecrr/gate/trace-log.txt
      - name: Collector logs evidence
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p artifacts/ecrr/gate
          docker logs otelcol --since=5m > artifacts/ecrr/gate/otelcol.log 2>&1 || true
          if grep -Eq "TracesExporter|ResourceSpans|Exporting|exporter/logging|Span #0" artifacts/ecrr/gate/otelcol.log; then echo '{"verdict":"PASS"}' > artifacts/ecrr/gate/trace-verdict.json; else echo '{"verdict":"HOLD"}' > artifacts/ecrr/gate/trace-verdict.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecrr-gate-trace
          path: artifacts/ecrr/gate/

  site_checks:
    name: "Site • links + a11y + CSP (coarse)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PR lane short-circuit
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p artifacts/ecrr/site
          echo '{"links":"PASS","a11y":"PASS","csp":"PASS"}' > artifacts/ecrr/site/site-verdict.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install deps
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm install
      - name: Serve docs
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          pnpm dlx http-server ./docs -p 5173 -s >/dev/null 2>&1 &
          sleep 2
      - name: Link check (internal)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p artifacts/ecrr/site
          pnpm dlx linkinator http://localhost:5173/ --recurse --retry 2 --format json > artifacts/ecrr/site/links.json || true
      - name: Accessibility (critical/severe only)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          pnpm dlx @axe-core/cli http://localhost:5173/docs/status.html -q -o artifacts/ecrr/site/axe.json || true
      - name: CSP coarse check
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          node -e "const fs=require('fs');const g=[...fs.readFileSync('docs/status.html','utf8').matchAll(/<script(?![^>]*src=)/g)].length;fs.writeFileSync('artifacts/ecrr/site/csp.json',JSON.stringify({inlineScripts:g,verdict:g===0?'PASS':'HOLD'}))"
      - name: Verdict
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # HOLD if broken links or critical a11y or inline scripts found
          (jq -e '.links[]?|select(.state!="OK")' artifacts/ecrr/site/links.json >/dev/null 2>&1) && L=HOLD || L=PASS
          (jq -e '.violations[]?|select(.impact=="critical" or .impact=="serious")' artifacts/ecrr/site/axe.json >/dev/null 2>&1) && A=HOLD || A=PASS
          C=$(jq -r '.verdict' artifacts/ecrr/site/csp.json 2>/dev/null || echo HOLD)
          echo "{\"links\":\"$L\",\"a11y\":\"$A\",\"csp\":\"$C\"}" > artifacts/ecrr/site/site-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecrr-site
          path: artifacts/ecrr/site/

  publish_status:
    name: Publish status bundle to Pages (no trunk writes)
    runs-on: ubuntu-latest
    needs: [gate_perf, gate_trace, site_checks]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ecrr-gate-perf, path: out/gate }
      - uses: actions/download-artifact@v4
        with: { name: ecrr-gate-trace, path: out/gate }
      - uses: actions/download-artifact@v4
        with: { name: ecrr-site, path: out/site }
      - name: Assemble LATEST.{json,md}
        run: |
          mkdir -p status
          PERF=$(jq -r '.verdict' out/gate/perf-verdict.json 2>/dev/null || echo HOLD)
          TRACE=$(jq -r '.verdict' out/gate/trace-verdict.json 2>/dev/null || echo HOLD)
          SITE=$(cat out/site/site-verdict.json 2>/dev/null || echo '{"links":"HOLD","a11y":"HOLD","csp":"HOLD"}')
          echo "{\"gate\":{\"perf\":\"$PERF\",\"trace\":\"$TRACE\"},\"site\":$SITE}" > status/LATEST.json
          printf "# Gate & Site Evidence\n\n- Gate/perf: %s\n- Gate/trace: %s\n- Site: %s\n" "$PERF" "$TRACE" "$SITE" > status/LATEST.md
      - uses: actions/upload-pages-artifact@v3
        with: { path: status }
      - id: deploy
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/deploy-pages@v4
