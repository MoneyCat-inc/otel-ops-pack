name: Archive & Analyze Workflow Runs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: run-archiver
  cancel-in-progress: true

jobs:
  archive:
    name: Analyze runs and rotate reports
    runs-on: ubuntu-latest
    env:
      MAX_ON_REPO: ${{ inputs.MAX_ON_REPO || '100' }}
      DRY_RUN: 'false'
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: BRAV/SCPT/run-archiver/package-lock.json

      - name: Install dependencies
        working-directory: BRAV/SCPT/run-archiver
        run: |
          npm ci

      - name: Configure optional AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run archiver
        working-directory: BRAV/SCPT/run-archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
          MAX_ON_REPO: ${{ env.MAX_ON_REPO }}
          DRY_RUN: ${{ env.DRY_RUN }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          node index.mjs

      # main is branch-protected; open a PR instead of pushing directly
      - name: Open run-reports PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            docs/BossCat
            CHAR/EVID
          commit-message: "docs(ecrr): run-archiver report update [skip ci]"
          title: "docs(ecrr): run-archiver report update [skip ci]"
          body: |
            Automated run-archiver update from Archive & Analyze Workflow Runs.

            Uses a pull request because `main` requires protected-branch checks.
            Run: ${{ github.run_number }}
          branch: bots/run-archiver-reports
          delete-branch: true
          labels: |
            automated
            docs
