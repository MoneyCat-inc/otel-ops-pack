# KEEP -- Phase 0 workflow audit 2026-08-03: run-report conveyor to otel-ops-evidence (4-hourly)
name: Archive & Analyze Workflow Runs

# Demand shaping 2026-09-01 (corrected same day): the nominal */30 cron never
# actually fired 48×/day — GitHub's scheduler throttled it to a measured 4-6
# scheduled runs/day with 5-11 h gaps (Actions API, last week of runs; interval
# crons in busy repos are the most-dropped). The first correction to hourly
# ('19 * * * *') would therefore have RAISED volume (pinned-minute crons fire
# reliably, up to 24/day). Every-4-hours matches the measured de facto rate
# (6/day) while making it predictable: fires 00:19/04:19/08:19/12:19/16:19/
# 20:19 UTC (= operator local time, GMT). otel-ops-evidence has no CI of its
# own (verified live: no .github/), so nothing downstream depends on cadence.
# Evidence in ECRR_CI_DEMAND_SHAPING_DEPENDABOT_ARCHIVER_20260901.md (see its
# correction addendum). dispatch unchanged for on-demand runs.
on:
  schedule:
    - cron: '19 */4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: run-archiver
  cancel-in-progress: true

jobs:
  archive:
    name: Analyze runs and publish to evidence repo
    runs-on: ubuntu-latest
    env:
      MAX_ON_REPO: ${{ inputs.MAX_ON_REPO || '100' }}
      DRY_RUN: 'false'
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EVIDENCE_REPO: MoneyCat-inc/otel-ops-evidence
    steps:
      - name: Require EVIDENCE_REPO_TOKEN
        id: token_check
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          if [ -z "${EVIDENCE_REPO_TOKEN:-}" ]; then
            echo "::notice::EVIDENCE_REPO_TOKEN not provisioned — skipping archiver run. Provision a fine-grained PAT (MoneyCat-inc/otel-ops-evidence, Contents R/W) and store as EVIDENCE_REPO_TOKEN."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ops pack (read — generates reports)
        if: steps.token_check.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Checkout evidence repo (write target)
        if: steps.token_check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.EVIDENCE_REPO }}
          token: ${{ secrets.EVIDENCE_REPO_TOKEN }}
          path: evidence-repo

      - name: Setup Node.js
        if: steps.token_check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: BRAV/SCPT/run-archiver/package-lock.json

      - name: Install dependencies
        if: steps.token_check.outputs.skip != 'true'
        working-directory: BRAV/SCPT/run-archiver
        run: npm ci

      - name: Configure optional AWS credentials
        if: steps.token_check.outputs.skip != 'true' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run archiver into evidence checkout
        if: steps.token_check.outputs.skip != 'true'
        working-directory: BRAV/SCPT/run-archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}/evidence-repo
          MAX_ON_REPO: ${{ env.MAX_ON_REPO }}
          DRY_RUN: ${{ env.DRY_RUN }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Skip BOSSCAT_LOG append in evidence repo (lives in ops pack)
          SKIP_BOSSCAT_LOG: 'true'
        run: node index.mjs

      - name: Push evidence repo (fail loud — no continue-on-error)
        if: steps.token_check.outputs.skip != 'true'
        working-directory: evidence-repo
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BossCat/run-reports CHAR/EVID || true
          if git diff --cached --quiet; then
            echo "No evidence changes to push."
            exit 0
          fi
          git commit -m "docs(ecrr): run-archiver update [skip ci]"
          git push
