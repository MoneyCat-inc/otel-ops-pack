# KEEP -- Phase 0 workflow audit 2026-08-03: run-report conveyor to otel-ops-evidence (30-min)
name: Archive & Analyze Workflow Runs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: run-archiver
  cancel-in-progress: true

jobs:
  archive:
    name: Analyze runs and publish to evidence repo
    runs-on: ubuntu-latest
    env:
      MAX_ON_REPO: ${{ inputs.MAX_ON_REPO || '100' }}
      DRY_RUN: 'false'
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EVIDENCE_REPO: MoneyCat-inc/otel-ops-evidence
    steps:
      - name: Require EVIDENCE_REPO_TOKEN
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EVIDENCE_REPO_TOKEN:-}" ]; then
            echo "::error::EVIDENCE_REPO_TOKEN secret is missing."
            echo "Provision a fine-grained PAT (MoneyCat-inc / otel-ops-evidence only / Contents R/W),"
            echo "store it as repo secret EVIDENCE_REPO_TOKEN, and log the 90-day rotation date in BOSSCAT_LOG."
            exit 1
          fi

      - name: Checkout ops pack (read — generates reports)
        uses: actions/checkout@v4

      - name: Checkout evidence repo (write target)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EVIDENCE_REPO }}
          token: ${{ secrets.EVIDENCE_REPO_TOKEN }}
          path: evidence-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: BRAV/SCPT/run-archiver/package-lock.json

      - name: Install dependencies
        working-directory: BRAV/SCPT/run-archiver
        run: npm ci

      - name: Configure optional AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run archiver into evidence checkout
        working-directory: BRAV/SCPT/run-archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}/evidence-repo
          MAX_ON_REPO: ${{ env.MAX_ON_REPO }}
          DRY_RUN: ${{ env.DRY_RUN }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Skip BOSSCAT_LOG append in evidence repo (lives in ops pack)
          SKIP_BOSSCAT_LOG: 'true'
        run: node index.mjs

      - name: Push evidence repo (fail loud — no continue-on-error)
        working-directory: evidence-repo
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BossCat/run-reports CHAR/EVID || true
          if git diff --cached --quiet; then
            echo "No evidence changes to push."
            exit 0
          fi
          git commit -m "docs(ecrr): run-archiver update [skip ci]"
          git push
