name: BossCat · Trivy Security Scan
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Monthly scan on 1st of month at 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: trivy-security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker-compose-signoz.yml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build, just report
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Scan SigNoz image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'signoz/signoz:v0.96.1'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Scan OTel Collector image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'signoz/signoz-otel-collector:v0.129.6'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Scan ClickHouse image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'clickhouse/clickhouse-server:25.5.6'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if ClickHouse has CRITICAL/HIGH (it's clean now)
      
      - name: Scan Zookeeper image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'signoz/zookeeper:3.9.3'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Generate scan summary
        if: always()
        run: |
          echo "## Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See Security tab for detailed findings." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline:** 31 vulnerabilities (4 CRITICAL, 27 HIGH) as of 2025-10-09" >> $GITHUB_STEP_SUMMARY
          echo "**Goal:** Reduce to <15 within 30 days" >> $GITHUB_STEP_SUMMARY

