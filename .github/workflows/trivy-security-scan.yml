# KEEP -- Phase 0 workflow audit 2026-08-03: only remaining Trivy scan (image pins need refresh post-SigNoz-upgrade)
name: BossCat · Trivy Security Scan
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Monthly scan on 1st of month at 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: trivy-security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker-compose.yml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build, just report
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Scan SigNoz image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'signoz/signoz:v0.135.1'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Scan OTel Collector image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'signoz/signoz-otel-collector:v0.144.6'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Scan ClickHouse image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'clickhouse/clickhouse-server:25.8'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report only; pin image separately when upstream patches land
      
      - name: Scan Zookeeper image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'signoz/zookeeper:3.9.3'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Generate scan summary
        if: always()
        run: |
          echo "## Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See Security tab for detailed findings." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image pins synced to docker-compose.yml:** signoz v0.135.1, otel-collector v0.144.6, clickhouse 25.8" >> $GITHUB_STEP_SUMMARY


