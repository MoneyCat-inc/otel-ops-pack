# BossCat • SigNoz Alerts - Production-Hardened CI/CD
# Authority: BossCat OEM (Executive Overseer Manager)
# Purpose: Apply 8 BossCat alerts and verify 6/6 completion using WYZWOZ_SIGNOZ secret
# Hardening: Least-privilege, concurrency guard, timeout, always-upload artifacts

name: BossCat • SigNoz Alerts

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: windows-latest runner cannot reach localhost:8080 SigNoz.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

# Least-privilege permissions
permissions:
  contents: read

# Concurrency guard: only one alert run at a time
concurrency:
  group: bosscat-signoz-automation  # Unified across all SigNoz workflows
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SIGNOZ_URL: http://localhost:8080
      SIGNOZ_API_KEY: ${{ secrets.WYZWOZ_SIGNOZ }}  # masked

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check SigNoz credentials
        id: signoz-config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNOZ_API_KEY)) {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "WYZWOZ_SIGNOZ not configured, skipping SigNoz alerts"
          } else {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # PowerShell 7 is already available on windows-latest runners
      # No setup step needed - using shell: pwsh directly

      - name: Preflight • SigNoz health
        id: health
        shell: pwsh
        if: steps.signoz-config.outputs.configured == 'true'
        run: |
          try {
            $resp = Invoke-WebRequest -Uri "$env:SIGNOZ_URL/api/v1/health" -UseBasicParsing -TimeoutSec 10
            if ($resp.StatusCode -eq 200) {
              "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }
          } catch { }
          "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - name: Apply BossCat Alerts to SigNoz
        shell: pwsh
        if: ${{ steps.health.outputs.ok == 'true' }}
        run: |
          pwsh -File BRAV/SCPT/bosscat-create-signoz-alerts.ps1 `
            -SigNozUrl $env:SIGNOZ_URL `
            -Apply `
            -ApiKey $env:SIGNOZ_API_KEY

      - name: Verify SigNoz Completion (6/6)
        shell: pwsh
        if: ${{ steps.health.outputs.ok == 'true' }}
        run: |
          pwsh -File BRAV/SCPT/bosscat-verify-signoz-completion.ps1 `
            -SigNozUrl $env:SIGNOZ_URL `
            -ApiKey $env:SIGNOZ_API_KEY

      - name: Upload verification report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signoz-completion-report
          path: docs/BossCat/signoz-completion-verification.json
          if-no-files-found: warn
          retention-days: 14

