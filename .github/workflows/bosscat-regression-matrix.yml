name: BossCat Regression Matrix

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      gpu_option_b:
        description: 'Require GPU_FIX Option B (<200ms P95)'
        required: false
        default: true
        type: boolean
      test_types:
        description: 'Test types to run (space-separated)'
        required: false
        default: 'baseline'
        type: string
  release:
    types: [prereleased]

jobs:
  regression:
    name: Regression (${{ matrix.gate }} @ ${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ci, local, prod]
        gate: [IONA, GATE_006, GATE_007]
    env:
      GATE: ${{ matrix.gate }}
      SITE: ${{ matrix.site }}
      SIGNOZ_API_KEY: ${{ secrets.SIGNOZ_API_KEY }}
    concurrency:
      group: bosscat-regression-${{ github.ref_name }}-${{ matrix.gate }}-${{ matrix.site }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node and pnpm
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - name: Enable corepack and install deps
      run: |
        corepack enable
        pnpm i --frozen-lockfile=false

    - name: Prepare directories
      run: |
        mkdir -p artifacts DELT/ARTF docs/BossCat/reports docs/ecrr/ECRR_REPORTS docs/observability/snapshots

    - name: Run IONA Gate Verification
      shell: pwsh
      run: |
        ./scripts/verify-iona-gate.ps1 -Strict:$true -OutputJson 'artifacts/gate-verification-results.json' -PrCommentPath 'PR_COMMENT_IONA_GATE_002_FINAL.md' -Gate "$env:GATE" -Site "$env:SITE"

    - name: GPU_FIX lane (Option B)
      shell: pwsh
      run: |
        $require = $true
        if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $require = [System.Convert]::ToBoolean('${{ inputs.gpu_option_b }}') }
        ./scripts/gpu-fix-lane.ps1 -OptionBRequired:$require
      continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_option_b == false }}

    - name: Upload Nexploit SARIF (if present)
      if: hashFiles('DELT/ARTF/nexploit-report.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: DELT/ARTF/nexploit-report.sarif

    - name: Nexploit Gate (fail on Critical/High)
      if: hashFiles('DELT/ARTF/nexploit-summary.json') != ''
      shell: pwsh
      run: |
        try {
          $j = Get-Content 'DELT/ARTF/nexploit-summary.json' -Raw | ConvertFrom-Json
          $crit = 0; $high = 0; $med = 0; $low = 0
          if ($j.severity) {
            if ($j.severity.critical) { $crit = [int]$j.severity.critical }
            if ($j.severity.high) { $high = [int]$j.severity.high }
            if ($j.severity.medium) { $med = [int]$j.severity.medium }
            if ($j.severity.low) { $low = [int]$j.severity.low }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Nexploit Summary'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Critical: $crit"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- High: $high"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Medium: $med"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Low: $low"
          if ($crit -gt 0 -or $high -gt 0) { throw "Nexploit gate failed: Critical/High findings present" }
        } catch {
          Write-Error $_
        }
    - name: Publish Perf Summary (GPU_FIX)
      if: always()
      shell: pwsh
      run: |
        $summaryFile = $env:GITHUB_STEP_SUMMARY
        $gateJson = 'artifacts/gate-verification-results.json'
        if (-not (Test-Path $gateJson) -and (Test-Path 'DELT/ARTF/gate-verification-results.json')) {
          Write-Warning 'BossCat regression matrix: falling back to DELT/ARTF gate results. Update exporters to artifacts/.'
          $gateJson = 'DELT/ARTF/gate-verification-results.json'
        }
        if (Test-Path $gateJson) {
          try {
            $j = Get-Content $gateJson -Raw | ConvertFrom-Json
            $gate = $env:GATE; $site = $env:SITE
            $p95 = $null
            if ($j.k6 -and $j.k6.p95) { $p95 = $j.k6.p95 } elseif ($j.k6 -and $j.k6.'p95') { $p95 = $j.k6.'p95' }
            $p5317 = $false; if ($j.otlp_ports -and $j.otlp_ports.'5317' -ne $null) { $p5317 = [bool]$j.otlp_ports.'5317' }
            $p5318 = $false; if ($j.otlp_ports -and $j.otlp_ports.'5318' -ne $null) { $p5318 = [bool]$j.otlp_ports.'5318' }
            $span = $false; if ($j.synthetic_span -and $j.synthetic_span.success -ne $null) { $span = [bool]$j.synthetic_span.success }
            $status = $j.status
            Add-Content -Path $summaryFile -Value "## GPU_FIX Summary"
            Add-Content -Path $summaryFile -Value "- Gate: $gate"
            Add-Content -Path $summaryFile -Value "- Site: $site"
            Add-Content -Path $summaryFile -Value "- Status: $status"
            Add-Content -Path $summaryFile -Value "- Ports: 5317=$p5317 5318=$p5318"
            Add-Content -Path $summaryFile -Value "- Synthetic Span (iona.boot): $span"
            if ($p95 -ne $null) { Add-Content -Path $summaryFile -Value "- P95 (ms): $p95" }
            Add-Content -Path $summaryFile -Value ""
            Add-Content -Path $summaryFile -Value "## IONA Gate Verdict"
            if (Test-Path 'PR_COMMENT_IONA_GATE_002_FINAL.md') {
              try {
                $comment = Get-Content 'PR_COMMENT_IONA_GATE_002_FINAL.md' -Raw
                $verdict = $null
                if ($comment -match 'Verdict:\s*(\w+)') { $verdict = $Matches[1] }
                if ($verdict) {
                  Add-Content -Path $summaryFile -Value "- Verdict: $verdict"
                  Add-Content -Path $summaryFile -Value "- Gate: $gate"
                  Add-Content -Path $summaryFile -Value "- Site: $site"
                } else {
                  Add-Content -Path $summaryFile -Value "⚠️ Verdict not found in PR comment"
                }
              } catch {
                Add-Content -Path $summaryFile -Value "⚠️ Error parsing PR comment: $($_.Exception.Message)"
              }
            } else {
              Add-Content -Path $summaryFile -Value "⚠️ PR comment file not generated"
            }
          } catch {
            Add-Content -Path $summaryFile -Value "⚠️ Unable to parse gate-verification-results.json: $($_.Exception.Message)"
          }
        } else {
          Add-Content -Path $summaryFile -Value "⚠️ Gate verification results not found"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bosscat-regression-${{ matrix.gate }}-${{ matrix.site }}-${{ github.run_number }}
        path: |
          DELT/ARTF/
          docs/BossCat/reports/
          PR_COMMENT_IONA_GATE_002_FINAL.md
        retention-days: 14
