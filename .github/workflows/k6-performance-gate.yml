name: k6 Performance Gate

# Gate #026 Track B: CI Performance Gate
# Authority: BossCat OEM | Executor: Cursor{Implementer}
# Purpose: Block merges on performance regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dotnet-test-app/**'
      - 'scripts/perf/**'
      - '.github/workflows/k6-performance-gate.yml'
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET test app
        run: dotnet build dotnet-test-app/dotnet-test-app.csproj -c Release

      - name: Start dotnet test app
        run: |
          nohup dotnet run --project dotnet-test-app/dotnet-test-app.csproj -c Release --no-build > /tmp/dotnet-app.log 2>&1 &
          echo $! > /tmp/dotnet-app.pid

      - name: Wait for service to be ready
        run: |
          echo "Waiting for dotnet-test-gate026 on port 5555..."
          timeout 60 bash -c 'until curl -sf http://localhost:5555/health >/dev/null; do sleep 1; done'
          curl -f http://localhost:5555/health

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Performance Gate
        id: k6
        env:
          BASE_URL: ${{ vars.BASE_URL || 'http://localhost:5555' }}
        run: k6 run scripts/perf/k6-performance-gate.js
        continue-on-error: true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: artifacts/k6-summary.json
          retention-days: 14

      - name: Check k6 exit code
        if: steps.k6.outcome == 'failure'
        run: |
          echo "❌ Performance gate FAILED - thresholds violated"
          echo "Check the k6 results artifact for details"
          exit 1

      - name: Performance gate passed
        if: steps.k6.outcome == 'success'
        run: |
          echo "✅ Performance gate PASSED - all thresholds met"

      - name: Stop dotnet app
        if: always()
        run: |
          if [ -f /tmp/dotnet-app.pid ]; then
            kill $(cat /tmp/dotnet-app.pid) || true
          fi

