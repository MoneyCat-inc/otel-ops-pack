name: ECRR Compliance Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/ECRR_REPORTS/**'
      - 'scripts/lint-ecrr-compliance.ps1'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/ECRR_REPORTS/**'
      - 'scripts/lint-ecrr-compliance.ps1'

concurrency:
  group: ecrr-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecrr-compliance:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PowerShell
      uses: PowerShell/setup-powershell@v2
      
    - name: Run ECRR Compliance Lint
      run: |
        pwsh -NoLogo -File BRAV/SCPT/lint-ecrr-compliance.ps1 -FailOnError -Verbose
        
    - name: Upload Compliance Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ecrr-compliance-report
        path: artifacts/ecrr-compliance-report.json
        retention-days: 30
