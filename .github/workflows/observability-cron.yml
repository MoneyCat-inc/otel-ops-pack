name: Observability Cron

on:
  schedule:
    # Run every 6 hours to catch regressions
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: obs-cron
  cancel-in-progress: true

jobs:
  observability-cron:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        version: '7.4'
        
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /var/lib/docker
        key: docker-layers-${{ hashFiles('docker-compose.yml', 'deploy/signoz/docker-compose.yml') }}
        restore-keys: |
          docker-layers-
      
    - name: Start SigNoz Stack
      run: |
        # Start ClickHouse first for cold-start stability
        docker compose -f docker-compose.yml up -d signoz-clickhouse
        docker compose -f deploy/signoz/docker-compose.yml -f deploy/signoz/docker-compose.override.yml up -d zookeeper-1
        
        # Wait for ClickHouse to be ready
        echo "Waiting for ClickHouse to be ready..."
        timeout 60 bash -c 'until docker exec signoz-clickhouse clickhouse-client -q "SELECT 1"; do sleep 2; done'
        
        # Start remaining services
        docker compose -f docker-compose.yml up -d
        docker compose -f deploy/signoz/docker-compose.yml up -d
        
        # Run schema migrations (cron runs get fresh migrations)
        echo "Running schema migrations..."
        docker compose -f deploy/signoz/docker-compose.yml -f deploy/signoz/docker-compose.override.yml run --rm signoz-schema-migrator
        
        # Restart query service to pick up schema changes
        docker compose -f deploy/signoz/docker-compose.yml restart signoz-query-service
        
        # Wait for services to stabilize
        echo "Waiting for services to stabilize..."
        timeout 30 bash -c 'until curl -f http://localhost:8080/api/v1/query?query=up; do sleep 2; done'
        
    - name: Install OpenTelemetry Collector
      run: |
        # Download and install otelcol-contrib for Linux
        $url = "https://github.com/open-telemetry/opentelemetry-collector-contrib/releases/latest/download/otelcol-contrib_linux_amd64.tar.gz"
        $output = "otelcol-contrib.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile $output
        tar -xzf $output -C /usr/local/bin/
        chmod +x /usr/local/bin/otelcol-contrib
        
        # Validate config
        /usr/local/bin/otelcol-contrib --config "config.yaml" --dry-run
        
    - name: Generate Test Data
      run: |
        # Create logs directory
        mkdir -p /tmp/logs/synthetic
        
        # Generate synthetic test data
        pwsh -File "scripts/dataset/generate-logs.ps1" -Rate 10 -Duration 20 -ErrorRate 0.15
        
        # Start collector in background
        /usr/local/bin/otelcol-contrib --config "config.yaml" &
        COLLECTOR_PID=$!
        
        # Wait for ingestion
        echo "Waiting for data ingestion..."
        sleep 15
        
    - name: Run Observability Verification
      id: verify
      run: |
        # Run the verification script with cron-specific settings
        $result = pwsh -File "scripts/ci-verify.ps1" -CronMode
        
        # Write result to file for artifact
        $result | Out-File -FilePath "verification-report.md" -Encoding UTF8
        
        # Extract PASS/FAIL status
        if ($result -match "Overall: ✅ PASS") {
          echo "status=PASS" >> $env:GITHUB_OUTPUT
        } else {
          echo "status=FAIL" >> $env:GITHUB_OUTPUT
        }
        
    - name: Generate Job Summary
      if: always()
      run: |
        echo "## 🔍 Observability Cron — Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Extract key metrics from verification report
        if [ -f "verification-report.md" ]; then
          echo "### Verification Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(Status:|Overall:)" verification-report.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Key Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- **Collector**: $(if [ "${{ steps.verify.outputs.status }}" = "PASS" ]; then echo "✅ healthz 200"; else echo "❌ failed"; fi)" >> $GITHUB_STEP_SUMMARY
        echo "- **SigNoz**: $(if [ "${{ steps.verify.outputs.status }}" = "PASS" ]; then echo "✅ schema ok"; else echo "❌ failed"; fi)" >> $GITHUB_STEP_SUMMARY
        echo "- **API**: $(if [ "${{ steps.verify.outputs.status }}" = "PASS" ]; then echo "✅ synthetic_id found"; else echo "❌ failed"; fi)" >> $GITHUB_STEP_SUMMARY
        
    - name: Upload Verification Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: observability-cron-report-${{ github.run_number }}
        path: verification-report.md
        retention-days: 7
        
    - name: Set Status Check
      if: steps.verify.outputs.status == 'FAIL'
      run: |
        echo "Observability cron verification failed. Check the verification report for details."
        exit 1
        
    - name: Cleanup
      if: always()
      run: |
        # Stop collector
        if [ ! -z "$COLLECTOR_PID" ]; then
          kill $COLLECTOR_PID 2>/dev/null || true
        fi
        
        # Stop services
        docker compose -f docker-compose.yml down
        docker compose -f deploy/signoz/docker-compose.yml down
