# Gate #026 Track B: CI Performance Gates
# Authority: BossCat OEM | Executor: Cursor{Implementer}
# Purpose: Block promotion on performance threshold breach

name: Performance Gate (k6)

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: duplicate k6 gate; gate-026-performance.yml is canonical.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch:

concurrency:
  group: perf-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET test app
        run: dotnet build dotnet-test-app/dotnet-test-app.csproj -c Release

      - name: Start .NET test app
        run: |
          nohup dotnet run --project dotnet-test-app/dotnet-test-app.csproj -c Release --no-build > /tmp/dotnet-test-app.log 2>&1 &
          echo $! > /tmp/dotnet-test-app.pid

      - name: Wait for test app health
        run: |
          echo "Waiting for dotnet-test-gate026 on port 5555..."
          timeout 60 bash -c 'until curl -sf http://localhost:5555/health >/dev/null; do sleep 1; done'
          curl -f http://localhost:5555/health

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.57.0'

      - name: Run k6 load test with thresholds
        id: k6
        run: k6 run scripts/perf/k6-performance-gate.js
        continue-on-error: true

      - name: Check thresholds
        run: |
          if [ "${{ steps.k6.outcome }}" == "failure" ]; then
            echo "::error::Performance gate FAILED - thresholds breached"
            exit 1
          fi
          echo "::notice::Performance gate PASSED"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gate-results
          path: artifacts/k6-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop .NET test app
        if: always()
        run: |
          if [ -f /tmp/dotnet-test-app.pid ]; then
            kill "$(cat /tmp/dotnet-test-app.pid)" || true
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo '### Performance Gate - Run Summary';
            echo '';
            echo "**Workflow:** ${{ github.workflow }}";
            echo "**Run:** #${{ github.run_number }}";
            echo "**Status:** ${{ job.status }}";
            echo "**k6 Outcome:** ${{ steps.k6.outcome }}";
            echo '';
            echo '[View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
          } >> "$GITHUB_STEP_SUMMARY"
