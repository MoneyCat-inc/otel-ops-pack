name: agent-status
on:
  schedule:
    - cron: 0 9 * * * # Daily at 9 AM
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"
      - name: Run Health Checks
        run: node .agent/tools/smoke.mjs
      - name: Generate Status Badge
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Observability Pipeline: Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Observability Pipeline: Issues Detected" >> $GITHUB_STEP_SUMMARY
          fi
