name: Required check shims

on:
  pull_request:
    branches: [main]
    paths:
      # Only self-trigger when this contract file changes (docs the pairing).
      - .github/workflows/required-check-shims.yml

permissions:
  contents: read

jobs:
  contract:
    name: shim-contract (no required contexts)
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no competing required-context jobs
        run: |
          echo "No Gate/Site/gitleaks/CodeQL shim jobs — required-context primaries remain unfiltered."
          echo "2026-07-24 re-audit: package-only Dependabot tips reported Gate•/Site• SUCCESS."
          echo "2026-09-01 re-audit: path filters added to four NON-required workflows only"
          echo "  (trivy / osv-scanner / bosscat-governance / bosscat-gate-verify);"
          echo "  required contexts re-verified live incl. new 'Repository Structure Compliance'."
          echo "See header for re-introduction rules if a filtered workflow becomes required."
