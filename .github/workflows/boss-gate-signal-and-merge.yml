name: Boss Gate Signal and Merge

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Target branch to merge to
        required: true
        default: main
        type: string
      source_branch:
        description: Source branch to merge from
        required: true
        default: develop
        type: string
      auto_merge:
        description: Enable auto-merge after checks pass
        required: false
        default: false
        type: boolean

concurrency:
  group: boss-gate-signal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal-gate:
    name: Signal Boss Gate
    runs-on: ubuntu-latest
    outputs:
      gate_status: ${{ steps.gate_check.outputs.status }}
      merge_approved: ${{ steps.gate_check.outputs.approved }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Boss Gate Check
        id: gate_check
        env:
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          set -euo pipefail

          echo "Inspecting merge readiness for ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"

          if ! git ls-remote --exit-code --heads origin "${SOURCE_BRANCH}" > /dev/null; then
            echo 'Source branch missing on origin.'
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Source branch located on origin."

          if ! git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" > /dev/null; then
            echo 'Target branch missing on origin.'
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Target branch located on origin."

          git fetch --no-tags --prune origin "${SOURCE_BRANCH}":"refs/remotes/origin/${SOURCE_BRANCH}" "${TARGET_BRANCH}":"refs/remotes/origin/${TARGET_BRANCH}" >/dev/null

          git checkout -B boss-gate-target "origin/${TARGET_BRANCH}" >/dev/null 2>&1

          if git merge --no-commit --no-ff "origin/${SOURCE_BRANCH}" >/dev/null 2>&1; then
            git merge --abort >/dev/null 2>&1 || true
            echo 'Merge simulation succeeded without conflicts.'
            echo "status=completed" >> "$GITHUB_OUTPUT"
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort >/dev/null 2>&1 || true
            echo 'Merge simulation found conflicts. Manual review required.'
            echo "status=completed" >> "$GITHUB_OUTPUT"
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Boss Gate summary
        run: |
          STATUS='${{ steps.gate_check.outputs.status }}'
          APPROVED='${{ steps.gate_check.outputs.approved }}'
          echo '## Boss Gate Merge Evaluation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: \\`${{ github.event.inputs.source_branch }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target branch: \\`${{ github.event.inputs.target_branch }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate status: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge approved: ${APPROVED}" >> "$GITHUB_STEP_SUMMARY"

  merge-execution:
    name: Execute Merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: signal-gate
    if: needs.signal-gate.outputs.gate_status == 'completed' && needs.signal-gate.outputs.merge_approved == 'true' && github.event.inputs.auto_merge == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge branches
        env:
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          set -euo pipefail

          git fetch origin "${SOURCE_BRANCH}" "${TARGET_BRANCH}" >/dev/null
          git checkout "${TARGET_BRANCH}"
          git merge "origin/${SOURCE_BRANCH}" --no-ff -m "Boss Gate: merge ${SOURCE_BRANCH} into ${TARGET_BRANCH}"
          git push origin "${TARGET_BRANCH}"

      - name: Create merge summary
        run: |
          echo '## Boss Gate Merge Summary' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: \\`${{ github.event.inputs.source_branch }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target branch: \\`${{ github.event.inputs.target_branch }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: merge completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp (UTC): $(date -u)" >> "$GITHUB_STEP_SUMMARY"
