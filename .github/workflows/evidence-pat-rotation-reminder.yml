# KEEP -- Phase 0 workflow audit 2026-08-03: armed amber for FG PAT expiries (Phase 3 hard deadline)
name: Evidence PAT Rotation Reminder

# Amber reminder 14 days before each fine-grained PAT expiry.
# After rotating a PAT, update its `expires` date in the matrix below
# (safe failure: stale date -> spurious amber).
#
# 2026-08-25: generalized to a matrix after BOSSCAT_TOKEN was found expired-in-place
# (secret set 2025-10-04, dead by 2026-08-25, discovered only when a workflow first
# tried to use it). Every long-lived PAT this repo depends on belongs in the matrix.
# The BOSSCAT_LOG auto-append step was dropped: main is protected so its direct push
# could never succeed; the issue is the alert, and the log line is part of the
# operator's rotation checklist in that issue.

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC
  workflow_dispatch:

concurrency:
  group: evidence-pat-rotation-reminder
  cancel-in-progress: true

permissions:
  issues: write

env:
  AMBER_DAYS: '14'

jobs:
  remind:
    name: amber check — ${{ matrix.secret }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - secret: EVIDENCE_REPO_TOKEN
            expires: '2026-10-22'
            scope: 'fine-grained PAT -> MoneyCat-inc/otel-ops-evidence, Contents R/W only'
            mint: 'MoneyCat-inc / otel-ops-evidence / Contents R/W / 90d'
            used_by: 'run-archiver.yml, evidence pushes to otel-ops-evidence'
          - secret: BOSSCAT_TOKEN
            expires: '2027-08-26'
            scope: 'fine-grained PAT bosscat-rollup-otel-ops-pack -> MoneyCat-inc/otel-ops-pack, Contents R/W + Pull requests R/W'
            mint: 'MoneyCat-inc / otel-ops-pack / Contents R/W + Pull requests R/W / <=1y'
            used_by: 'bosscat-monthly-evidence-rollup.yml (branch + auto-merge PR)'

    steps:
      - name: Evaluate window
        id: win
        shell: bash
        env:
          EXPIRES_ON: ${{ matrix.expires }}
        run: |
          set -euo pipefail
          expires="${EXPIRES_ON}"
          amber_days="${AMBER_DAYS}"
          today=$(date -u +%Y-%m-%d)
          expires_epoch=$(date -u -d "$expires" +%s)
          today_epoch=$(date -u -d "$today" +%s)
          days_left=$(( (expires_epoch - today_epoch) / 86400 ))
          echo "expires_on=$expires" >> "$GITHUB_OUTPUT"
          echo "days_left=$days_left" >> "$GITHUB_OUTPUT"
          if [ "$days_left" -le "$amber_days" ] && [ "$days_left" -ge -7 ]; then
            echo "amber=true" >> "$GITHUB_OUTPUT"
          else
            echo "amber=false" >> "$GITHUB_OUTPUT"
          fi
          echo "days_left=$days_left expires=$expires amber_days=$amber_days"

      - name: Open or update amber issue
        if: steps.win.outputs.amber == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const secret = '${{ matrix.secret }}';
            const expires = '${{ steps.win.outputs.expires_on }}';
            const daysLeft = '${{ steps.win.outputs.days_left }}';
            const title = `AMBER: ${secret} FG PAT expires ${expires}`;
            const body = [
              '## PAT rotation reminder',
              '',
              `**Expires:** \`${expires}\` (${daysLeft} days from run date)`,
              `**Secret:** \`${secret}\` on \`otel-ops-pack\``,
              '**Scope:** ${{ matrix.scope }}',
              '**Used by:** ${{ matrix.used_by }}',
              '',
              '### Actions',
              '1. Mint a new fine-grained PAT (${{ matrix.mint }}).',
              `2. Update repo secret \`${secret}\` (gh secret set ${secret} --repo MoneyCat-inc/otel-ops-pack).`,
              '3. Update the `expires` date for this secret in `.github/workflows/evidence-pat-rotation-reminder.yml`.',
              '4. Append a `[FG PAT ROTATE]` line to `docs/BossCat/BOSSCAT_LOG.md` (docs PR) and close this issue.',
              '',
              'Stale `expires` after rotate causes a **spurious** amber (annoying, safe) — preferred over silent miss.',
            ].join('\n');

            const labels = ['security', 'rotation'];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rotation',
              per_page: 50,
            });
            const existing = issues.find((i) => i.title.startsWith(`AMBER: ${secret}`));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Reminder re-fired (${daysLeft}d left). ${body}`,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Job summary
        if: always()
        run: |
          {
            echo '### PAT Rotation Reminder — ${{ matrix.secret }}'
            echo ''
            echo "**Expires:** \`${{ matrix.expires }}\`"
            echo "**Days left:** \`${{ steps.win.outputs.days_left }}\`"
            echo "**Amber:** \`${{ steps.win.outputs.amber }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
