name: BossCat Diagnostic Workflow

# Repo-side checks (file existence, Python syntax) FAIL the run when broken —
# per docs/PURPOSE.md, a check must be able to both pass and fail. Network/runner
# probes (pip/k6 dry-runs) stay informational because they diagnose the runner
# environment, not the repository. Paths updated 2026-08-29 for the tetragram
# reorg (tests/ -> ALFA/TEST/unit/, scripts/ -> BRAV/SCPT/); see
# CHAR/ECRR/ECRR_REPORTS/ECRR_BOSSCAT_AUDIT_DRIFT_20260829.md (P0-2).

on:
  workflow_dispatch:
    inputs:
      test_step:
        description: 'Which step to test (all, python, deps, k6, scripts)'
        required: false
        default: 'all'
        type: string

concurrency:
  group: bosscat-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Debug - List repository contents
      run: |
        echo "=== Repository Structure ==="
        ls -la
        echo "=== Scripts Directory ==="
        ls -la BRAV/SCPT/ | head -40
        echo "=== Test Directories ==="
        ls -la ALFA/TEST/unit/k6/ ALFA/TEST/unit/locust/
        echo "=== Requirements File ==="
        cat requirements.txt

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Debug - Python setup verification
      run: |
        echo "=== Python Version ==="
        python --version
        echo "=== Pip Version ==="
        pip --version
        echo "=== Python Path ==="
        which python

    - name: Debug - Test pip install (informational, runner env)
      run: |
        echo "=== Testing pip upgrade ==="
        python -m pip install --upgrade pip
        echo "=== Testing requirements.txt ==="
        pip install -r requirements.txt --dry-run || echo "requirements.txt has issues"
        echo "=== Testing individual packages ==="
        pip install locust --dry-run || echo "locust install would fail"
        pip install flake8 --dry-run || echo "flake8 install would fail"
        pip install black --dry-run || echo "black install would fail"

    - name: Debug - Test k6 installation (informational, runner env)
      run: |
        echo "=== Testing k6 GPG key ==="
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || echo "GPG key fetch failed"
        echo "=== Testing k6 repository ==="
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list || echo "Repository addition failed"
        echo "=== Testing apt update ==="
        sudo apt-get update || echo "apt update failed"
        echo "=== Testing k6 install ==="
        sudo apt-get install k6 --dry-run || echo "k6 install would fail"

    - name: Check script files exist (FAILS when missing)
      run: |
        set -e
        for f in \
          BRAV/SCPT/test-otlp-smoke.py \
          BRAV/SCPT/test-dry-run.py \
          BRAV/SCPT/run-local-pipeline.py \
          BRAV/SCPT/generate-ecrr-report.py \
          BRAV/SCPT/generate-boss-v2-report.py \
          BRAV/SCPT/send_synthetic_otel_simple.py; do
          test -f "$f" && echo "OK: $f" || { echo "MISSING: $f"; exit 1; }
        done

    - name: Check script syntax (FAILS on syntax errors)
      run: |
        set -e
        python -m py_compile BRAV/SCPT/test-otlp-smoke.py
        python -m py_compile BRAV/SCPT/test-dry-run.py
        python -m py_compile BRAV/SCPT/run-local-pipeline.py
        echo "All scripts compile"

    - name: Check k6 test files exist (FAILS when missing)
      run: |
        set -e
        for f in baseline-test.js load-test.js stress-test.js soak-test.js mock-friendly-test.js; do
          test -f "ALFA/TEST/unit/k6/$f" && echo "OK: $f" || { echo "MISSING: ALFA/TEST/unit/k6/$f"; exit 1; }
        done

    - name: Check locust test files exist (FAILS when missing)
      run: |
        set -e
        test -f ALFA/TEST/unit/locust/signoz_user_journey.py && echo "OK: signoz_user_journey.py" || { echo "MISSING: ALFA/TEST/unit/locust/signoz_user_journey.py"; exit 1; }

    - name: Debug - Final summary
      run: |
        echo "=== DIAGNOSTIC COMPLETE ==="
        echo "All repo-side checks passed; runner-env probes above are informational"
