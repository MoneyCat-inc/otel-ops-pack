name: sanity
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASCII & CRLF check (no binaries)
        shell: pwsh
        run: |
          $bin = @(git ls-files | %{
            $bytes = [System.IO.File]::ReadAllBytes($_)
            if ($bytes -contains 0) { $_ }
          })
          if ($bin.Count -gt 0) { 
            Write-Error "Binary files detected: $($bin -join ', ')"; exit 1 
          }
      - name: Smoke lint (static placeholder)
        shell: pwsh
        run: |
          Write-Host "Static check OK"