# KEEP -- Phase 0 workflow audit 2026-08-03: dependency SCA, distinct from CodeQL, low noise
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

# Demand shaping 2026-09-01: docs/markdown-only PRs cannot introduce
# dependency vulnerabilities — skip the PR scan for them. Workflow-file changes
# are NOT ignored, so filter changes themselves still get exercised.
# Not a required branch-protection context (verified live 2026-09-01; see
# required-check-shims.yml header) — no shim needed. push (main) / merge_group /
# schedule stay unfiltered: full coverage on main and in merge queues
# (merge_group does not support path filters anyway).
on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  merge_group:
  schedule:
    - cron: '28 9 * * 5'
  push:
    branches: [ "main" ]

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read
  # The v2 reusable workflows declare actions: read (SARIF upload via CodeQL needs it); a called
  # workflow may not exceed the caller's grant, so omitting it here is a startup_failure.
  actions: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      # v2.6.0 bump (2026-09-23): dropped `--skip-git`. osv-scanner v2 removed the flag
      # (google/osv-scanner#1584, v2.0.0) and skips the git root by default; the opt-in
      # is now `--include-git-root`. Every v2.x run before this bump exited 127 on the
      # unknown flag (e.g. run 35538200970 on main, 2026-09-20) and the reporter then
      # printed "No issues found" on a missing results file, so the check was green
      # without ever scanning. osv-scanner-action v2.6.0 fails closed on that case.
      scan-args: |-
        -r
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    # continue-on-error is not a permitted key on jobs that call reusable workflows
    # (only name/needs/if/uses/with/secrets/strategy/concurrency/permissions are).
    # Its presence here was the third of three Actions-validation failures in this file.
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      # Same as scan-scheduled: `--skip-git` removed with the v2.6.0 bump (see above).
      scan-args: |-
        -r
        ./
