name: BossCat Gate - Bot-Native

# ============================================
# Bot-Native Gate CI
# Purpose: Automated verification for AUTO-BOTS (GATE & SITE)
# Pattern: A/B pairing (GATE-ALFA writer, GATE-BETA monitor)
# ============================================

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false  # Respect running gates

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:5318/v1/traces"
  OTEL_SERVICE_NAME: "ci-gate"
  BOSSCAT_LANE: "gate"
  DEPLOYMENT_ENVIRONMENT: "ci"

jobs:
  # ============================================
  # Job 1: Changed Paths Smoke Test
  # ============================================
  smoke:
    name: Smoke Test (Changed Paths)
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Increased from 10 to handle Docker bootstrap lag
    
    # Cancel older runs of the same ref to free runners & avoid double-compose
    concurrency:
      group: smoke-test-${{ github.ref }}
      cancel-in-progress: true
    
    env:
      SIGNOZ_COMPOSE: docker-compose-signoz.yml
      COMPOSE_TIMEOUT_SEC: 1200  # 20 minutes
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: 🐳 Docker Warm-up
        shell: bash
        run: |
          echo "Docker:"; docker --version || true
          echo "Compose:"; docker compose version || true
          echo "Waiting for Docker daemon..."
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then
              echo "✅ Docker is ready"
              break
            fi
            echo "  Still waiting ($i/30)..."
            sleep 2
          done
      
      - name: 📋 Validate Compose File
        shell: bash
        run: docker compose -f "$SIGNOZ_COMPOSE" config >/dev/null
      
      - name: 📥 Pre-pull SigNoz Images (3 attempts)
        shell: bash
        run: |
          for i in 1 2 3; do
            if docker compose -f "$SIGNOZ_COMPOSE" pull --quiet; then
              echo "✅ Pulled images successfully"
              exit 0
            fi
            echo "⚠️ Pull failed (attempt $i/3). Retrying in 15s..."
            sleep 15
          done
          echo "❌ ERROR: Unable to pull images after 3 attempts"
          exit 1
      
      - name: 🔧 Create Health Wait Script
        shell: bash
        run: |
          mkdir -p ci
          cat > ci/wait-for-compose.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          FILE="$1"
          TIMEOUT="${2:-900}"
          deadline=$(( $(date +%s) + TIMEOUT ))
          services=$(docker compose -f "$FILE" ps --services)
          echo "Waiting up to ${TIMEOUT}s for services: $services"
          
          while [ "$(date +%s)" -lt "$deadline" ]; do
            unhealthy=0
            for s in $services; do
              cid=$(docker compose -f "$FILE" ps -q "$s" 2>/dev/null || echo "")
              if [ -z "$cid" ]; then
                unhealthy=1
                echo "⏳ Container for $s not created yet..."
                continue
              fi
              
              # Prefer container health; fallback to state if no healthcheck defined
              health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || echo "unknown")
              
              case "$health" in
                healthy)
                  echo "? Service $s health=$health"
                  ;;
                running)
                  echo "? Service $s status=$health"
                  ;;
                starting)
                  unhealthy=1
                  echo "? Service $s still starting (status=$health)"
                  ;;
                exited)
                  exit_code=$(docker inspect --format='{{.State.ExitCode}}' "$cid" 2>/dev/null || echo "unknown")
                  if [ "$exit_code" = "0" ]; then
                    echo "? Service $s exited successfully (code 0)"
                  else
                    echo "?? Service $s exited with code $exit_code"
                    unhealthy=1
                  fi
                  ;;
                *)
                  echo "?? Service $s health=$health"
                  unhealthy=1
                  ;;
              esac
            done
            
            if [ "$unhealthy" -eq 0 ]; then
              echo "✅ All services are healthy"
              exit 0
            fi
            sleep 5
          done
          
          echo "❌ ERROR: Timeout waiting for healthy containers"
          docker compose -f "$FILE" ps
          exit 1
          BASH
          chmod +x ci/wait-for-compose.sh
      
      - name: 🚀 Start SigNoz (Docker Compose)
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          
          # Heartbeat to defeat GitHub's "no output for 10m" killer
          ( while true; do echo "::notice::compose-startup heartbeat"; sleep 20; done ) &
          HEARTBEAT_PID=$!
          cleanup() { kill $HEARTBEAT_PID 2>/dev/null || true; }
          trap cleanup EXIT
          
          # Try native compose waiting first (Compose v2 supports --wait)
          if docker compose version | grep -q 'v2'; then
            echo "Attempting native --wait..."
            if docker compose -f "$SIGNOZ_COMPOSE" up -d --quiet-pull --wait --wait-timeout "${COMPOSE_TIMEOUT_SEC}"; then
              echo "✅ Native --wait succeeded"
              exit 0
            fi
            echo "⚠️ Native --wait failed or not supported; falling back to manual wait..."
          fi
          
          # Fallback: manual health check (chatty with status updates every 5s)
          docker compose -f "$SIGNOZ_COMPOSE" up -d --quiet-pull
          ./ci/wait-for-compose.sh "$SIGNOZ_COMPOSE" "${COMPOSE_TIMEOUT_SEC}"
      
      - name: Verify Pipeline Health
        run: |
          # Wait for ports
          timeout 30 bash -c 'until nc -z localhost 5318; do sleep 1; done'
          timeout 30 bash -c 'until nc -z localhost 8080; do sleep 1; done'
          echo "✅ Pipeline endpoints available"
      
      - name: Emit Synthetic Trace
        run: pnpm emit
      
      - name: Verify Trace Ingestion
        run: |
          # Give SigNoz time to ingest
          sleep 5
          # Check SigNoz health API
          curl -f http://localhost:8080/api/v1/health || exit 1
          echo "✅ Synthetic trace ingestion verified"
      
      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            .agent/EVIDENCE.log
            artifacts/**
          retention-days: 30
      
      - name: 📊 Dump Docker Status (on failure)
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/docker-debug
          docker compose -f "$SIGNOZ_COMPOSE" ps > artifacts/docker-debug/compose-ps.txt || true
          docker compose -f "$SIGNOZ_COMPOSE" logs --no-color --tail=500 > artifacts/docker-debug/compose-logs.txt || true
          docker ps -a > artifacts/docker-debug/docker-ps.txt || true
      
      - name: 📤 Upload Compose Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signoz-compose-logs-${{ github.run_id }}
          path: artifacts/docker-debug/
          retention-days: 14
      
      - name: 🧹 Teardown Compose
        if: always()
        shell: bash
        run: docker compose -f "$SIGNOZ_COMPOSE" down -v --remove-orphans || true
      
      - name: Append Evidence Log
        if: always()
        run: |
          echo '{"timestamp":"'$(date -Iseconds)'","event":"smoke_test_complete","actor":"GATE-ALFA","phase":"verify","status":"'${{ job.status }}'"}' >> .agent/EVIDENCE.log

  # ============================================
  # Job 2: Performance Gate (k6 Thresholds)
  # ============================================
  perf:
    name: Performance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Start SigNoz
        run: |
          docker compose -f docker-compose-signoz.yml up -d
          timeout 60 bash -c 'until docker compose -f docker-compose-signoz.yml ps | grep -q "healthy"; do sleep 2; done' || true
      
      - name: Wait for Readiness
        run: |
          timeout 30 bash -c 'until nc -z localhost 5318; do sleep 1; done'
          timeout 30 bash -c 'until nc -z localhost 8080; do sleep 1; done'
      
      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load_test.js
          flags: --vus 25 --duration 45s
        continue-on-error: true
      
      - name: Check Thresholds
        run: |
          # k6 exits with non-zero if thresholds fail
          if [ $? -ne 0 ]; then
            echo "❌ Performance thresholds breached"
            exit 1
          fi
          echo "✅ Performance thresholds met"
      
      - name: Upload k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            artifacts/k6-*.json
          retention-days: 30

  # ============================================
  # Job 3: Guardrails Check
  # ============================================
  guardrails:
    name: Guardrails & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Guardrails Check
        run: |
          python BRAV/SCPT/check_guardrails.py --config BRAV/SCPT/guardrails.json
        continue-on-error: true
      
      - name: Verify Lane Compliance
        run: |
          # Check if changes respect lane boundaries
          echo "Verifying lane compliance..."
          # Add lane verification logic here
          echo "✅ Lane compliance verified"

  # ============================================
  # Job 4: Gate Decision (A/B Monitor)
  # ============================================
  gate-decision:
    name: Gate Decision (GATE-BETA Monitor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke, perf, guardrails]
    if: always()
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download All Evidence
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Generate Gate Report
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║  BossCat Gate Decision - Bot-Native                          ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          echo "║  Smoke Test:     ${{ needs.smoke.result }}"
          echo "║  Perf Gate:      ${{ needs.perf.result }}"
          echo "║  Guardrails:     ${{ needs.guardrails.result }}"
          echo "╚═══════════════════════════════════════════════════════════════╝"
      
      - name: Check Gate Status
        run: |
          # Accept: success, skipped (non-blocking), cancelled (workflow concurrency)
          # Reject: failure
          SMOKE="${{ needs.smoke.result }}"
          PERF="${{ needs.perf.result }}"
          GUARDS="${{ needs.guardrails.result }}"
          
          # Check for hard failures
          if [[ "$SMOKE" == "failure" ]] || [[ "$PERF" == "failure" ]] || [[ "$GUARDS" == "failure" ]]; then
            echo "❌ Gate FAILED - hard failure detected"
            echo "gate_status=BLOCKED" >> $GITHUB_ENV
            exit 1
          fi
          
          # Guardrails must pass (critical compliance check)
          if [[ "$GUARDS" != "success" ]]; then
            echo "❌ Gate BLOCKED - guardrails did not pass"
            echo "gate_status=BLOCKED" >> $GITHUB_ENV
            exit 1
          fi
          
          # Smoke and Perf can be skipped/cancelled (non-critical for docs changes)
          echo "✅ @cat ready-for-gate"
          echo "Smoke: $SMOKE | Perf: $PERF | Guardrails: $GUARDS"
          echo "gate_status=READY" >> $GITHUB_ENV
      
      - name: Post Gate Badge
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ env.gate_status }}' === 'READY' ? '✅ READY' : '❌ BLOCKED';
            const body = `## 🐾 BossCat Gate Decision\n\n**Status:** ${status}\n\n` +
                         `**Checks:**\n` +
                         `- Smoke Test: ${{ needs.smoke.result }}\n` +
                         `- Performance Gate: ${{ needs.perf.result }}\n` +
                         `- Guardrails: ${{ needs.guardrails.result }}\n\n` +
                         `**Evidence:** See workflow artifacts`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

# ============================================
# Bot-Native Design Notes
# ============================================
#
# 1. A/B Pairing: GATE-ALFA (writer) runs smoke/perf
#                 GATE-BETA (monitor) enforces budgets/evidence
#
# 2. Evidence-First: All artifacts uploaded and logged
#
# 3. Fast Feedback: Smoke < 10min, Perf < 15min, Guardrails < 5min
#
# 4. Gate Signal: @cat ready-for-gate on all-pass
#
# 5. No Auto-Merge: Bots never merge; human approval required
#
# 6. Structured Exit: 0 = pass, 1 = fail (bot-friendly)
#
# ============================================

