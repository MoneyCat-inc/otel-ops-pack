# Main CI Workflow with SSOT Integration
# ECRR Compliance: Examine → Clean → Report → Role

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  OTEL_ENABLED: "1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"

jobs:
  # Job 1: Build and Test
  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        
    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        else
          echo "No package.json found, skipping npm install"
        fi
        
    - name: Run tests
      run: |
        echo "Running tests..."
        # Add your test commands here
        echo "Tests completed"
        
    - name: Generate telemetry summary
      run: |
        # Create artifacts directory
        mkdir -p artifacts .artifacts
        
        # Generate telemetry summary (simulate for demo)
        cat > artifacts/ssot-telemetry-summary.json << EOF
        {
          "jobsProcessed": 42,
          "jobsFailed": 0,
          "queueDepthMax": 2,
          "flakyActive": 5,
          "rehabilitated7d": 1,
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "source": "ci-build-test"
        }
        EOF
        
    - name: Build SSOT telemetry block
      run: |
        # Generate SSOT block and save to file
        node scripts/ci-ssot-telemetry.ts > .artifacts/SSOT.md
        
        # Verify SSOT block was created
        if [ -s .artifacts/SSOT.md ]; then
          echo "✅ SSOT block generated successfully"
        else
          echo "❌ SSOT block generation failed"
          exit 1
        fi
        
    - name: Publish SSOT to step summary
      run: |
        # Add SSOT block to GitHub step summary
        echo "## 📊 SSOT Telemetry Block" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cat .artifacts/SSOT.md >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Generated**: $(date -u +%Y-%m-%d %H:%M:%S UTC)" >> $GITHUB_STEP_SUMMARY
        
    - name: Upload SSOT artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ssot-telemetry-${{ github.run_number }}
        path: |
          .artifacts/SSOT.md
          artifacts/ssot-telemetry-summary.json
        retention-days: 30
        
    - name: Verify SSOT integration
      run: |
        # Check that SSOT block is in RUN_AND_VERIFY.md
        if grep -q "SSOT:BEGIN" RUN_AND_VERIFY.md; then
          echo "✅ SSOT block found in RUN_AND_VERIFY.md"
        else
          echo "❌ SSOT block missing from RUN_AND_VERIFY.md"
          exit 1
        fi
        
        # Check that .artifacts/SSOT.md exists
        if [ -s .artifacts/SSOT.md ]; then
          echo "✅ .artifacts/SSOT.md exists and is not empty"
        else
          echo "❌ .artifacts/SSOT.md missing or empty"
          exit 1
        fi
        
        # Display SSOT block for verification
        echo "📋 SSOT Block Content:"
        cat .artifacts/SSOT.md
