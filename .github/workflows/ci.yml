name: CI - quality gates
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
      - name: Lint & typecheck
        run: |
          python -m flake8 .
          python -m mypy . || true
      - name: Tests
        run: pytest -q || true
      - name: Upload coverage (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for package.json and install
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping Node.js steps"
            exit 0
          fi
      - name: Lint
        run: |
          if [ -f package.json ]; then
            npm run -s lint || true
          else
            echo "Skipping lint (no package.json)"
          fi
      - name: Typecheck
        run: |
          if [ -f package.json ]; then
            npm run -s typecheck || true
          else
            echo "Skipping typecheck (no package.json)"
          fi
      - name: Tests
        run: |
          if [ -f package.json ]; then
            npm test -- --coverage || true
          else
            echo "Skipping tests (no package.json)"
          fi

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell with PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error -EnableExit

  yamls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint workflow YAML
        run: yamllint -c .yamllint .github/workflows/ci.yml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1.7.7

  otel-config-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test collector image pulls
        run: docker pull ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.114.0
      - name: Show collector version (ensures binary is alive)
        run: docker run --rm ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.114.0 --version
      - name: Create minimal CI config
        run: |
          mkdir -p otel
          cat > otel/ci-config.yaml <<'EOF'
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch:
          exporters:
            debug:
              verbosity: detailed
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
          EOF
      - name: Start collector (CI config)
        run: |
          docker run -d --name otel \
            -v "$PWD/otel/ci-config.yaml:/etc/otel/config.yaml" \
            -p 4318:4318 \
            ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.114.0 \
            --config=/etc/otel/config.yaml
      - name: Send sample span
        run: |
          sleep 3
          cat <<'JSON' > span.json
          {"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ci-cat"}}]},"scopeSpans":[{"spans":[{"traceId":"0123456789abcdef0123456789abcdef","spanId":"0123456789abcdef","name":"ci-smoke","kind":1,"startTimeUnixNano":"1","endTimeUnixNano":"2"}]}]}]}
          JSON
          curl -sS -X POST http://localhost:4318/v1/traces \
            -H 'Content-Type: application/json' \
            --data @span.json
      - name: Collect collector logs
        if: always()
        run: |
          mkdir -p artifacts
          docker logs otel > artifacts/collector.log 2>&1 || true
          if [ ! -s artifacts/collector.log ]; then
            echo "collector logs unavailable" > artifacts/collector.log
          fi
          cat artifacts/collector.log
      - name: Upload collector logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-collector-logs
          path: artifacts/collector.log
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker rm -f otel || true

  reviewdog-eslint:
    if: always()
    needs: [node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for package.json and install
        id: npm-setup
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
            npm install
          else
            echo "No package.json found, skipping npm install"
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi
      - name: reviewdog / eslint
        if: steps.npm-setup.outputs.has_package_json == 'true'
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: "."
