name: Nightly Reference Map Refresh

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: daily reference-map refresh with no consumer.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm ci || npm i

      - name: Generate reference map
        run: |
          npx tsx scripts/generate-reference-map.ts

      - name: Upload reference map
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-map-${{ github.run_number }}
          path: docs/reference/reference-map.json
          retention-days: 14

