name: Nightly GPU Smoke

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-gpu-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PowerShell 7 is already available on windows-latest runners
      # No setup step needed - using shell: pwsh directly

      - name: Run GPU smoke test
        shell: pwsh
        run: |
          pwsh -File BRAV/SCPT/verify-gpu-codex.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpu_diag
          path: artifacts/gpu_diag/**
