name: Weekly Repository Cleanup

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: target script scripts/repo-cleanup.ps1 no longer exists.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: weekly-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for analysis
      
      - name: 🧹 Run Cleanup (Dry Run)
        run: |
          pwsh -File scripts/repo-cleanup.ps1 -DryRun -Verbose
      
      - name: 📊 Generate Cleanup Report
        if: always()
        run: |
          {
            echo '### 🧹 Weekly Cleanup Report';
            echo '';
            echo "**Date:** $(date -u +'%Y-%m-%d %H:%M UTC')";
            echo "**Workflow:** ${{ github.workflow }}";
            echo "**Run:** #${{ github.run_number }}";
            echo '';
            echo '#### Summary';
            echo 'Dry-run completed. Review output above for cleanup candidates.';
            echo '';
            echo '#### Next Steps';
            echo '- Review cleanup candidates';
            echo '- Run manual cleanup if needed: `.\scripts\repo-cleanup.ps1`';
            echo '- Archive old gate reports to docs/archive/gates/';
            echo '';
            echo '[View full output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: 📋 Upload Artifact Inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-report-${{ github.run_number }}
          path: |
            artifacts/**/*.json
            !artifacts/archive/**
          retention-days: 14

