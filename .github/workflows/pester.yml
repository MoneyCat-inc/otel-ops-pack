name: Pester
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
jobs:
  pester:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install PowerShell modules
        run: |
          Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester tests
        run: |
          $testResults = Invoke-Pester -Path tests/ -PassThru -OutputFormat NUnitXml -OutputFile artifacts/pester-results.xml
          if ($testResults.FailedCount -gt 0) {
            Write-Error "Pester tests failed: $($testResults.FailedCount) failed, $($testResults.PassedCount) passed"
            exit 1
          }
          Write-Host "Pester tests passed: $($testResults.PassedCount) tests"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-results
          path: artifacts/pester-results.xml
