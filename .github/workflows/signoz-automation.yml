name: SigNoz Automation
permissions:
  contents: read
  actions: write

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - tests/signoz.final.spec.ts
      - playwright.signoz.config.ts
      - BRAV/SCPT/automate-signoz-setup.ps1
      - docs/SIGNOZ_AUTOMATION_SETUP.md
      - .github/workflows/signoz-automation.yml

concurrency:
  group: signoz-automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signoz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Increased for schema migrator
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
      - name: Install pnpm
        run: npm install -g pnpm@9.12.0
      - run: npm install --legacy-peer-deps
      - run: npx playwright install --with-deps
      - name: Start SigNoz with improved health check
        timeout-minutes: 20  # Increased timeout for schema migrator
        run: |
          docker compose -f compose/docker-compose-signoz.yml up -d
          echo "Waiting for ClickHouse to be ready..."
          timeout 300 bash -c 'until docker exec signoz-clickhouse clickhouse-client --query "SELECT 1"; do echo "Waiting for ClickHouse..."; sleep 5; done'
          echo "ClickHouse is ready!"
          
          echo "Waiting for schema migrator to complete..."
          timeout 300 bash -c 'until docker ps --filter "name=signoz-schema-migrator-sync" --filter "status=exited" --format "table {{.Names}}\t{{.Status}}" | grep -q "Exited (0)"; do echo "Waiting for schema migrator..."; docker logs --tail 5 signoz-schema-migrator-sync 2>/dev/null || echo "Container not found yet"; sleep 10; done'
          echo "Schema migrator completed successfully!"
          
          echo "Waiting for SigNoz to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8080/api/v1/health; do echo "Waiting for SigNoz..."; sleep 5; done'
          echo "SigNoz is ready!"
          
          # Debug: Show container status
          echo "=== Container Status ==="
          docker ps -a --filter "name=signoz" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        env:
          SIGNOZ_URL: http://localhost:8080
      - run: npm run test:signoz
        env:
          SIGNOZ_URL: http://localhost:8080
          SIGNOZ_USER: ${{ secrets.SIGNOZ_USER }}
          SIGNOZ_PASS: ${{ secrets.SIGNOZ_PASS }}
      - name: Run automation suite
        shell: pwsh
        run: ./scripts/automate-signoz-setup.ps1 -SignozUrl $env:SIGNOZ_URL
        env:
          SIGNOZ_URL: http://localhost:8080
          SIGNOZ_USER: ${{ secrets.SIGNOZ_USER }}
          SIGNOZ_PASS: ${{ secrets.SIGNOZ_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Debug: Print container logs on failure
        if: failure()
        run: |
          echo "=== Schema Migrator Logs ==="
          docker logs signoz-schema-migrator-sync 2>/dev/null || echo "Schema migrator logs not available"
          echo "=== SigNoz Backend Logs ==="
          docker logs signoz 2>/dev/null || echo "SigNoz backend logs not available"
          echo "=== All Container Status ==="
          docker ps -a --filter "name=signoz"
      - name: Cleanup
        if: always()
        run: docker compose -f compose/docker-compose-signoz.yml down -v
