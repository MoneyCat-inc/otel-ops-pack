name: SigNoz Automation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - tests/signoz.final.spec.ts
      - playwright.signoz.config.ts
      - scripts/automate-signoz-setup.ps1
      - docs/SIGNOZ_AUTOMATION_SETUP.md
      - .github/workflows/signoz-automation.yml

jobs:
  signoz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: |
          docker compose -f docker-compose-signoz.yml up -d
          timeout 300 bash -c 'until curl -sf ${SIGNOZ_URL}/api/v1/health; do sleep 5; done'
        env:
          SIGNOZ_URL: http://localhost:8080
      - run: pnpm run test:signoz
        env:
          SIGNOZ_URL: http://localhost:8080
          SIGNOZ_USER: ${{ secrets.SIGNOZ_USER }}
          SIGNOZ_PASS: ${{ secrets.SIGNOZ_PASS }}
      - name: Run automation suite
        shell: pwsh
        run: ./scripts/automate-signoz-setup.ps1 -SignozUrl $env:SIGNOZ_URL
        env:
          SIGNOZ_URL: http://localhost:8080
          SIGNOZ_USER: ${{ secrets.SIGNOZ_USER }}
          SIGNOZ_PASS: ${{ secrets.SIGNOZ_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose-signoz.yml down -v
