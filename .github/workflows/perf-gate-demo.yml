name: Performance Gate - Investor Demo

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: demo k6 gate; superseded by gate-026-performance.yml.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration'
        required: false
        default: '1m'

# ALFA Pattern: Concurrency control
concurrency:
  group: perf-gate-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-gate:
    name: k6 Performance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.57.0'

      - name: Start demo services (mock)
        run: |
          mkdir -p artifacts/demo
          cat > /tmp/bosscat-demo-service.js <<'EOF'
          const http = require('http');
          const port = Number(process.env.PORT || 5556);
          const service = process.env.SERVICE_NAME || `bosscat-demo-${port}`;
          const server = http.createServer((req, res) => {
            res.setHeader('content-type', 'application/json');
            if (req.url === '/health') {
              res.end(JSON.stringify({ status: 'healthy', service }));
              return;
            }
            if (req.url === '/test') {
              res.end(JSON.stringify({ ok: true, service, traceparent: req.headers.traceparent || null }));
              return;
            }
            res.statusCode = 404;
            res.end(JSON.stringify({ error: 'not_found', service }));
          });
          server.listen(port, '127.0.0.1', () => console.log(`${service} listening on ${port}`));
          EOF
          unset RUNNER_TRACKING_ID
          PORT=5556 SERVICE_NAME=bosscat-svc2-api node /tmp/bosscat-demo-service.js &
          PORT=5557 SERVICE_NAME=bosscat-svc3-worker node /tmp/bosscat-demo-service.js &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5556/health >/dev/null && curl -sf http://127.0.0.1:5557/health >/dev/null; do sleep 1; done'
          echo "Demo services: Using localhost endpoints"
          echo "SVC2_URL=http://127.0.0.1:5556" >> $GITHUB_ENV
          echo "SVC3_URL=http://127.0.0.1:5557" >> $GITHUB_ENV

      - name: Run k6 performance test
        id: k6-test
        run: |
          k6 run scripts/perf/k6-investor-demo.js \
            --out json=artifacts/demo/k6-output.json \
            --summary-export=artifacts/demo/k6-summary.json \
            || echo "k6_exit_code=$?" >> $GITHUB_ENV
        continue-on-error: true

      - name: Parse k6 results
        id: parse-results
        run: |
          if [ -f artifacts/demo/k6-demo-results.json ]; then
            verdict=$(jq -r '.verdict' artifacts/demo/k6-demo-results.json)
            p95=$(jq -r '.metrics.p95_latency_ms' artifacts/demo/k6-demo-results.json)
            errors=$(jq -r '.metrics.error_rate' artifacts/demo/k6-demo-results.json)
            
            echo "verdict=$verdict" >> $GITHUB_OUTPUT
            echo "p95=$p95" >> $GITHUB_OUTPUT
            echo "error_rate=$errors" >> $GITHUB_OUTPUT
            
            # Set badge color
            if [ "$verdict" = "GREEN" ]; then
              echo "badge_color=success" >> $GITHUB_OUTPUT
            else
              echo "badge_color=critical" >> $GITHUB_OUTPUT
            fi
          else
            echo "verdict=UNKNOWN" >> $GITHUB_OUTPUT
            echo "badge_color=inactive" >> $GITHUB_OUTPUT
          fi

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-performance-results
          path: artifacts/demo/k6-*.json
          retention-days: 14  # BRAV Pattern

      - name: Generate performance badge
        if: always()
        run: |
          verdict="${{ steps.parse-results.outputs.verdict }}"
          p95="${{ steps.parse-results.outputs.p95 }}"
          
          echo "### Performance Gate: $verdict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**P95 Latency:** ${p95}ms (threshold: <300ms)" >> $GITHUB_STEP_SUMMARY
          echo "**Error Rate:** ${{ steps.parse-results.outputs.error_rate }}% (threshold: <1%)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$verdict" = "GREEN" ]; then
            echo "✅ **PASS** - All thresholds met" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAIL** - Thresholds breached" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Job Summary (CHAR Pattern)
        if: always()
        run: |
          {
            echo '### ${{ github.workflow }} - Run Summary';
            echo '';
            echo "**Workflow:** ${{ github.workflow }}";
            echo "**Run:** #${{ github.run_number }} (attempt ${{ github.run_attempt }})";
            echo "**Ref:** \`${{ github.ref }}\`";
            echo "**Actor:** @${{ github.actor }}";
            echo "**Status:** ${{ job.status }}";
            echo "**Verdict:** ${{ steps.parse-results.outputs.verdict }}";
            echo '';
            echo '[View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on threshold breach
        if: steps.parse-results.outputs.verdict != 'GREEN'
        run: |
          echo "❌ Performance gate FAILED - thresholds breached"
          echo "   Review k6 results artifact for details"
          exit 1

