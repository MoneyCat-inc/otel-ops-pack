name: Guardrails Re-Certification

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare evidence directories
        run: |
          mkdir -p docs/observability/snapshots
          mkdir -p DELT/ARTF

      - name: Run guardrails check (Python)
        id: guardrails
        run: |
          echo "Running BRAV/SCPT/check_guardrails.py ..."
          # Continue on error to allow evidence + issue creation
          python BRAV/SCPT/check_guardrails.py --config BRAV/SCPT/guardrails.json || true

      - name: Compute hashes and write evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT="$(git rev-parse --short HEAD)"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          LOCKED_FILE="BRAV/SCPT/GUARDRAILS_LOCKED.md"
          if [[ -f "$LOCKED_FILE" ]]; then
            LOCKED_HASH="$(grep -Eo '[A-Fa-f0-9]{64}' "$LOCKED_FILE" | head -n1 || true)"
          else
            LOCKED_HASH=""
          fi
          CURRENT_HASH="$(sha256sum BRAV/SCPT/guardrails.json | awk '{print $1}')"
          SNAP="docs/observability/snapshots/guardrails-recert-${TS}.json"

          export TS COMMIT BRANCH LOCKED_HASH CURRENT_HASH SNAP
          python - <<'PY'
import os, json, pathlib
ts=os.environ['TS']; commit=os.environ['COMMIT']; branch=os.environ['BRANCH']
locked=os.environ.get('LOCKED_HASH',''); current=os.environ['CURRENT_HASH']
snap=os.environ['SNAP']
match=(bool(locked) and locked.lower()==current.lower())
data={
  "timestamp": ts,
  "commit": commit,
  "branch": branch,
  "guardrails": {"locked": locked, "current": current, "match": match}
}
pathlib.Path(snap).parent.mkdir(parents=True, exist_ok=True)
with open(snap,'w',encoding='utf-8') as f:
    json.dump(data,f,indent=2)
print(f"Wrote {snap}")
PY

          echo "SNAPSHOT=$SNAP" >> "$GITHUB_ENV"
          echo "LOCKED_HASH=$LOCKED_HASH" >> "$GITHUB_ENV"
          echo "CURRENT_HASH=$CURRENT_HASH" >> "$GITHUB_ENV"
          if [[ -n "$LOCKED_HASH" && "$LOCKED_HASH" == "$CURRENT_HASH" ]]; then echo "DRIFT=false" >> "$GITHUB_ENV"; else echo "DRIFT=true" >> "$GITHUB_ENV"; fi

      - name: Upload evidence snapshot
        uses: actions/upload-artifact@v4
        with:
          name: guardrails-recert-${{ github.run_number }}
          path: |
            docs/observability/snapshots/
            BRAV/SCPT/guardrails.json
            BRAV/SCPT/GUARDRAILS_LOCKED.md

      - name: Create drift issue (if mismatch)
        if: env.DRIFT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Guardrails drift detected';
            const body = [
              'Guardrails hash mismatch detected during weekly re-certification.',
              '',
              `Locked: ${process.env.LOCKED_HASH || '(unknown)'}`,
              `Current: ${process.env.CURRENT_HASH || '(unknown)'}`,
              `Snapshot: ${process.env.SNAPSHOT || '(missing)'}`,
              '',
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            // Try to find an open issue with same title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'guardrails,compliance'
            });
            let found = issues.find(i => i.title === title);
            if (!found) {
              const res = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['guardrails','compliance']
              });
              core.info(`Created issue #${res.data.number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body
              });
              core.info(`Updated issue #${found.number}`);
            }
      
      - name: Send Slack notification (optional)
        if: env.DRIFT == 'true' && vars.SLACK_WEBHOOK_URL != ''
        shell: bash
        run: |
          WEBHOOK_URL="${{ vars.SLACK_WEBHOOK_URL }}"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{
                \"text\": \"🚨 Guardrails Drift Detected\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Guardrails drift detected in weekly re-cert*\n\n• Locked: \`${LOCKED_HASH}\`\n• Current: \`${CURRENT_HASH}\`\n• Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>\"
                  }
                }]
              }" || echo "::warning::Slack notification failed (non-blocking)"
          fi

