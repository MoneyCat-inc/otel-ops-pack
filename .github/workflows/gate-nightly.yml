# KEEP -- Phase 0 workflow audit 2026-08-03: nightly live-stack verification on self-hosted otel-windows runner
name: Gate Nightly Verification

on:
  schedule:
    - cron: "3 2 * * *"   # 02:03 UTC nightly
  workflow_dispatch: {}

concurrency:
  group: gate-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: [self-hosted, windows, otel]
    # Self-hosted otel-windows runner — live SigNoz + otelcol-contrib stack on this machine.

    env:
      SIGNOZ_API_KEY: ${{ secrets.SIGNOZ_API_KEY }}
      SIGNOZ_BASE_URL: http://localhost:8080
      OTEL_COLLECTOR_HEALTH_URL: http://127.0.0.1:13134/healthz

    steps:
      - uses: actions/checkout@v7

      - name: Check live stack reachability
        id: stack
        shell: pwsh
        run: |
          $signozUrl = $env:SIGNOZ_BASE_URL.TrimEnd('/')
          $healthUrl = $env:OTEL_COLLECTOR_HEALTH_URL
          $signozOk = $false
          $collectorOk = $false

          try {
            $response = Invoke-WebRequest -Uri "$signozUrl/api/v1/health" -TimeoutSec 5 -UseBasicParsing
            $signozOk = ($response.StatusCode -eq 200)
          } catch {
            Write-Host "::notice::SigNoz unreachable at $signozUrl — $($_.Exception.Message)"
          }

          try {
            $response = Invoke-WebRequest -Uri $healthUrl -TimeoutSec 5 -UseBasicParsing
            $collectorOk = ($response.StatusCode -eq 200)
          } catch {
            Write-Host "::notice::Collector health unreachable at $healthUrl — $($_.Exception.Message)"
          }

          try {
            $service = Get-Service otelcol-contrib -ErrorAction Stop
            if ($service.Status -ne 'Running') {
              $collectorOk = $false
              Write-Host "::notice::otelcol-contrib service status: $($service.Status)"
            }
          } catch {
            $collectorOk = $false
            Write-Host "::notice::otelcol-contrib service not found on this runner"
          }

          $stackAvailable = $signozOk -and $collectorOk
          Write-Host "signoz_ok=$signozOk collector_ok=$collectorOk stack_available=$stackAvailable"

          "signoz_ok=$($signozOk.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "collector_ok=$($collectorOk.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stack_available=$($stackAvailable.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if (-not $stackAvailable) {
            Write-Host "::notice::Live observability stack not reachable — skipping gate verification (expected on GitHub-hosted runners)."
          }

      - name: Setup Python
        if: steps.stack.outputs.stack_available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.stack.outputs.stack_available == 'true'
        run: |
          pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Run pipeline verification
        id: verify
        if: steps.stack.outputs.stack_available == 'true'
        shell: pwsh
        run: |
          $canaryScript = Join-Path $PWD 'synthetic/send_synthetic_otel_simple.py'
          pwsh -File BRAV/SCPT/verify-pipeline.ps1 -CanaryScriptPath $canaryScript
          $code = $LASTEXITCODE
          echo "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0
        continue-on-error: true

      - name: Write skip summary
        if: steps.stack.outputs.stack_available != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $summary = [ordered]@{
            outcome = 'SKIP'
            exit_code = 0
            reason = 'live_stack_unreachable'
            timestamp_utc = (Get-Date).ToUniversalTime().ToString('o')
            service_name = 'synthetic-windows-check'
            runner = $env:RUNNER_NAME
            signoz_ok = ('${{ steps.stack.outputs.signoz_ok }}' -eq 'true')
            collector_ok = ('${{ steps.stack.outputs.collector_ok }}' -eq 'true')
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content out/gate_verification.json -Encoding UTF8
          Write-Host "::notice::Gate nightly verification skipped — no live SigNoz + collector on runner."

      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate_verification_${{ github.run_number }}
          path: out/gate_verification.json
          retention-days: 30
          if-no-files-found: warn

      - name: Check verification result
        if: steps.stack.outputs.stack_available == 'true'
        shell: pwsh
        run: |
          $result = Get-Content out/gate_verification.json | ConvertFrom-Json
          $canary = $result.steps.canary_send
          Write-Host "Verification outcome: $($result.outcome)"
          Write-Host "api_reason=$($canary.api_reason) api_fallback_from=$($canary.api_fallback_from)"

          if ($result.outcome -eq "FAIL") {
            Write-Host "::error::Gate verification FAILED - rollback criteria met"
            exit 1
          }

          # A rescued run is not a passing run.
          # The ClickHouse fallback can confirm a span while the primary API path is broken, which
          # reports outcome OK with exit 0. That is how eleven nightly WARNs went unread: the board
          # stayed green over a broken verification path. Judge the path, not just the rescue.
          #
          #   fallback_from = no_span_found  -> ingestion lag, the span was simply late. Benign.
          #   fallback_from = http_error     -> the API path is broken (e.g. unauthenticated).
          #   fallback_from = missing_api_key-> no credential reached the script at all.
          #
          # Both of the latter are real faults that a rescue would otherwise hide.
          $brokenPath = @('http_error', 'missing_api_key')
          if ($canary.api_fallback_from -and ($brokenPath -contains $canary.api_fallback_from)) {
            Write-Host "::error::Primary verification path is broken ($($canary.api_fallback_from)); ClickHouse rescued the span but the API check must work on its own"
            if ($canary.api_error) {
              Write-Host "::error::api_error: $($canary.api_error | ConvertTo-Json -Compress -Depth 6)"
            }
            exit 1
          }

          # Not rescued, and the API check itself reported a broken path.
          if ($brokenPath -contains $canary.api_reason) {
            Write-Host "::error::API verification failed ($($canary.api_reason))"
            exit 1
          }

          if ($result.outcome -eq "WARN") {
            Write-Host "::warning::Gate verification returned warnings (api_reason=$($canary.api_reason))"
          } else {
            Write-Host "::notice::Gate verification passed"
          }

      - name: Create issue on WARN/FAIL
        if: steps.stack.outputs.stack_available == 'true' && steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let j = {};
            try {
              j = JSON.parse(fs.readFileSync('out/gate_verification.json','utf8'));
            } catch(e) {
              j = { outcome: 'UNKNOWN', service_name: 'unknown', timestamp_utc: new Date().toISOString() };
            }

            const title = `🚨 Gate verification ${j.outcome || 'UNKNOWN'}: ${j.service_name || 'service'} @ ${j.timestamp_utc || new Date().toISOString()}`;
            const body = [
              `## Gate Verification ${j.outcome || 'UNKNOWN'}`,
              '',
              `**Outcome:** ${j.outcome}`,
              `**Exit Code:** ${j.exit_code}`,
              `**Run ID:** ${context.runId}`,
              `**Workflow:** ${context.workflow}`,
              '',
              '### Verification Details',
              '',
              '```json',
              JSON.stringify(j, null, 2),
              '```',
              '',
              '### Actions Required',
              '',
              '1. Review verification JSON above',
              '2. Check failed gate checks',
              '3. Run local diagnostic: `pwsh -File BRAV\\SCPT\\verify-pipeline.ps1`',
              '4. If critical, flip gate: `pwsh -File BRAV\\SCPT\\set-gate-status.ps1 -Status HOLD -Reason "Nightly verification failed"`',
              '',
              '### Quick Links',
              '',
              `- [Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              '- [Gate Status](../docs/ecrr/GATE_STATUS.md)',
              '- [IONA Errors](../docs/IONA_ERRORS.md)',
              '- [SigNoz UI](http://localhost:8080)',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['gate', 'verification', 'fail', 'automated']
            });

      - name: Run Summary
        if: always()
        shell: pwsh
        run: |
          {
            echo "### Gate Nightly Verification";
            echo "";
            echo "- stack_available: ${{ steps.stack.outputs.stack_available }}";
            echo "- signoz_ok: ${{ steps.stack.outputs.signoz_ok }}";
            echo "- collector_ok: ${{ steps.stack.outputs.collector_ok }}";
            if ("${{ steps.stack.outputs.stack_available }}" -ne "true") {
              echo "- result: **SKIP** (live stack not on runner)";
              echo "";
              echo "Register a self-hosted Windows runner (Option B) to enable full nightly gate verification.";
            } elseif (Test-Path out/gate_verification.json) {
              $result = Get-Content out/gate_verification.json | ConvertFrom-Json;
              echo "- outcome: $($result.outcome)";
              echo "- exit_code: $($result.exit_code)";
            }
          } >> $env:GITHUB_STEP_SUMMARY
