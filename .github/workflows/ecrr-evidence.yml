name: ECRR-01 Evidence Gate

on:
  pull_request:
    branches: [ "**" ]

jobs:
  verify-ecrr-evidence:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      ECRR_BASE_URL: ${{ vars.ECRR_BASE_URL }}
      ECRR_ENFORCE_HEADERS: ${{ vars.ECRR_ENFORCE_HEADERS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable | Format-List *

      - name: Collect ECRR-01 evidence
        run: |
          $baseUrl = if ($env:ECRR_BASE_URL) { $env:ECRR_BASE_URL } else { 'http://localhost:3003' }
          Write-Host "Using BaseUrl=$baseUrl"
          pwsh -NoLogo -File scripts/ecrr/collect-evidence.ps1 -BaseUrl $baseUrl

      - name: Verify artifacts exist
        run: |
          $files = @(
            'artifacts/ecrr-01-verification.log',
            'artifacts/ecrr-01-playwright-isolation.json',
            'artifacts/ecrr-01-playwright-offline.json',
            'ECRR-01-SMOKE-TEST-RESULTS.md',
            'docs/ECRR_REPORTS/2025-09-22-terminal-session-ecrr-01.md'
          )
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing: $($missing -join ', ')" }
          Write-Host "All evidence files present."

      - name: Verify Playwright stats are clean
        run: |
          $iso = (Get-Content 'artifacts/ecrr-01-playwright-isolation.json' -Raw | ConvertFrom-Json).stats.unexpected
          $off = (Get-Content 'artifacts/ecrr-01-playwright-offline.json' -Raw | ConvertFrom-Json).stats.unexpected
          Write-Host "Unexpected: iso=$iso off=$off"
          if ($iso -ne 0 -or $off -ne 0) { throw "Unexpected tests present: iso=$iso off=$off" }

      - name: Optional header probe enforcement
        if: ${{ env.ECRR_ENFORCE_HEADERS == 'true' || env.ECRR_BASE_URL != '' }}
        run: |
          $baseUrl = if ($env:ECRR_BASE_URL) { $env:ECRR_BASE_URL } else { 'http://localhost:3003' }
          $probe = & 'scripts/ecrr/verify-headers.ps1' -Url $baseUrl -AsObject
          Write-Host "Header probe status: $($probe.StatusCode)"
          Write-Host "COOP: $($probe.CrossOriginOpenerPolicy) | COEP: $($probe.CrossOriginEmbedderPolicy)"
          if ($probe.StatusCode -ne 200) { throw "Header probe failed with status $($probe.StatusCode)" }


