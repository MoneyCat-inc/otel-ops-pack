name: SBOM Stability Tracker

# Automatically updates Issue #135 after prod gate runs

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: Issue #135 stability-tracking loop is complete.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: sbom-tracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  track-sbom:
    name: Track SBOM Stability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    # Only run if:
    # 1. Successful workflow_run on main, OR
    # 2. Manual workflow_dispatch, OR
    # 3. Scheduled run
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) installed"
      
      - name: Run SBOM Stability Tracker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run the tracking script
          ./scripts/track-sbom-stability.ps1 -IssueNumber 135 -RequiredRuns 3
      
      - name: Generate Summary
        if: always()
        run: |
          {
            echo '### SBOM Stability Tracker';
            echo '';
            echo "**Workflow:** ${{ github.workflow }}";
            echo "**Trigger:** ${{ github.event_name }}";
            echo "**Run:** #${{ github.run_number }}";
            echo '';
            echo 'Updated Issue #135 with latest SBOM evidence.';
            echo '';
            echo '[View Issue #135](https://github.com/${{ github.repository }}/issues/135)';
          } >> "$GITHUB_STEP_SUMMARY"

# ============================================
# Design Notes
# ============================================
#
# 1. Triggers automatically after prod gate runs on main
# 2. Can be manually triggered via workflow_dispatch
# 3. Daily scheduled backup to catch any missed runs
# 4. Updates Issue #135 with pass/fail evidence
# 5. Stops updating after 3 successful runs collected
# 6. Low overhead: ~30 seconds per run
# 7. Permissions: read-only contents, write issues
#
# ============================================

