name: BossCat · Tetragram Guard
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tetragram-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Skip on PRs; validate on main and manual
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate 4-4-4-4 + A/B
        run: pnpm agent:validate-names
      - name: Gate signal (comment template)
        run: |
          echo "CI is green and all checks are satisfied."
          echo "**@cat ready-for-gate** 🚪✅"
