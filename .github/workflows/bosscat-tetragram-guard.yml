name: BossCat · Tetragram Guard
# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: 4-4-4-4 name validation; low value post-Pack 3B split.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: tetragram-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    # Skip on PRs; validate on main and manual
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate 4-4-4-4 + A/B
        run: pnpm agent:validate-names
      - name: Gate signal (comment template)
        run: |
          echo "CI is green and all checks are satisfied."
          echo "**@cat ready-for-gate** 🚪✅"
