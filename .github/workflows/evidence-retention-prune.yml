# KEEP -- Phase 0 workflow audit 2026-08-03: quarterly evidence-repo prune (standing cadence, Roadmap 2026 H2)
name: Evidence Retention Prune

# Quarterly prune of raw run reports in otel-ops-evidence (90-day retain).
# Age from filename/path stamp or git log — never filesystem mtime.
# Policy: docs/BossCat/BRIEFING_EVIDENCE_RETENTION.md
# 2026-11-03: the push rebases onto run-archiver.yml's pushes and retries (both
# push to otel-ops-evidence main from separate concurrency groups; one shared
# group would let a queued archiver, cancel-in-progress: true, cancel a running
# prune). A run that exits 0 without a manifest fails, and the summary shows
# the dating pass and the pushed evidence commit (audit P1-1 follow-up, #893).

on:
  schedule:
    # 06:00 UTC on the 1st of Jan/Apr/Jul/Oct
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no delete/push)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      retain_days:
        description: 'Retain raw reports newer than N days'
        required: false
        default: '90'
        type: string

concurrency:
  group: evidence-retention-prune
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Prune evidence run-reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_REPO: MoneyCat-inc/otel-ops-evidence
      RETAIN_DAYS: ${{ github.event.inputs.retain_days || '90' }}
      # Dispatch defaults dry_run=true (prove derivation first). Schedule runs live prune.
      DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false' || 'true') }}

    steps:
      - name: Require EVIDENCE_REPO_TOKEN
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EVIDENCE_REPO_TOKEN:-}" ]; then
            echo "::error::EVIDENCE_REPO_TOKEN secret is missing."
            echo "Provision a fine-grained PAT (MoneyCat-inc / otel-ops-evidence only / Contents R/W),"
            echo "store it as repo secret EVIDENCE_REPO_TOKEN, and log the 90-day rotation date in BOSSCAT_LOG."
            exit 1
          fi

      - name: Checkout ops pack (scripts)
        uses: actions/checkout@v7

      - name: Checkout evidence repo (write target)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.EVIDENCE_REPO }}
          token: ${{ secrets.EVIDENCE_REPO_TOKEN }}
          path: evidence-repo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run prune
        env:
          REPO_ROOT: ${{ github.workspace }}/evidence-repo
          RETAIN_DAYS: ${{ env.RETAIN_DAYS }}
          DRY_RUN: ${{ env.DRY_RUN }}
          MANIFEST_PATH: ${{ github.workspace }}/artifacts/evidence-prune-manifest.json
        run: |
          mkdir -p artifacts
          node BRAV/SCPT/evidence-retention/prune.mjs
          test -s "$MANIFEST_PATH" || { echo "::error::prune.mjs exited 0 without writing $MANIFEST_PATH"; exit 1; }

      - name: Upload prune manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-prune-manifest
          path: artifacts/evidence-prune-manifest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Push evidence deletions
        if: env.DRY_RUN == 'false'
        working-directory: evidence-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/BossCat/run-reports || true
          if git diff --cached --quiet; then
            echo "No evidence deletions to push."
            exit 0
          fi
          git commit -m "chore(evidence): prune run-reports older than ${RETAIN_DAYS}d [skip ci]"
          # run-archiver.yml pushes to the same branch every 4 h: rebase onto
          # whatever it pushed since the checkout, then push again.
          for attempt in 1 2 3; do
            if git push; then
              echo "PRUNE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              echo "Pushed $(git rev-parse HEAD) (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::the prune commit could not be pushed after 3 attempts"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Evidence Retention Prune'
            echo ''
            echo "**Dry run:** \`${{ env.DRY_RUN }}\`"
            echo "**Retain days:** \`${{ env.RETAIN_DAYS }}\`"
            echo "**Workflow:** ${{ github.workflow }}"
            echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ''
            if [ -f artifacts/evidence-prune-manifest.json ]; then
              node -e '
                const m = require("./artifacts/evidence-prune-manifest.json");
                const p = m.git_log_pass;
                console.log("| Metric | Value |");
                console.log("|--------|-------|");
                console.log("| Would delete | " + m.would_delete_count + " |");
                console.log("| Bytes | " + m.would_delete_bytes + " |");
                console.log("| date_source filename | " + m.date_source_breakdown.filename + " |");
                console.log("| date_source git-log | " + m.date_source_breakdown["git-log"] + " |");
                console.log("| Kept (permanent / young / no age) | " + m.kept.permanent + " / " + m.kept.young + " / " + m.kept.no_age + " |");
                if (p) console.log("| git log pass | " + p.commits + " commits, " + p.paths + " paths, " + p.ms + " ms" + (p.merge_commits != null ? "; merge commits " + p.merge_commits + ", shallow " + p.shallow : "") + " |");
                if (m.git_log_fallbacks != null) console.log("| Per-file fallbacks | " + m.git_log_fallbacks + " |");
                if (m.elapsed_ms != null) console.log("| Script time | " + m.elapsed_ms + " ms |");
                if (m.deleted_count != null) console.log("| Deleted in the checkout | " + m.deleted_count + " |");
              '
            else
              echo '_Manifest missing._'
            fi
            if [ -n "${PRUNE_COMMIT:-}" ]; then
              echo ''
              echo "**Evidence commit pushed:** \`${PRUNE_COMMIT}\` to ${EVIDENCE_REPO} main"
            fi
            echo ''
            echo 'Policy: docs/BossCat/BRIEFING_EVIDENCE_RETENTION.md'
          } >> "$GITHUB_STEP_SUMMARY"
