name: ICF Smoke (Bounded Retry)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      UI_URL: ${{ vars.UI_URL || 'https://moneycat-inc.github.io/otel-ops-pack/' }}
      UI_P95_MS: ${{ vars.UI_P95_MS || '1500' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ICF smoke
        shell: pwsh
        run: |
          ./BRAV/SCPT/icf-smoke.ps1 -VerboseMode

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHAR/EVID/artifacts/icf-smoke || true
          if git diff --cached --quiet; then
            echo "No evidence changes."
          else
            git commit -m "docs(ecrr): ICF smoke evidence update [skip ci]"
            git push
          fi

