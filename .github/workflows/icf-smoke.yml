name: ICF Smoke (Bounded Retry)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      UI_URL: ${{ vars.UI_URL || 'https://moneycat-inc.github.io/otel-ops-pack/' }}
      UI_P95_MS: ${{ vars.UI_P95_MS || '1500' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ICF smoke
        shell: pwsh
        run: |
          ./BRAV/SCPT/icf-smoke.ps1 -VerboseMode

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icf-smoke-evidence-${{ github.run_number }}
          path: CHAR/EVID/artifacts/icf-smoke/
          retention-days: 14
          if-no-files-found: warn

