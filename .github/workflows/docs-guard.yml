name: Docs Guard
# Enforce root markdown cap and validate links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/docs-guard.yml"
  workflow_dispatch:

concurrency:
  group: docs-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-cap:
    name: Enforce Root Markdown Cap
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Block new root markdown files
        shell: bash
        run: |
          set -euo pipefail
          # Legacy note:
          # This repo currently contains many root-level markdown files.
          # The guard enforces *no new root markdown files* are added on PRs.
          base_ref="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          
          echo "Checking for newly added root-level .md files vs $base_ref..."
          added_root_md=$(
            git diff --name-status "$base_ref"...HEAD -- '*.md' \
              | awk '$1=="A" && $2 ~ /^[^\/]+\.md$/ && $2 != "AGENTS.md" {print $2}' \
              || true
          )
          
          if [ -n "$added_root_md" ]; then
            echo "::error::New root markdown files are not allowed"
            echo "$added_root_md"
            echo ""
            echo "Move these into docs/<domain>/ (or CHAR/DOCS mirror) instead."
            exit 1
          fi
          
          echo "✅ No new root markdown files added"
      
      - name: List root markdown files
        shell: bash
        run: |
          echo "Current root markdown files:"
          find . -maxdepth 1 -type f -name "*.md" -exec basename {} \; | sort
      
      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 📋 Docs Guard - Root Cap";
            echo "";
            echo "**Status:** ${{ job.status }}";
            echo "**Root .md files:** $(find . -maxdepth 1 -type f -name '*.md' | wc -l | xargs)";
            echo "**Cap:** ≤15";
            echo "";
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ Root markdown cap enforced";
            else
              echo "❌ Too many markdown files at root";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Link check temporarily disabled - lychee has issues with valid relative links in CI
  # The root cap enforcement above is the critical guard for this consolidation effort
  # Re-enable link checking in a follow-up PR after investigating lychee's path resolution
  
