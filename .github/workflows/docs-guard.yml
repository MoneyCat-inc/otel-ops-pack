name: Docs Guard
# Enforce root markdown cap and validate links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/docs-guard.yml"
  workflow_dispatch:

concurrency:
  group: docs-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-cap:
    name: Enforce Root Markdown Cap
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Count root markdown files
        shell: bash
        run: |
          count=$(find . -maxdepth 1 -type f -name "*.md" | wc -l | xargs)
          echo "Root markdown count: $count"
          max=15
          
          if [ "$count" -gt "$max" ]; then
            echo "::error::Root markdown files exceed $max"
            echo ""
            echo "Found $count markdown files at root (max: $max):"
            find . -maxdepth 1 -type f -name "*.md" -print
            echo ""
            echo "Move files into docs/<domain>/ or delete if obsolete"
            exit 1
          fi
          
          echo "✅ Root markdown cap enforced: $count ≤ $max"
      
      - name: List root markdown files
        shell: bash
        run: |
          echo "Current root markdown files:"
          find . -maxdepth 1 -type f -name "*.md" -exec basename {} \; | sort
      
      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 📋 Docs Guard - Root Cap";
            echo "";
            echo "**Status:** ${{ job.status }}";
            echo "**Root .md files:** $(find . -maxdepth 1 -type f -name '*.md' | wc -l | xargs)";
            echo "**Cap:** ≤15";
            echo "";
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ Root markdown cap enforced";
            else
              echo "❌ Too many markdown files at root";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  link-check:
    name: Validate Internal Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create Lychee config
        run: |
          cat > .lychee.toml <<'EOF'
          # Exclude external links that might be rate-limited or internal services
          exclude = [
            "https://github.com/.*/actions/.*",
            "http://localhost.*",
            "http://127.0.0.1.*",
            "https://fonts.googleapis.com.*",
            "http://deployment-pipeline-api-service.*",
            "http://collector:.*",
            "tcp://.*"
          ]
          # Exclude patterns that cause issues
          exclude_path = [
            ".agent",
            "BRAV",
            "CHAR",
            "DELT",
            "docs/BossCat/BossCat"
          ]
          # Only check markdown files
          include_verbatim = true
          # Accept 200-299 and 429 (rate limit)
          accept = [200, 429]
          EOF
      
      - name: Lychee Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 8 --config .lychee.toml 'README.md' 'CHANGELOG.md' 'docs/**/*.md' 'docs/**/*.html' 'config/**/*.yaml'
          fail: true
          output: lychee-out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📊 Summary (on failure only)
        if: failure()
        run: |
          # Only show first 50 lines of errors to avoid summary size limit
          {
            echo "### 🔗 Link Check Failed";
            echo "";
            echo "Found broken links in core docs. See full output in job logs.";
            echo "";
            echo "<details><summary>First 50 errors</summary>";
            echo "";
            echo '```';
            grep -i "error" lychee-out.md | head -50 || echo "No error details available";
            echo '```';
            echo "";
            echo "</details>";
          } >> "$GITHUB_STEP_SUMMARY" || true

