name: BossCat Run Rotation

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: 30-min conveyor parallel to run-archiver; one archiver suffices.
# Schedule removed; manual dispatch (with inputs) retained. Restore the schedule from git history to re-enable.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no deletes)'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      chunk_size:
        description: 'Chunk size'
        required: false
        default: '1000'
      arch_qps:
        description: 'Archive QPS'
        required: false
        default: '2.0'
      delete_qps:
        description: 'Delete QPS'
        required: false
        default: '1.0'
      arch_concurrency:
        description: 'Archive concurrency'
        required: false
        default: '24'
      rate_jitter_ms:
        description: 'Rate jitter (ms) [unused — reserved for future use]'
        required: false
        default: '1500'

concurrency:
  group: bosscat-nightly-operations
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  CHUNK_SIZE: ${{ inputs.chunk_size || '1000' }}
  ARCH_QPS: ${{ inputs.arch_qps || '2.0' }}
  DELETE_QPS: ${{ inputs.delete_qps || '1.0' }}
  ARCH_CONCURRENCY: ${{ inputs.arch_concurrency || '24' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  EVIDENCE_REPO: MoneyCat-inc/otel-ops-evidence

jobs:
  rotate:
    runs-on: windows-latest
    steps:
      - name: Require EVIDENCE_REPO_TOKEN
        shell: bash
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EVIDENCE_REPO_TOKEN:-}" ]; then
            echo "::error::EVIDENCE_REPO_TOKEN secret is missing (fine-grained PAT → otel-ops-evidence Contents R/W)."
            exit 1
          fi

      - name: Checkout ops pack
        uses: actions/checkout@v7

      - name: Checkout evidence repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.EVIDENCE_REPO }}
          token: ${{ secrets.EVIDENCE_REPO_TOKEN }}
          path: evidence-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BRAV/SCPT/run-archiver/package-lock.json

      - name: Install archiver dependencies
        working-directory: BRAV/SCPT/run-archiver
        run: npm ci

      - name: Preflight
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh BRAV/SCPT/run-archiver/preflight.ps1

      - name: Run rotation conveyor into evidence checkout
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}/evidence-repo
          SKIP_BOSSCAT_LOG: 'true'
        run: |
          $dry = ($env:DRY_RUN -eq 'true')
          pwsh BRAV/SCPT/run-archiver/run-conveyor.ps1 `
            -ChunkSize ([int]$env:CHUNK_SIZE) `
            -ArchQps ([double]$env:ARCH_QPS) `
            -DeleteQps ([double]$env:DELETE_QPS) `
            -ArchConcurrency ([int]$env:ARCH_CONCURRENCY) `
            -DryRun:$dry

      - name: Push evidence repo (fail loud)
        shell: bash
        working-directory: evidence-repo
        env:
          EVIDENCE_REPO_TOKEN: ${{ secrets.EVIDENCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BossCat/run-reports CHAR/EVID || true
          if git diff --cached --quiet; then
            echo "No evidence changes to push."
            exit 0
          fi
          git commit -m "docs(ecrr): run-rotation update [skip ci]"
          git push
