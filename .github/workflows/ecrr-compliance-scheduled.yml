name: ECRR Compliance Scheduled Check

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: same compliance engine, weekday cron with auto-remediation writer.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: ecrr-compliance-scheduled
  cancel-in-progress: false

jobs:
  ecrr-compliance-scheduled:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PowerShell
      uses: PowerShell/setup-powershell@v2
      
    - name: Check ECRR Compliance
      id: compliance_check
      run: |
        $output = pwsh -NoLogo -File scripts/ecrr-compliance-check.ps1 2>&1 | Out-String
        Write-Host $output
        if ($output -match 'Compliance Rate:\s*(\d+\.?\d*)%') {
          $rate = $Matches[1]
          echo "compliance_rate=$rate" >> $env:GITHUB_OUTPUT
        } else {
          echo "compliance_rate=0" >> $env:GITHUB_OUTPUT
        }
        
    - name: Auto-Remediate if below threshold
      if: steps.compliance_check.outputs.compliance_rate < 80
      run: |
        Write-Host "⚠️ Compliance below 80%, running auto-remediation..."
        pwsh -NoLogo -File scripts/remediate-ecrr-compliance.ps1
        Write-Host "Re-checking compliance after remediation..."
        pwsh -NoLogo -File scripts/ecrr-compliance-check.ps1
        
    - name: Upload Compliance Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ecrr-compliance-daily-report
        path: artifacts/ecrr-compliance-check-*.json
        retention-days: 7
        
    - name: Create Issue if Compliance Drops
      if: steps.compliance_check.outputs.compliance_rate < 80
      uses: actions/github-script@v7
      with:
        script: |
          const rate = '${{ steps.compliance_check.outputs.compliance_rate }}';
          const title = `⚠️ ECRR Compliance Below Threshold: ${rate}%`;
          const body = `## ECRR Compliance Alert
          
          **Current Compliance Rate:** ${rate}%
          **Threshold:** 80%
          **Status:** ❌ Below threshold
          
          Auto-remediation has been attempted. Please review the compliance report and take action if needed.
          
          ### Next Steps
          1. Review the compliance report artifact
          2. Check for any files that couldn't be auto-remediated
          3. Manually fix any remaining issues
          
          **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['compliance', 'ecrr', 'automated']
          });
