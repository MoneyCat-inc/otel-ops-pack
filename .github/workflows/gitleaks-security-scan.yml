name: GitLeaks Security Scan

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: duplicate of gitleaks.yml.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: gitleaks-security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: GitLeaks Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Full history for better detection

    - name: Generate GitHub App token
      id: bosscat-auth
      continue-on-error: true
      uses: tibdex/github-app-token@v2
      with:
        app_id: ${{ secrets.BOSSCAT_APP_ID }}
        private_key: ${{ secrets.BOSSCAT_APP_PRIVATE_KEY }}

    # OSS CLI — no GITLEAKS_LICENSE required (gitleaks-action does).
    - name: Install Gitleaks CLI
      run: |
        GITLEAKS_VERSION=8.24.3
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Run GitLeaks
      id: gitleaks
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          gitleaks detect --redact --verbose --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
        else
          gitleaks detect --redact --verbose --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --log-opts=-1
        fi

    - name: Upload GitLeaks results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gitleaks-results
        path: gitleaks-report.json
        retention-days: 30
        if-no-files-found: ignore

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && failure() && steps.gitleaks.outcome == 'failure'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        github-token: ${{ steps.bosscat-auth.outputs.token || secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          let body = '## 🚨 GitLeaks Security Scan Results\n\nPotential secrets detected. Please review and remove any exposed credentials.';
          if (fs.existsSync('gitleaks-report.json')) {
            try {
              const report = JSON.parse(fs.readFileSync('gitleaks-report.json', 'utf8'));
              const findings = Array.isArray(report) ? report : (report.findings || []);
              if (findings.length > 0) {
                body = `## 🚨 GitLeaks Security Scan Results\n\n**${findings.length}** potential secret(s) detected:\n\n` +
                  findings.slice(0, 20).map(f => `- **${f.RuleID || f.rule || 'rule'}**: \`${f.File || f.file}:${f.StartLine || f.startLine || '?'}\``).join('\n');
              }
            } catch (e) {
              console.log('Could not parse gitleaks report:', e.message);
            }
          }
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          });
