name: PR Stress Test Validation

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: full SigNoz stack per PR; superseded by gate-site-evidence PR short-circuit.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: stress-test-pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 🐾 BossCat OEM - Checkout PR
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: 📦 Start SigNoz Stack
        run: |
          echo "🚀 Starting SigNoz for PR validation..."
          docker compose up -d
          sleep 60
          
          until curl -f http://localhost:8080/api/v1/health > /dev/null 2>&1; do
            echo "⏳ Waiting for SigNoz..."
            sleep 5
          done
          echo "✅ SigNoz ready for testing"
      
      - name: 🌐 Start Dashboard Server
        run: |
          python -m http.server 3000 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 5
      
      - name: 🧪 Run Light Load Test (PR Validation)
        run: |
          echo "🧪 Running quick validation test..."
          node BRAV/SCPT/ci/run-scenario.js light-load
      
      - name: 📊 Collect Results
        if: always()
        run: |
          mkdir -p test-results
          curl "http://localhost:8080/api/v1/logs" > test-results/pr-logs.json
          node BRAV/SCPT/ci/generate-report.js
      
      - name: ✅ Validate Performance Thresholds
        run: |
          echo "🎯 Checking performance thresholds..."
          node BRAV/SCPT/ci/validate-thresholds.js
      
      - name: 📤 Upload PR Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-stress-test-${{ github.event.pull_request.number }}
          path: test-results/
      
      - name: 💬 Comment Test Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-results/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🐾 BossCat OEM - Stress Test Results\n\n${report}`
            });
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          kill $SERVER_PID || true
          docker compose down

      - name: ECRR Process (pilot)
        if: always()
        shell: bash
        run: |
          RUN_DIR="artifacts/ecrr/org=${GITHUB_REPOSITORY%/*}/repo=${GITHUB_REPOSITORY#*/}/dt=$(date -u +%Y)/$(date -u +%m)/$(date -u +%d)/run=${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR/logs"
          printf "workflow=%s run=%s status=%s\n" "$GITHUB_WORKFLOW" "$GITHUB_RUN_NUMBER" "${{ job.status }}" > "$RUN_DIR/logs/ci.log"
          cat > "$RUN_DIR/meta.json" <<META
          { "org":"${GITHUB_REPOSITORY%/*}", "repo":"${GITHUB_REPOSITORY#*/}", "run_id": ${GITHUB_RUN_ID}, "run_number": ${GITHUB_RUN_NUMBER}, "name": "${GITHUB_WORKFLOW}", "event": "${GITHUB_EVENT_NAME}", "status": "completed", "conclusion": "${{ job.status }}", "head_branch": "${GITHUB_REF_NAME}", "head_sha": "${GITHUB_SHA}", "created_at": "$(date -u +%FT%TZ)", "updated_at": "$(date -u +%FT%TZ)", "storage": { "root": "artifacts/ecrr", "date": "$(date -u +%Y-%m-%d)", "dir": "$RUN_DIR" } }
META
          export RUN_DIR
          pnpm normalize:run || true
          pnpm classify:run || true
          pnpm summarize:run || true
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV

      - name: ECRR PR Comment (pilot)
        if: github.event_name == 'pull_request'
        env:
          RUN_DIR: ${{ env.RUN_DIR }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec tsx scripts/actor-pr-comment.ts --dir "$RUN_DIR"

