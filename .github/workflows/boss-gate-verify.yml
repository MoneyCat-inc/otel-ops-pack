name: Boss Gate Verify

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: checks for docs/ECRR_*2025-01-05.md files that no longer exist; superseded gate.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: boss-gate-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify-gate:
    name: Boss Gate Verification
    runs-on: ubuntu-latest
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}
      compliance_score: ${{ steps.verify.outputs.score }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: bosscat-auth
        continue-on-error: true
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.BOSSCAT_APP_ID }}
          private_key: ${{ secrets.BOSSCAT_APP_PRIVATE_KEY }}

      - name: Boss Gate Verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          echo 'Running Boss Gate verification checks.'

          compliance_score=0
          total_checks=5

          echo 'Checking ECRR documentation.'
          if [ -f "docs/ECRR_COMPLIANCE_REPORT_2025-01-05.md" ] || [ -f "docs/ECRR_RESOLUTION_COMPLETE_2025-10-05.md" ]; then
            echo 'Found ECRR compliance report.'
            compliance_score=$((compliance_score + 1))
          else
            echo 'ECRR compliance report missing.'
          fi

          echo 'Verifying BossCat OEM role assignment.'
          if [ -f "docs/ECRR_ROLE_ASSIGNMENT_COMPLETE_2025-01-05.md" ]; then
            echo 'BossCat OEM role assignment documented.'
            compliance_score=$((compliance_score + 1))
          else
            echo 'BossCat OEM role assignment missing.'
          fi

          echo 'Validating monitoring artifacts.'
          if [ -d "docs/status" ] && [ -f "docs/status/kpis.json" ]; then
            echo 'Monitoring artifacts present.'
            compliance_score=$((compliance_score + 1))
          else
            echo 'Monitoring artifacts missing.'
          fi

          echo 'Confirming SigNoz configuration files.'
          if [ -f "signoz-collector-config.yaml" ] && [ -f "docker-compose.yml" ]; then
            echo 'SigNoz configuration present.'
            compliance_score=$((compliance_score + 1))
          else
            echo 'SigNoz configuration missing.'
          fi

          echo 'Checking Windows collector configuration.'
          if [ -f "config.yaml" ]; then
            echo 'Windows collector configuration present.'
            compliance_score=$((compliance_score + 1))
          else
            echo 'Windows collector configuration missing.'
          fi

          compliance_percentage=$((compliance_score * 100 / total_checks))

          echo "score=${compliance_percentage}" >> "$GITHUB_OUTPUT"

          if [ "$compliance_score" -eq "$total_checks" ]; then
            echo 'status=passed' >> "$GITHUB_OUTPUT"
            echo "Boss Gate verification PASSED (${compliance_percentage}%)."
          elif [ "$compliance_score" -ge 3 ]; then
            echo 'status=warning' >> "$GITHUB_OUTPUT"
            echo "Boss Gate verification WARNING (${compliance_percentage}%)."
          else
            echo 'status=failed' >> "$GITHUB_OUTPUT"
            echo "Boss Gate verification FAILED (${compliance_percentage}%)."
            exit 1
          fi

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boss-gate-verification-${{ github.run_number }}
          path: |
            docs/status/
            docs/ECRR_*.md
            signoz-collector-config.yaml
            config.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Comment PR with verification results
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bosscat-auth.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.verify.outputs.status }}';
            const score = '${{ steps.verify.outputs.score }}';

            let badgeUrl;
            let message;
            if (status === 'passed') {
              badgeUrl = 'https://img.shields.io/badge/boss--gate-PASSED-green.svg';
              message = 'Boss Gate verification PASSED - Ready for merge.';
            } else if (status === 'warning') {
              badgeUrl = 'https://img.shields.io/badge/boss--gate-WARNING-yellow.svg';
              message = 'Boss Gate verification WARNING - Review recommended.';
            } else {
              badgeUrl = 'https://img.shields.io/badge/boss--gate-FAILED-red.svg';
              message = 'Boss Gate verification FAILED - Fix required.';
            }

            const lines = [
              '## Boss Gate Verification Results',
              '',
              `![Boss Gate Status](${badgeUrl})`,
              '',
              `**Compliance Score:** ${score}%`,
              '',
              message,
              '',
              '---',
              '',
              '*BossCat OEM (Executive Overseer Manager) - ECRR Framework v2.0*'
            ];

            const body = lines.join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
      
      - name: 📋 Run Summary
        if: always()
        run: |
          {
            echo '### Boss Gate Verify - Run Summary';
            echo '';
            echo "**Workflow:** ${{ github.workflow }}";
            echo "**Run:** #${{ github.run_number }} (attempt ${{ github.run_attempt }})";
            echo "**Ref:** \`${{ github.ref }}\`";
            echo "**Actor:** @${{ github.actor }}";
            echo "**Status:** ${{ job.status }}";
            echo '';
            echo '**Artifacts:** boss-gate-verification (14d retention)';
            echo '';
            echo '[View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})';
          } >> "$GITHUB_STEP_SUMMARY"
