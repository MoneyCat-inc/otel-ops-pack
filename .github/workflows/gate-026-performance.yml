# KEEP -- Phase 0 workflow audit 2026-08-03: canonical k6 performance gate for dotnet-test-app
# Gate #026 Track B: CI Performance Gate with k6
# Authority: BossCat OEM | Executor: Cursor{Implementer}
# Purpose: Blocking load test with threshold enforcement

name: Gate-026 Performance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'dotnet-test-app/**'
      - 'scripts/gate026/**'
      - '.github/workflows/gate-026-performance.yml'
  push:
    branches: [main]
    paths:
      - 'dotnet-test-app/**'
      - 'scripts/gate026/**'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for testing'
        required: false
        default: 'http://localhost:5555'

# Concurrency: Cancel previous runs on new push (ALFA track pattern)
concurrency:
  group: gate-026-perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-gate:
    name: k6 Performance Gate
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Build .NET Test App
        run: |
          cd dotnet-test-app
          dotnet build -c Release
        shell: pwsh

      - name: 🚀 Start Test App (Background)
        run: |
          $appPath = "dotnet-test-app\bin\Release\net8.0\dotnet-test-app.dll"
          # Prevent GitHub Actions cleanup from killing the app between steps.
          $env:RUNNER_TRACKING_ID = ''
          Start-Process -FilePath "dotnet" -ArgumentList "exec", $appPath -NoNewWindow
          
          # Wait for app to start
          $maxRetries = 10
          $retries = 0
          while ($retries -lt $maxRetries) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:5555/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ App started: HTTP $($response.StatusCode)"
                break
              }
            } catch {
              $retries++
              Write-Host "Waiting for app to start... ($retries/$maxRetries)"
              Start-Sleep -Seconds 2
            }
          }
          
          if ($retries -eq $maxRetries) {
            Write-Host "❌ App failed to start"
            exit 1
          }
        shell: pwsh

      - name: 🔍 Synthetic Trace Injection (Observability Gate)
        run: |
          Write-Host "📡 Injecting synthetic trace to verify observability..."
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:5555/health" -UseBasicParsing -TimeoutSec 2 | Out-Null
          } catch {
            Write-Host "🔁 Test app not reachable; restarting for injection step..."
            $env:RUNNER_TRACKING_ID = ''
            $appPath = "dotnet-test-app\bin\Release\net8.0\dotnet-test-app.dll"
            Start-Process -FilePath "dotnet" -ArgumentList "exec", $appPath -NoNewWindow
            for ($i = 1; $i -le 10; $i++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:5555/health" -UseBasicParsing -TimeoutSec 2 | Out-Null
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
          }
          
          # Call each endpoint once to generate telemetry
          try {
            Invoke-RestMethod -Uri "http://127.0.0.1:5555/" | Out-Null
            Invoke-RestMethod -Uri "http://127.0.0.1:5555/health" | Out-Null
            Invoke-RestMethod -Uri "http://127.0.0.1:5555/test" | Out-Null
            
            Write-Host "✅ Synthetic traces injected"
          } catch {
            Write-Host "❌ Synthetic trace injection failed: $($_.Exception.Message)"
            exit 1
          }
          
          # Wait for telemetry to propagate
          Write-Host "⏳ Waiting 5 seconds for telemetry propagation..."
          Start-Sleep -Seconds 5
        shell: pwsh

      - name: 🔧 Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.57.0'

      - name: 🏃 Run k6 Performance Test
        id: k6
        continue-on-error: true  # Capture exit code but don't fail yet
        run: |
          Write-Host "=== Gate #026 Track B: k6 Performance Gate ===" -ForegroundColor Cyan
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:5555/health" -UseBasicParsing -TimeoutSec 2 | Out-Null
          } catch {
            Write-Host "🔁 Test app not reachable; restarting for k6 step..." -ForegroundColor Yellow
            $env:RUNNER_TRACKING_ID = ''
            $appPath = "dotnet-test-app\bin\Release\net8.0\dotnet-test-app.dll"
            Start-Process -FilePath "dotnet" -ArgumentList "exec", $appPath -NoNewWindow
            for ($i = 1; $i -le 10; $i++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:5555/health" -UseBasicParsing -TimeoutSec 2 | Out-Null
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          
          k6 run scripts/gate026/k6-performance-gate.js `
            --out json=artifacts/k6-results.json `
            --env TARGET_URL=http://127.0.0.1:5555
          
          $exitCode = $LASTEXITCODE
          echo "k6_exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          
          if ($exitCode -ne 0) {
            Write-Host "❌ k6 test failed with thresholds violations (exit code: $exitCode)" -ForegroundColor Red
          } else {
            Write-Host "✅ k6 test passed all thresholds" -ForegroundColor Green
          }
          
          exit $exitCode
        shell: pwsh

      - name: 📊 Archive k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: artifacts/k6-results.json
          retention-days: 14

      - name: 📋 Performance Gate Summary
        if: always()
        run: |
          $exitCode = '${{ steps.k6.outputs.k6_exit_code }}'
          if ([string]::IsNullOrEmpty($exitCode)) { $exitCode = '1' }
          $runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $status = if ($exitCode -eq '0') { '**Status:** PASS' } else { '**Status:** FAIL' }
          $lines = @(
            '### Gate #026 Performance Gate Results',
            '',
            $status,
            '',
            "**Workflow:** ${{ github.workflow }}",
            "**Run:** #${{ github.run_number }} (attempt ${{ github.run_attempt }})",
            "**Ref:** ${{ github.ref }}",
            "**Actor:** @${{ github.actor }}",
            '',
            "[View k6 results artifact]($runUrl)"
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        shell: pwsh

      - name: ❌ Fail if Thresholds Violated
        if: steps.k6.outputs.k6_exit_code != '0'
        run: |
          Write-Host "❌ Performance gate FAILED - thresholds violated" -ForegroundColor Red
          Write-Host "   Review k6 output and artifact for details" -ForegroundColor Yellow
          exit 1
        shell: pwsh

