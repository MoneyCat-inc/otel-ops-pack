name: IONA Gate Verification

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: duplicates bosscat-gate-verify (same verify-iona-gate.ps1) on every push/PR.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: iona-gate-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate-verify:
    # Distinct from workflow "BossCat Gate Verification" (bosscat-gate-verify.yml)
    name: IONA Gate Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: bosscat-auth
        continue-on-error: true
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.BOSSCAT_APP_ID }}
          private_key: ${{ secrets.BOSSCAT_APP_PRIVATE_KEY }}

      - name: Run IONA gate verification
        shell: pwsh
        run: |
          pwsh -File scripts/verify-iona-gate.ps1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iona-gate-artifacts
          path: |
            artifacts/*.json
            artifacts/*.txt
            artifacts/*.md
            CHAR/ECRR/ECRR_REPORTS/ECRR_GATE_RUN_LATEST.md
          retention-days: 14

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bosscat-auth.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let verdict = 'unknown';
            let reasons = [];
            try {
              const gate = JSON.parse(fs.readFileSync('artifacts/gate-verification-results.json', 'utf8'));
              verdict = gate.verdict || verdict;
              reasons = gate.reasons || [];
            } catch (e) {}

            const icon = verdict === 'READY' ? '✅' : verdict === 'READY_WITH_WARNINGS' ? '⚠️' : '❌';
            let comment = `## 🎯 IONA Gate Verification Results\n\n`;
            comment += `${icon} **Verdict**: \`${verdict}\`\n`;
            if (reasons.length) comment += `\n**Reasons:**\n${reasons.map(r => `- ${r}`).join('\n')}\n`;
            comment += `\n- **Run**: [#${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})\n`;
            comment += `- **Commit**: ${context.sha.substring(0, 7)}\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
