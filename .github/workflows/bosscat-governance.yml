name: BossCat Governance Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  governance-checks:
    name: BossCat Compliance Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "🐾 BossCat Governance Suite" -ForegroundColor Cyan
          $PSVersionTable.PSVersion

      - name: Validate Commit Messages
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Write-Host "📋 Validating commit message format..." -ForegroundColor Cyan
          
          $commits = git log origin/${{ github.base_ref }}..HEAD --format="%s"
          $validPrefixes = @('feat', 'fix', 'docs', 'test', 'chore', 'refactor', 'perf', 'ci', 'build', 'revert')
          
          $invalid = @()
          foreach ($commit in $commits) {
            $hasValidPrefix = $false
            foreach ($prefix in $validPrefixes) {
              if ($commit -match "^$prefix(\(.+?\))?:") {
                $hasValidPrefix = $true
                break
              }
            }
            if (-not $hasValidPrefix) {
              $invalid += $commit
            }
          }
          
          if ($invalid.Count -gt 0) {
            Write-Host "❌ Invalid commit messages found:" -ForegroundColor Red
            $invalid | ForEach-Object { Write-Host "  • $_" -ForegroundColor Yellow }
            Write-Host ""
            Write-Host "Expected format: <type>(<scope>): <subject>" -ForegroundColor Gray
            Write-Host "Valid types: $($validPrefixes -join ', ')" -ForegroundColor Gray
            exit 1
          }
          
          Write-Host "✅ All commit messages follow BossCat standards" -ForegroundColor Green

      - name: Check ECRR Documentation
        shell: pwsh
        run: |
          Write-Host "📚 Checking ECRR documentation..." -ForegroundColor Cyan
          
          $changedFiles = git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD
          $scriptChanges = $changedFiles | Where-Object { $_ -like "scripts/*.ps1" }
          
          if ($scriptChanges) {
            Write-Host "Script changes detected:" -ForegroundColor Yellow
            $scriptChanges | ForEach-Object { Write-Host "  • $_" -ForegroundColor Gray }
            
            $ecrrReports = git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | Where-Object { $_ -like "docs/ecrr/*" }
            
            if (-not $ecrrReports) {
              Write-Host "⚠️ Script changes without ECRR documentation" -ForegroundColor Yellow
              Write-Host "Consider adding ECRR report to docs/ecrr/ECRR_REPORTS/" -ForegroundColor Gray
            } else {
              Write-Host "✅ ECRR documentation present" -ForegroundColor Green
            }
          }

      - name: Validate PowerShell Scripts
        shell: pwsh
        run: |
          Write-Host "🔍 Validating PowerShell syntax..." -ForegroundColor Cyan
          
          $scripts = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
          $errors = @()
          
          foreach ($script in $scripts) {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script.FullName -Raw), [ref]$null)
              Write-Host "  ✓ $($script.Name)" -ForegroundColor Green
            } catch {
              $errors += "  ✗ $($script.Name): $($_.Exception.Message)"
              Write-Host "  ✗ $($script.Name)" -ForegroundColor Red
            }
          }
          
          if ($errors.Count -gt 0) {
            Write-Host ""
            Write-Host "❌ PowerShell syntax errors found:" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Yellow }
            exit 1
          }
          
          Write-Host "✅ All PowerShell scripts valid" -ForegroundColor Green

      - name: Generate Governance Report
        if: always()
        shell: pwsh
        run: |
          $report = @"
# BossCat Governance Report
**Workflow:** ${{ github.workflow }}
**Run:** ${{ github.run_number }}
**Branch:** ${{ github.ref_name }}
**Commit:** ${{ github.sha }}
**Date:** $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")

## Checks Performed
- ✅ Commit message format validation
- ✅ ECRR documentation check
- ✅ PowerShell syntax validation

## Status
**Overall:** ${{ job.status }}

---
*Generated by BossCat OEM · Executive Overseer Manager*
"@
          
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $report | Set-Content -Path artifacts/bosscat-governance-report.md -Encoding UTF8

      - name: Upload Governance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bosscat-governance-${{ github.run_number }}
          path: artifacts/bosscat-governance-report.md
          retention-days: 90


