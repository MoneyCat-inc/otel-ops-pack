# KEEP -- Phase 0 workflow audit 2026-08-03: only commit-message lint in the repo (conventional-commit gate)
name: BossCat Governance Suite

# Demand shaping 2026-09-01: docs/markdown-only PRs skip this suite. Trade-off
# accepted: those PRs lose the commit-message lint, but the repo squash-merges
# (branch commit subjects are discarded) and docs PRs have their own lane
# (docs-lane-checks.yml). The substantive checks here (scripts/*.ps1 syntax,
# ECRR-presence-on-script-change) cannot be affected by docs-only diffs.
# Not a required branch-protection context (verified live 2026-09-01; see
# required-check-shims.yml header) — no shim needed. push (main) unfiltered.
on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bosscat-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  governance-checks:
    name: BossCat Compliance Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "🐾 BossCat Governance Suite" -ForegroundColor Cyan
          $PSVersionTable.PSVersion

      - name: Validate Commit Messages
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_ACTOR: ${{ github.actor }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          Write-Host "📋 Validating commit message format..." -ForegroundColor Cyan

          # Bot PRs (Dependabot, Renovate) are squash-merged; don't block on their titles/commits.
          $botActors = @('dependabot[bot]', 'dependabot-preview[bot]', 'renovate[bot]', 'github-actions[bot]')
          if ($botActors -contains $env:PR_ACTOR -or $botActors -contains $env:PR_USER_LOGIN) {
            Write-Host "ℹ️ Skipping commit-message gate for bot PR ($($env:PR_ACTOR))" -ForegroundColor Gray
            exit 0
          }

          # Force array so a single commit is never character-enumerated on Windows PowerShell 5.1
          # Exclude merge commits (incl. GitHub's ephemeral "Merge <sha> into <sha>" PR refs)
          $commits = @(git log "origin/${{ github.base_ref }}..HEAD" --format="%s" 2>$null |
            Where-Object { $_ -and $_.Trim() -ne '' -and $_ -notmatch '^Merge\b' })
          if ($commits.Count -eq 0) {
            Write-Host "ℹ️ No commits to validate (empty/squash PR)" -ForegroundColor Gray
            exit 0
          }
          $validPrefixes = @('feat', 'fix', 'docs', 'test', 'chore', 'refactor', 'perf', 'ci', 'build', 'revert')
          
          $invalid = @()
          foreach ($commit in $commits) {
            $hasValidPrefix = $false
            foreach ($prefix in $validPrefixes) {
              if ($commit -match "^$prefix(\(.+?\))?:") {
                $hasValidPrefix = $true
                break
              }
            }
            if (-not $hasValidPrefix) {
              $invalid += $commit
            }
          }
          
          if ($invalid.Count -gt 0) {
            Write-Host "❌ Invalid commit messages found:" -ForegroundColor Red
            $invalid | ForEach-Object { Write-Host "  - $_" -ForegroundColor Yellow }
            Write-Host ""
            Write-Host "Expected format: <type>(<scope>): <subject>" -ForegroundColor Gray
            Write-Host "Valid types: $($validPrefixes -join ', ')" -ForegroundColor Gray
            exit 1
          }
          
          Write-Host "✅ All commit messages follow BossCat standards" -ForegroundColor Green

      - name: Check ECRR Documentation
        shell: pwsh
        run: |
          Write-Host "📚 Checking ECRR documentation..." -ForegroundColor Cyan
          
          $changedFiles = git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD
          $scriptChanges = $changedFiles | Where-Object { $_ -like "scripts/*.ps1" }
          
          if ($scriptChanges) {
            Write-Host "Script changes detected:" -ForegroundColor Yellow
            $scriptChanges | ForEach-Object { Write-Host "  • $_" -ForegroundColor Gray }
            
            $ecrrReports = git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | Where-Object { $_ -like "docs/ecrr/*" }
            
            if (-not $ecrrReports) {
              Write-Host "⚠️ Script changes without ECRR documentation" -ForegroundColor Yellow
              Write-Host "Consider adding ECRR report to CHAR/ECRR/ECRR_REPORTS/" -ForegroundColor Gray
            } else {
              Write-Host "✅ ECRR documentation present" -ForegroundColor Green
            }
          }

      - name: Validate PowerShell Scripts
        shell: pwsh
        run: |
          Write-Host "🔍 Validating PowerShell syntax..." -ForegroundColor Cyan
          
          $scripts = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
          $errors = @()
          
          foreach ($script in $scripts) {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script.FullName -Raw), [ref]$null)
              Write-Host "  ✓ $($script.Name)" -ForegroundColor Green
            } catch {
              $errors += "  ✗ $($script.Name): $($_.Exception.Message)"
              Write-Host "  ✗ $($script.Name)" -ForegroundColor Red
            }
          }
          
          if ($errors.Count -gt 0) {
            Write-Host ""
            Write-Host "❌ PowerShell syntax errors found:" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Yellow }
            exit 1
          }
          
          Write-Host "✅ All PowerShell scripts valid" -ForegroundColor Green

      - name: Generate Governance Report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $lines = @(
            '# BossCat Governance Report',
            "**Workflow:** ${{ github.workflow }}",
            "**Run:** ${{ github.run_number }}",
            "**Branch:** ${{ github.ref_name }}",
            "**Commit:** ${{ github.sha }}",
            "**Date:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')",
            '',
            '## Checks Performed',
            '- Commit message format validation',
            '- ECRR documentation check',
            '- PowerShell syntax validation',
            '',
            '## Status',
            "**Overall:** ${{ job.status }}",
            '',
            '---',
            '*Generated by BossCat OEM · Executive Overseer Manager*'
          )
          $lines | Set-Content -Path artifacts/bosscat-governance-report.md -Encoding UTF8

      - name: Upload Governance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bosscat-governance-${{ github.run_number }}
          path: artifacts/bosscat-governance-report.md
          retention-days: 90



