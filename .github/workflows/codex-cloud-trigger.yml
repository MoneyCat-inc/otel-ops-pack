name: Codex-Cloud Trigger

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: "Select the task type to queue"
        required: true
        type: choice
        options:
          - documentation-update
          - configuration-change
          - conflict-resolution
          - observability-audit
          - incident-response
      description:
        description: "Short summary of the desired work"
        required: true
        type: string
      target_number:
        description: "Issue or PR number for status updates"
        required: true
        type: string
      priority:
        description: "Priority level"
        required: false
        default: standard
        type: choice
        options:
          - standard
          - urgent
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  queue-task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Codex-Cloud task entry
        id: prep
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const eventName = context.eventName;
            const payload = context.payload;

            const allowedLabels = new Set(['needs-conflict-help', 'needs-codex-cloud']);

            function hasCommand(body = '') {
              const normalized = body.toLowerCase();
              return normalized.includes('@codex') || normalized.includes('@codex-cloud');
            }

            function buildBase(taskType, description, targetNumber, priority, requester) {
              return {
                timestamp: new Date().toISOString(),
                repository: `${context.repo.owner}/${context.repo.repo}`,
                source_event: eventName,
                task_type: taskType,
                description,
                priority: priority || 'standard',
                target_number: targetNumber,
                requester,
                url: payload?.pull_request?.html_url || payload?.issue?.html_url || payload?.repository?.html_url
              };
            }

            let task = null;

            if (eventName === 'pull_request' && payload.action === 'labeled' && allowedLabels.has(payload.label.name)) {
              const pr = payload.pull_request;
              const label = payload.label.name;
              task = buildBase(
                'conflict-resolution',
                `Resolve merge conflicts and complete validations for PR #${pr.number} (${label}).`,
                pr.number,
                'standard',
                pr.user.login
              );
            } else if (eventName === 'issue_comment' && payload.action === 'created' && payload.issue?.pull_request) {
              const body = payload.comment.body || '';
              if (hasCommand(body)) {
                const inferredPriority = body.toLowerCase().includes('urgent') ? 'urgent' : 'standard';
                const cleaned = body.replace(/@codex(?:-cloud)?/gi, '').trim();
                task = buildBase(
                  'conflict-resolution',
                  cleaned || 'Follow up on requester command comment.',
                  payload.issue.number,
                  inferredPriority,
                  payload.comment.user.login
                );
              }
            } else if (eventName === 'workflow_dispatch') {
              const inputs = payload.inputs || {};
              const targetNumber = Number(inputs.target_number);
              if (!Number.isInteger(targetNumber)) {
                core.setFailed('`target_number` must be an integer.');
                return;
              }
              task = buildBase(
                inputs.task_type,
                inputs.description,
                targetNumber,
                inputs.priority || 'standard',
                payload.sender?.login || 'workflow-dispatch'
              );
            }

            if (!task) {
              core.notice('No actionable Codex-Cloud trigger detected; skipping queue update.');
              core.setOutput('skip', 'true');
              return;
            }

            const queueDir = path.join(process.cwd(), '.agent', 'state');
            fs.mkdirSync(queueDir, { recursive: true });
            const queuePath = path.join(queueDir, 'queue.jsonl');
            fs.appendFileSync(queuePath, `${JSON.stringify(task)}\n`, 'utf8');

            const summaryLines = [
              `### Codex-Cloud Task Queued`,
              `- **Type:** ${task.task_type}`,
              `- **Priority:** ${task.priority}`,
              `- **Description:** ${task.description}`,
              `- **Queue File:** \`${queuePath}\``
            ];

            const commentBody = `${summaryLines.join('\n')}\n\nAn automation worker will pick up this task from the queue artifact.`;

            core.setOutput('skip', 'false');
            core.setOutput('queue_path', queuePath);
            core.setOutput('comment_target', String(task.target_number || ''));
            core.setOutput('comment_body', commentBody);
            core.setOutput('artifact_name', 'codex-cloud-task');

      - name: Upload queue artifact
        if: steps.prep.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ steps.prep.outputs.queue_path }}
          retention-days: 7

      - name: Post status comment
        if: steps.prep.outputs.skip != 'true' && steps.prep.outputs.comment_target != ''
        uses: actions/github-script@v7
        env:
          COMMENT_TARGET: ${{ steps.prep.outputs.comment_target }}
          COMMENT_BODY: ${{ steps.prep.outputs.comment_body }}
        with:
          script: |
            const core = require('@actions/core');
            const issueNumber = Number(process.env.COMMENT_TARGET);
            if (!Number.isInteger(issueNumber)) {
              core.warning('Comment target is not a valid issue number; skipping comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: process.env.COMMENT_BODY
              });
            }
