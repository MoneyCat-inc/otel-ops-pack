name: rsi-sweep-nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sweep-batchsize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warm bench dataset (2000 files)
        shell: pwsh
        run: |
          pwsh BRAV/SCPT/rsi-bench/bench-index.ps1 -IndexConcurrency 8 -BatchSize 1000 -SampleN 2000 -Tag nightly-warm -ReuseBench
      - name: Run batch-size sweep (3 repeats for statistical analysis)
        shell: pwsh
        run: |
          # Run 3 iterations for median and confidence intervals
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== Sweep iteration $i of 3 ===" -ForegroundColor Yellow
            pwsh BRAV/SCPT/rsi-bench/sweep-batchsize.ps1 `
              -BatchSizes @(500,800,1000,1200,1500) `
              -IndexConcurrency 8 `
              -SampleN 2000 `
              -TagPrefix "nightly-r${i}-bs" `
              -BenchRoot '.bench/archived' `
              -ArchivedRoot 'docs/BossCat/run-reports/archived'
          }
      - name: Statistical analysis (median, CI, significance)
        shell: pwsh
        run: |
          pwsh BRAV/SCPT/rsi-bench/analyze-sweep-stats.ps1 `
            -TagPattern "nightly-r*-bs*" `
            -OutputReport "docs/ecrr/ECRR_REPORTS/ECRR_RSI_NIGHTLY_STATS_LATEST.md"
      - name: Check if baseline should be promoted
        id: check_promotion
        shell: pwsh
        run: |
          $report = Get-Content docs/ecrr/ECRR_REPORTS/ECRR_RSI_NIGHTLY_STATS_LATEST.md -Raw
          
          # Check if report recommends updating baseline
          # Pattern: "Consider BatchSize=XXXX" + "statistically significant"
          if ($report -match 'Consider BatchSize=(\d+).*[Ss]tatistically significant') {
            $newBS = $Matches[1]
            Write-Host "Statistical threshold met: BatchSize=$newBS" -ForegroundColor Green
            echo "promote=true" >> $env:GITHUB_OUTPUT
            echo "batchsize=$newBS" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No promotion threshold met (keep baseline)" -ForegroundColor Yellow
            echo "promote=false" >> $env:GITHUB_OUTPUT
          }
      
      - name: Create baseline update PR
        if: steps.check_promotion.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Configure git
          git config user.name "BossCat RSI Bot"
          git config user.email "bosscat-rsi@noreply.github.com"
          
          # Create branch
          BRANCH="rsi/auto-baseline-bs${{ steps.check_promotion.outputs.batchsize }}"
          git checkout -b "$BRANCH"
          
          # Update bench-index.ps1 default BatchSize
          sed -i 's/\[int\]$BatchSize = 1000/[int]$BatchSize = ${{ steps.check_promotion.outputs.batchsize }}/' BRAV/SCPT/rsi-bench/bench-index.ps1
          
          # Commit with evidence
          git add BRAV/SCPT/rsi-bench/bench-index.ps1
          git commit -m "feat(rsi): Auto-promote baseline to BatchSize=${{ steps.check_promotion.outputs.batchsize }}

Nightly statistical analysis detected significant improvement:
- BatchSize=${{ steps.check_promotion.outputs.batchsize }} shows consistent performance gain
- 95% confidence intervals do not overlap with baseline
- Median improvement exceeds threshold
- Statistically validated across multiple nightly runs

Evidence: ECRR_RSI_NIGHTLY_STATS_LATEST.md
Workflow: rsi-sweep-nightly.yml (automated promotion)
Decision: Requires BossCat OEM approval before merge

ECRR: Auto-generated by RSI nightly automation"
          
          # Push branch
          git push origin "$BRANCH"
          
          # Create PR with stats report as body
          gh pr create \
            --title "RSI: Auto-promote baseline to BatchSize=${{ steps.check_promotion.outputs.batchsize }}" \
            --body-file docs/ecrr/ECRR_REPORTS/ECRR_RSI_NIGHTLY_STATS_LATEST.md \
            --label rsi \
            --label auto-promotion \
            --label needs-bosscat-approval
      
      - name: Comment on open RSI PRs
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read latest stats report
            let stats = '';
            try {
              stats = fs.readFileSync('docs/ecrr/ECRR_REPORTS/ECRR_RSI_NIGHTLY_STATS_LATEST.md', 'utf8');
            } catch (e) {
              console.log('No stats report found, skipping PR comments');
              return;
            }
            
            // Find open PRs with 'rsi' label or touching RSI paths
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            
            const rsiPRs = prs.filter(pr => {
              return pr.labels.some(label => label.name.toLowerCase().includes('rsi'));
            });
            
            // Post stats summary to each RSI PR
            for (const pr of rsiPRs) {
              const timestamp = new Date().toISOString();
              const body = `## 🌙 Nightly RSI Stats Update
              
_Automated update from nightly sweep (${timestamp})_

<details>
<summary>📊 Click to view latest statistical analysis</summary>

${stats}

</details>

---
_This comment is automatically posted by \`rsi-sweep-nightly.yml\` workflow._
`;
              
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              
              console.log(`Posted stats to PR #${pr.number}`);
            }
      
      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-sweep-nightly-${{ github.run_number }}
          path: |
            CHAR/EVID/artifacts/ecrr/index/METRICS.jsonl
            docs/ecrr/ECRR_REPORTS/ECRR_RSI_BATCHSIZE_DISCOVERY_*.md
            docs/ecrr/ECRR_REPORTS/ECRR_RSI_BATCHSIZE_DISCOVERY_LATEST.md
            docs/ecrr/ECRR_REPORTS/ECRR_RSI_NIGHTLY_STATS_LATEST.md
          retention-days: 90

