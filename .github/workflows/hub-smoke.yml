name: Hub Uptime Smoke
# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: every-10-min endpoint poll (~4,300 runs/month) for a static Pages site.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check critical endpoints
        run: |
          set -euo pipefail
          urls=(
            "https://hub.resonai.uk/"
            "https://hub.resonai.uk/assets/hub.js"
            "https://hub.resonai.uk/docs/status/kpis.json"
            "https://hub.resonai.uk/docs/status.html"
            "https://hub.resonai.uk/docs/dashboards/live-metrics.html"
            "https://hub.resonai.uk/docs/BossCat/data_room_enhanced.html"
            "https://hub.resonai.uk/docs/widgets/bluesky-latest.json"
            "https://hub.resonai.uk/.well-known/security.txt"
          )
          for u in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u")
            [ "$code" = "200" ] && echo "OK $u" || { echo "::error ::$u returned $code"; exit 1; }
          done

