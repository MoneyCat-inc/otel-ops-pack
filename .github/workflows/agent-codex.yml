name: agent-codex
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Run Smoke Tests
        run: node .agent/tools/smoke.mjs
      - name: Check Task Queue
        run: |
          if [ -f ".agent/state/queue.jsonl" ]; then
            echo "Task queue exists with $(wc -l < .agent/state/queue.jsonl) tasks"
            head -1 .agent/state/queue.jsonl
          else
            echo "No task queue found"
          fi
