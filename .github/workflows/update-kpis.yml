name: Update KPIs
# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: daily KPI PR-opener with no consumer.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate KPIs from gate verification
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/generate-hub-kpis.ps1 -Site ci
      - name: Open KPI refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/status/kpis.json
          commit-message: "chore(hub): refresh KPIs from gate verification"
          title: "chore(hub): refresh KPIs from gate verification"
          body: |
            Automated KPI refresh generated by the scheduled Update KPIs workflow.

            This uses a pull request because `main` requires protected-branch checks.
          branch: automation/update-kpis
          delete-branch: true
