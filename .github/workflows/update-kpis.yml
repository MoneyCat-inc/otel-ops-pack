name: Update KPIs
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate KPIs from gate verification
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/generate-hub-kpis.ps1 -Site ci
      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/status/kpis.json
          git diff --staged --quiet && echo "No KPI changes" && exit 0
          git commit -m "chore(hub): refresh KPIs from gate verification"
          git push
