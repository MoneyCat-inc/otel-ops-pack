name: Update KPIs
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate KPIs from gate verification
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/generate-hub-kpis.ps1 -Site ci
      - name: Open KPI refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/status/kpis.json
          commit-message: "chore(hub): refresh KPIs from gate verification"
          title: "chore(hub): refresh KPIs from gate verification"
          body: |
            Automated KPI refresh generated by the scheduled Update KPIs workflow.

            This uses a pull request because `main` requires protected-branch checks.
          branch: automation/update-kpis
          delete-branch: true
