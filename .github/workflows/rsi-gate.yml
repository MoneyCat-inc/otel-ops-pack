name: rsi-gate

on:
  push:
    branches: [ main ]
    paths:
      - 'BRAV/SCPT/rsi/**'
      - 'BRAV/SCPT/rsi-bench/**'
      - 'BRAV/SCPT/run-archiver/**'
      - '.github/workflows/rsi-*.yml'
  workflow_dispatch:

jobs:
  rsi-gate:
    # BossCat governance: run on main/manual; skip gating on PR lane
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Propose candidate (conservative)
        run: |
          node BRAV/SCPT/rsi/propose-conservative.mjs > .agent/rsi-candidate.json
      - name: Evaluate candidate vs baseline (gate)
        shell: pwsh
        run: |
          # Larger samples for stability
          pwsh BRAV/SCPT/rsi/evaluate.ps1 -Candidate .agent/rsi-candidate.json -IndexSampleN 2000 -ArchTasks 960 -ArchTaskMs 800
      - name: Upload RSI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-gate-artifacts
          path: |
            CHAR/EVID/artifacts/ecrr/**
            CHAR/ECRR/ECRR_REPORTS/RSI_EVAL_LATEST.md

