name: Nightly Dashboard Export

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      export_all:
        description: 'Export all dashboards (not just executive)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: nightly-dashboard-export-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  export-dashboards:
    name: Export SigNoz Dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) installed"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start SigNoz stack
        run: |
          docker compose -f docker-compose-signoz.yml up -d
          echo "Waiting for SigNoz to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "✅ SigNoz is ready!"
              break
            fi
            echo "⏳ Waiting for SigNoz... ($i/60)"
            sleep 10
          done
          
          # Verify SigNoz is actually responding
          curl -v http://localhost:8080/api/v1/health || exit 1
      
      - name: Run dashboard export (PowerShell)
        shell: pwsh
        run: |
          if (Test-Path BRAV/SCPT/nightly-dashboard-export.ps1) {
            pwsh -File BRAV/SCPT/nightly-dashboard-export.ps1
          } else {
            Write-Host "⚠️ nightly-dashboard-export.ps1 not found, using Playwright directly"
            pnpm run export:signoz:playwright
          }
      
      - name: Run dashboard export (Playwright)
        if: github.event.inputs.export_all == 'true'
        run: |
          pnpm run export:signoz:playwright
      
      - name: Collect dashboard snapshots
        run: |
          mkdir -p docs/observability/snapshots/$(date +%Y-%m-%d)
          
          # Copy artifacts
          if [ -d "artifacts" ]; then
            cp artifacts/*.png docs/observability/snapshots/$(date +%Y-%m-%d)/ 2>/dev/null || true
            cp artifacts/*.json docs/observability/snapshots/$(date +%Y-%m-%d)/ 2>/dev/null || true
          fi
          
          # Copy test results
          if [ -d "test-results" ]; then
            find test-results -name "*.png" -exec cp {} docs/observability/snapshots/$(date +%Y-%m-%d)/ \; 2>/dev/null || true
          fi
          
          # Generate index
          echo "# Dashboard Snapshots - $(date +%Y-%m-%d)" > docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          echo "" >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          echo "Auto-generated by nightly-dashboard-export workflow" >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          echo "" >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          ls -lh docs/observability/snapshots/$(date +%Y-%m-%d)/ >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md

      - name: Setup Python for research conversion
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PDF/Docx tooling
        run: |
          python -m pip install --upgrade pip
          pip install --quiet pdfminer.six python-docx

      - name: Convert research papers to Markdown
        shell: bash
        run: |
          if [ -f scripts/convert_research_to_md.py ]; then
            python scripts/convert_research_to_md.py || true
          else
            echo "convert_research_to_md.py not found; skipping"
          fi

      - name: Upload research Markdown artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-markdown-${{ github.run_number }}
          path: |
            docs/BossCat/Research/markdown/**
            docs/BossCat/Research/CONVERSION_SUMMARY.md
          retention-days: 30

      - name: Compute RSI metrics (7-day)
        shell: bash
        run: |
          set -euo pipefail
          LAST7=$(git log --since='7 days ago' --pretty=format:'%H' | wc -l || true)
          CONV=1.0
          SELF=0
          UTURN=0
          KB=$(grep -E '^-\s' docs/BossCat/BOSSCAT_LOG.md 2>/dev/null | wc -l || true)
          OVER=0.0
          UTURN=$(grep -Rci "rollback" .agent 2>/dev/null || true)
          SELF=$(grep -Rci "self-heal" .agent 2>/dev/null || true)
          mkdir -p docs/status
          cat > docs/status/metrics.json <<'JSON'
          {
            "version": 1,
            "generated_at": "__NOW__",
            "convergence_rate_7d": __CONV__,
            "self_heals_7d": __SELF__,
            "u_turns_7d": __UTURN__,
            "kb_coverage": __KB__,
            "rsi_overhead_pct": __OVER__
          }
          JSON
          sed -i "s/__NOW__/$(date -u +%FT%TZ)/" docs/status/metrics.json
          sed -i "s/__CONV__/${CONV}/" docs/status/metrics.json
          sed -i "s/__SELF__/${SELF}/" docs/status/metrics.json
          sed -i "s/__UTURN__/${UTURN}/" docs/status/metrics.json
          sed -i "s/__KB__/${KB}/" docs/status/metrics.json
          sed -i "s/__OVER__/${OVER}/" docs/status/metrics.json

      - name: Generate queue steward evidence
        if: always()
        shell: pwsh
        run: |
          ./scripts/generate-queue-steward-evidence.ps1
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-snapshots-${{ github.run_number }}
          path: |
            docs/observability/snapshots/
            artifacts/*.png
            artifacts/*.json
            artifacts/*.txt
          retention-days: 30

      - name: Run ECRR benchmark and append trend
        if: always()
        shell: pwsh
        run: |
          ./scripts/benchmark-process-all-ecrr-reports.ps1
          ./scripts/append-ecrr-benchmark-trend.ps1 -BenchmarkJson 'DELT/ARTF/ecrr-benchmark.json' -OutputCsv 'DELT/ARTF/ecrr-benchmark-trend.csv' -MirrorCsv 'artifacts/ecrr-benchmark-trend.csv' -Dedup

      - name: Upload ECRR benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-ecrr-benchmark-${{ github.run_number }}
          path: |
            DELT/ARTF/ecrr-benchmark.json
            DELT/ARTF/ecrr-benchmark-trend.csv
            artifacts/ecrr-benchmark-trend.csv
          retention-days: 30
      
      - name: Commit dashboard snapshots and research markdown
        run: |
          git config user.name "BossCat OEM Bot"
          git config user.email "bosscat-oem@noreply.github.com"
          
          git add docs/observability/snapshots/ docs/status/metrics.json
          if [ -d "docs/BossCat/Research/markdown" ]; then
            git add docs/BossCat/Research/markdown || true
          fi
          if [ -f "docs/BossCat/Research/CONVERSION_SUMMARY.md" ]; then
            git add docs/BossCat/Research/CONVERSION_SUMMARY.md || true
          fi
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(observability): nightly export $(date +%Y-%m-%d)

          - Automated snapshot capture
          - Executive dashboard export
          - BossCat compliance artifacts
          - Research: papers converted to Markdown

          Generated by: .github/workflows/nightly-dashboard-export.yml
          Run: #${{ github.run_number }}"
            
            git push
          fi
      
      - name: Stop SigNoz
        if: always()
        run: |
          docker compose -f docker-compose-signoz.yml down -v
      
      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 Nightly Dashboard Export Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "docs/observability/snapshots/$(date +%Y-%m-%d)" ]; then
            echo "### Captured Snapshots" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh docs/observability/snapshots/$(date +%Y-%m-%d)/ || echo "No snapshots found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dashboard export complete" >> $GITHUB_STEP_SUMMARY

      - name: Sentinel: ICF mode should be enforce after 2025-10-19
        if: always()
        shell: bash
        run: |
          TODAY=$(date -u +%Y%m%d)
          if [ "$TODAY" -ge 20251020 ]; then
            if ! grep -q "ICF_FILENAME_MODE: enforce" .github/workflows/bosscat-gate-verify.yml; then
              echo "::warning::ICF_FILENAME_MODE still 'warn' after 2025-10-19 — ratchet overdue."
            fi
          fi

      - name: Sentinel: governance budgets synced (LOC 200→2000)
        if: always()
        shell: bash
        run: |
          MISS=$(grep -RIl --include='*.md' -E '≤ *200 LOC' .agent docs 2>/dev/null | wc -l || true)
          if [ "${MISS:-0}" -gt 0 ]; then
            echo "::warning::Found ${MISS} governance file(s) still referencing ≤ 200 LOC"
          fi

      - name: Sentinel: signature-registry.json present & non-empty
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f signature-registry.json ]; then
            echo "::warning::signature-registry.json missing at repo root"
            exit 0
          fi
          if [ ! -s signature-registry.json ]; then
            echo "::warning::signature-registry.json is empty"
          fi

  deploy-verify:
    name: Site Deploy Verify (ci/local/prod)
    runs-on: ubuntu-latest
    needs: export-dashboards
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify status page anchors and vendored paths
        shell: bash
        run: |
          set -euo pipefail
          for site in ci local prod; do
            echo "Verifying site=$site"
            test -f docs/status.html
            grep -q "Latest ECRR closeout" docs/status.html
            grep -q "assets/vendor/mermaid/mermaid-10.9.4.min.js" docs/status.html
            test -f docs/ecrr/ECRR_REPORTS/ECRR_GATE_CLOSEOUT_LATEST.md || echo "(info) closeout latest missing — skip"
          done
      - name: Collector liveness
        shell: bash
        run: |
          set -e
          curl -sSf http://127.0.0.1:18888/metrics | grep -E "otelcol_build_info|otelcol_process_uptime_seconds"
      - name: Upload verification packet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-deploy-verify-${{ github.run_number }}
          path: |
            docs/status.html
            docs/ecrr/ECRR_REPORTS/ECRR_GATE_CLOSEOUT_LATEST.md
          retention-days: 14
