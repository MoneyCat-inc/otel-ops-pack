name: Nightly Dashboard Export

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      export_all:
        description: 'Export all dashboards (not just executive)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  export-dashboards:
    name: Export SigNoz Dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) installed"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start SigNoz stack
        run: |
          docker compose -f docker-compose-signoz.yml up -d
          echo "Waiting for SigNoz to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "✅ SigNoz is ready!"
              break
            fi
            echo "⏳ Waiting for SigNoz... ($i/60)"
            sleep 10
          done
          
          # Verify SigNoz is actually responding
          curl -v http://localhost:8080/api/v1/health || exit 1
      
      - name: Run dashboard export (PowerShell)
        shell: pwsh
        run: |
          if (Test-Path scripts/nightly-dashboard-export.ps1) {
            pwsh -File scripts/nightly-dashboard-export.ps1
          } else {
            Write-Host "⚠️ nightly-dashboard-export.ps1 not found, using Playwright directly"
            pnpm run export:signoz:playwright
          }
      
      - name: Run dashboard export (Playwright)
        if: github.event.inputs.export_all == 'true'
        run: |
          pnpm run export:signoz:playwright
      
      - name: Collect dashboard snapshots
        run: |
          mkdir -p docs/observability/snapshots/$(date +%Y-%m-%d)
          
          # Copy artifacts
          if [ -d "artifacts" ]; then
            cp artifacts/*.png docs/observability/snapshots/$(date +%Y-%m-%d)/ 2>/dev/null || true
            cp artifacts/*.json docs/observability/snapshots/$(date +%Y-%m-%d)/ 2>/dev/null || true
          fi
          
          # Copy test results
          if [ -d "test-results" ]; then
            find test-results -name "*.png" -exec cp {} docs/observability/snapshots/$(date +%Y-%m-%d)/ \; 2>/dev/null || true
          fi
          
          # Generate index
          echo "# Dashboard Snapshots - $(date +%Y-%m-%d)" > docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          echo "" >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          echo "Auto-generated by nightly-dashboard-export workflow" >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          echo "" >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
          ls -lh docs/observability/snapshots/$(date +%Y-%m-%d)/ >> docs/observability/snapshots/$(date +%Y-%m-%d)/README.md
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-snapshots-${{ github.run_number }}
          path: |
            docs/observability/snapshots/
            artifacts/*.png
            artifacts/*.json
          retention-days: 90
      
      - name: Commit dashboard snapshots
        run: |
          git config user.name "BossCat OEM Bot"
          git config user.email "bosscat-oem@noreply.github.com"
          
          git add docs/observability/snapshots/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(observability): nightly dashboard export $(date +%Y-%m-%d)

          - Automated snapshot capture
          - Executive dashboard export
          - BossCat compliance artifacts
          
          Generated by: .github/workflows/nightly-dashboard-export.yml
          Run: #${{ github.run_number }}"
            
            git push
          fi
      
      - name: Stop SigNoz
        if: always()
        run: |
          docker compose -f docker-compose-signoz.yml down -v
      
      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 Nightly Dashboard Export Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "docs/observability/snapshots/$(date +%Y-%m-%d)" ]; then
            echo "### Captured Snapshots" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh docs/observability/snapshots/$(date +%Y-%m-%d)/ || echo "No snapshots found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dashboard export complete" >> $GITHUB_STEP_SUMMARY
