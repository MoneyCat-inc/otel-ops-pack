name: Deploy MoneyCat Website

on:
  push:
    branches:
      - main
    paths:
      - 'moneycat/**'
      - 'index.html'
      - 'portal.html'
      - 'assets/**'
      - 'docs/**'
      - 'CHAR/**'
      - 'CNAME'
      - 'favicon.*'
      - 'robots.txt'
      - 'humans.txt'
      - '_config.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact (hub root + MoneyCat subdirectory)
        run: |
          set -euo pipefail
          mkdir -p deploy

          # Preserve hub root content (only if files exist)
          [ -f "CNAME" ] && cp -v CNAME deploy/CNAME || echo "CNAME not found, skipping"
          touch deploy/.nojekyll
          for f in index.html portal.html robots.txt humans.txt _config.yml favicon.svg favicon.ico; do
            if [ -f "$f" ]; then
              cp -v "$f" "deploy/$f"
            fi
          done

          # Copy hub assets (only if directories exist)
          [ -d "docs" ] && cp -r docs deploy/ || echo "docs/ not found, skipping"
          [ -d "assets" ] && cp -r assets deploy/ || echo "assets/ not found, skipping"
          [ -d "CHAR" ] && cp -r CHAR deploy/ || echo "CHAR/ not found, skipping"

          # MoneyCat lives under /moneycat (no standalone CNAME)
          if [ -d "moneycat" ]; then
            cp -r moneycat deploy/
            rm -f deploy/moneycat/CNAME
          else
            echo "ERROR: moneycat/ directory not found!"
            exit 1
          fi
          
          # Verify deployment structure
          echo "Deployment structure:"
          ls -la deploy/
          if [ -d "deploy/moneycat" ]; then
            echo "[OK] moneycat/ copied successfully"
          else
            echo "[ERROR] moneycat/ missing!"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './deploy'
          retention-days: 30
      # Note: Deploys Hub at root and MoneyCat at /moneycat
      # Final URLs: hub.resonai.uk/ and hub.resonai.uk/moneycat/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
