# KEEP -- Phase 0 workflow audit 2026-08-03: GitHub Pages deploy of the live hub
name: Deploy Hub Website

# Pack 3B: moneycat/ extracted to MoneyCat-inc/moneycat-site.
# This workflow deploys BossCat Hub only (hub.resonai.uk/).

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'portal.html'
      - 'assets/**'
      - 'docs/**'
      - 'CHAR/**'
      - 'CNAME'
      - 'favicon.*'
      - 'robots.txt'
      - 'humans.txt'
      - '_config.yml'
      - '.github/workflows/deploy-moneycat.yml'
      - '.well-known/**'
      - 'og/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Pages artifact (hub root)
        run: |
          set -euo pipefail
          mkdir -p deploy

          [ -f "CNAME" ] && cp -v CNAME deploy/CNAME || echo "CNAME not found, skipping"
          touch deploy/.nojekyll
          for f in index.html portal.html robots.txt humans.txt _config.yml favicon.svg favicon.ico; do
            if [ -f "$f" ]; then
              cp -v "$f" "deploy/$f"
            fi
          done

          [ -d "docs" ] && cp -r docs deploy/ || echo "docs/ not found, skipping"
          [ -d "assets" ] && cp -r assets deploy/ || echo "assets/ not found, skipping"
          [ -d "CHAR" ] && cp -r CHAR deploy/ || echo "CHAR/ not found, skipping"
          [ -d ".well-known" ] && cp -r .well-known deploy/ || echo ".well-known/ not found, skipping"
          [ -d "og" ] && cp -r og deploy/ || echo "og/ not found, skipping"

          echo "Deployment structure:"
          ls -la deploy/

      - name: Upload artifact
        run: |
          tar --dereference --hard-dereference \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            -C deploy .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 30
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
