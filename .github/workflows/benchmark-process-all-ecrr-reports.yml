name: Benchmark process-all-ecrr-reports

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: daily 300x3 benchmark of ECRR reports; compliance engine pending retire-or-fix (Phase 0), no consumer.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

concurrency:
  group: benchmark-ecrr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-benchmark:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run benchmark harness (defaults)
        shell: pwsh
        run: >
          pwsh -NoLogo -NoProfile -File BRAV/SCPT/benchmark-process-all-ecrr-reports.ps1
          -ReportCount 300 -Iterations 3 -IncludeAutoParallel

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-process-all-ecrr-reports
          path: artifacts/benchmarks/process-all-ecrr-reports/**
