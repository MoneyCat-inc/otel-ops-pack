name: Registry Drift Check
# Nightly check for registry drift - opens PR if out of sync

# RETIRED 2026-08-03 -- Phase 0 workflow audit (docs/BossCat/ROADMAP_2026H2.md).
# Reason: nightly registry PR-opener; registry-guard enforces freshness at PR time.
# Automatic triggers removed; manual dispatch retained. Restore the on: block from git history to re-enable.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    name: Check for Registry Drift
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Regenerate registry
        shell: pwsh
        run: |
          Write-Host "Regenerating workflows registry..."
          pwsh scripts/regenerate-workflows-registry.ps1

      - name: 🔍 Check for drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
            echo "::notice::Registry drift detected - will create PR"
          else
            echo "drift=false" >> $GITHUB_OUTPUT
            echo "✅ No drift detected"
          fi

      - name: 📝 Create PR if drift detected
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(registry): nightly refresh of workflows.json"
          commit-message: |
            chore(registry): nightly refresh
            
            Automated update of workflows.json detected by nightly drift check.
            
            Review trigger changes and workflow additions/removals.
            
            Authority: registry-drift-check workflow
            Generated: ${{ github.run_id }}
          branch: chore/nightly-registry-refresh
          base: main
          delete-branch: true
          body: |
            ## 🌙 Nightly Registry Refresh
            
            This PR was automatically generated because the workflows registry drifted from the actual workflows.
            
            **What happened:**
            - The nightly drift check regenerated `docs/status/workflows.json`
            - Changes were detected compared to the version in `main`
            - This PR was created automatically
            
            **Action required:**
            - ✅ Review the diff to understand what changed
            - ✅ Verify trigger changes are intentional
            - ✅ Check for unexpected workflow additions/removals
            - ✅ Approve and merge if changes are correct
            
            **Workflow:** [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            
            🤖 Generated by `registry-drift-check` workflow
          labels: |
            chore
            registry
            automated

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 🌙 Nightly Registry Drift Check";
            echo "";
            echo "**Drift detected:** ${{ steps.drift.outputs.drift }}";
            echo "**Run ID:** ${{ github.run_id }}";
            echo "";
            if [ "${{ steps.drift.outputs.drift }}" == "true" ]; then
              echo "📝 PR will be created for review";
            else
              echo "✅ Registry is up to date - no action needed";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

