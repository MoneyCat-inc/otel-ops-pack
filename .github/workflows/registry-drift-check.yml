# KEEP -- restored 2026-09-24 as a check-only nightly (operator decision) after the registries became
# byte-deterministic (#811 workflows generator, #812 registry-guard -Check). History: retired 2026-08-03
# (Phase 0 workflow audit) because it was a nightly PR-opener while registry-guard already enforces
# freshness at PR time. It no longer regenerates, commits or opens anything: it runs both generators'
# -Check on main and fails if either registry drifted, which registry-guard cannot see (a workflow
# deleted in the GitHub UI, a generator whose output changed under a new pwsh or git on the runner,
# a merge that raced a path-filtered guard). Fix on red: run the named script without -Check, commit.
name: Registry Drift Check

on:
  schedule:
    - cron: '41 3 * * *' # 03:41 UTC nightly (pinned minute, off the hour)
  workflow_dispatch: {}

concurrency:
  group: registry-drift-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    name: Registries must match the tree (check-only)
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 🔍 Workflows registry (workflows.json)
        id: workflows
        shell: pwsh
        run: |
          pwsh scripts/regenerate-workflows-registry.ps1 -Check
          $rc = $LASTEXITCODE
          git diff --quiet -- docs/status/workflows.json
          if ($rc -ne 0 -or $LASTEXITCODE -ne 0) {
            Write-Host "::error::docs/status/workflows.json drifted — run: pwsh scripts/regenerate-workflows-registry.ps1 && git add docs/status/workflows.json"
            exit 1
          }

      - name: 📜 Scripts registry (scripts.json)
        id: scripts
        if: always()
        shell: pwsh
        run: |
          pwsh scripts/regenerate-scripts-registry.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::docs/status/scripts.json drifted — run: pwsh scripts/regenerate-scripts-registry.ps1 && git add docs/status/scripts.json"
            exit 1
          }

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 🌙 Registry Drift Check (check-only)";
            echo "";
            echo "**Workflow:** ${{ github.workflow }}";
            echo "**Run:** ${{ github.run_id }}";
            echo "**Ref:** ${{ github.ref }}";
            echo "**Actor:** ${{ github.actor }}";
            echo "**workflows.json:** ${{ steps.workflows.outcome }}";
            echo "**scripts.json:** ${{ steps.scripts.outcome }}";
            echo "";
            if [ "${{ steps.workflows.outcome }}" == "success" ] && [ "${{ steps.scripts.outcome }}" == "success" ]; then
              echo "✅ Both registries match the tree";
            else
              echo "❌ Drift: regenerate the named registry (see the step log) and commit it — this job never writes";
            fi
          } >> "$GITHUB_STEP_SUMMARY"
