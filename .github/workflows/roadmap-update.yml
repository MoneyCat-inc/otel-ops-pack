name: Roadmap Auto-Update (ECRR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run daily at 6 AM UTC to keep roadmap fresh
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roadmap:
    name: Update Roadmap (ECRR Cycle)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PR Tests
        id: pr-tests
        continue-on-error: true
        run: |
          pnpm test:pr
        # JSON reporter configured in playwright.noweb.config.ts → test-results-pr.json

      - name: Run Nightly Tests
        id: nightly-tests
        continue-on-error: true
        run: |
          pnpm test:nightly
        # JSON reporter configured in playwright.config.ts → test-results-nightly.json

      - name: ECRR Phase 1 - Examine
        run: pnpm roadmap:examine

      - name: ECRR Phase 2 - Clean
        run: pnpm roadmap:clean

      - name: ECRR Phase 3 - Report
        run: pnpm roadmap:report

      - name: Check for roadmap changes
        id: check-changes
        run: |
          git diff --exit-code docs/ROADMAP.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit roadmap updates
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ROADMAP*.md .artifacts/roadmap-*.json .artifacts/SSOT.md
          git commit -m "docs: auto-update roadmap (ECRR cycle)

          ## ECRR Gate
          - **Examine**: Test results parsed from CI
          - **Clean**: Feature statuses normalized
          - **Report**: Roadmap docs regenerated
          - **Role**: ECRR Roadmap Agent (automated)

          Generated by: .github/workflows/roadmap-update.yml"

      - name: Push changes (main/develop only)
        if: |
          steps.check-changes.outputs.changed == 'true' && 
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: git push

      - name: Comment on PR (if applicable)
        if: |
          steps.check-changes.outputs.changed == 'true' && 
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const roadmap = fs.readFileSync('docs/ROADMAP.md', 'utf8');
            const summary = roadmap.split('## Milestone Overview')[0];
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🗺️ Roadmap Auto-Update

              The roadmap has been automatically updated based on test results.

              ${summary}

              <details>
              <summary>View full roadmap</summary>

              \`\`\`
              See docs/ROADMAP.md for complete details.
              \`\`\`
              </details>

              ---
              **ECRR Gate:**
              - ✅ **Examine**: Test results parsed
              - ✅ **Clean**: Statuses normalized
              - ✅ **Report**: Docs generated
              - ✅ **Role**: ECRR Roadmap Agent (automated)
              `
            });

      - name: Upload roadmap artifacts
        uses: actions/upload-artifact@v3
        with:
          name: roadmap-artifacts
          path: |
            docs/ROADMAP*.md
            .artifacts/roadmap-*.json
          retention-days: 30

      - name: ECRR Phase 4 - Role Declaration
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ ECRR Roadmap Automation Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "**Role**: ECRR Roadmap Agent (GitHub Actions)"
          echo "**Actor**: github-actions[bot]"
          echo "**Workflow**: .github/workflows/roadmap-update.yml"
          echo ""
          echo "Generated artifacts:"
          echo "  - docs/ROADMAP.md"
          echo "  - docs/ROADMAP_KANBAN.md"
          echo "  - docs/ROADMAP_HEATMAP.md"
          echo "  - .artifacts/roadmap-examine.json"
          echo "  - .artifacts/roadmap-clean.json"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

