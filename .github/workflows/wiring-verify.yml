# SigNoz Wiring Verification - GitHub Actions Workflow
# Copy this to .github/workflows/wiring-verify.yml
# Runs on every PR to verify OTLP logging pipeline health
# Supports both partial-pass (default) and full-pass (with SIGNOZ_API_TOKEN)

name: wiring-verify

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  signoz-wiring:
    name: SigNoz wiring verifier (Windows)
    runs-on: windows-latest
    env:
      # Optional: set this repo secret to enable FULL PASS (otherwise partial-pass still exits 0)
      SIGNOZ_API_TOKEN: ${{ secrets.SIGNOZ_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build application
        shell: pwsh
        run: pnpm build

      - name: Start application (port 3003)
        shell: pwsh
        run: |
          Start-Job -ScriptBlock { 
            $env:NODE_ENV = "production"
            pnpm start --port 3003
          } | Out-Null
          Write-Host "Waiting for application to start..."
          pnpm dlx wait-on http://localhost:3003 --timeout 30000

      - name: Verify application health
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:3003/api/events/simple" -Method POST -Body '{"events":[{"kind":"health_check","props":{"message":"CI health check"}}]}' -ContentType "application/json"
          Write-Host "Application health check: $($response.success)"

      - name: Run SigNoz wiring verifier
        shell: pwsh
        run: |
          Write-Host "=== Running SigNoz Wiring Verification ===" -ForegroundColor Cyan
          pwsh -File scripts\verify-wiring.ps1
          $exitCode = $LASTEXITCODE
          Write-Host "Verifier exit code: $exitCode" -ForegroundColor $(if ($exitCode -eq 0) { "Green" } else { "Red" })
          exit $exitCode

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiring-verify-artifacts
          path: |
            artifacts\wiring-verify*.txt
            artifacts\wiring-verify*.json
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Try to read verification results
            let status = '❓ Unknown';
            let details = 'Verification completed';
            
            try {
              const artifactsDir = 'artifacts';
              if (fs.existsSync(artifactsDir)) {
                const files = fs.readdirSync(artifactsDir);
                const verifyFile = files.find(f => f.startsWith('wiring-verify') && f.endsWith('.txt'));
                
                if (verifyFile) {
                  const content = fs.readFileSync(path.join(artifactsDir, verifyFile), 'utf8');
                  
                  if (content.includes('== Wiring verification PASSED ==')) {
                    status = '✅ PASSED';
                    details = 'Full verification successful';
                  } else if (content.includes('== Wiring verification PARTIAL PASS ==')) {
                    status = '⚠️ PARTIAL PASS';
                    details = 'API verification passed, manual SigNoz verification needed';
                  } else {
                    status = '❌ FAILED';
                    details = 'Verification failed - check artifacts for details';
                  }
                }
              }
            } catch (error) {
              details = `Error reading results: ${error.message}`;
            }
            
            const comment = `## 🔍 SigNoz Wiring Verification Results
            
**Status**: ${status}
**Details**: ${details}
**Mode**: ${process.env.SIGNOZ_API_TOKEN ? 'Full PASS (with token)' : 'Partial PASS (no token)'}

### Next Steps
${process.env.SIGNOZ_API_TOKEN ? 
  '✅ Full verification enabled with SigNoz API token' : 
  '🔧 To enable full verification, add \`SIGNOZ_API_TOKEN\` to repository secrets'
}

### Manual Verification
- Open SigNoz UI: \`http://localhost:8080\`
- Navigate to: **Logs → Explorer**
- Search for: \`body contains "resonai canary log"\`

---
*Generated by SigNoz Wiring Verification Workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

