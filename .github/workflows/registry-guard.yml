name: Registry Guard
# Enforce workflows.json stays in sync with actual workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/regenerate-workflows-registry.ps1"
      - "docs/status/workflows.json"
      - "docs/status/workflows.schema.json"
      - ".github/workflows/registry-guard.yml"
  workflow_dispatch:

concurrency:
  group: registry-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Registry Freshness
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔄 Regenerate registry (location-independent)
        shell: pwsh
        run: |
          Write-Host "Regenerating workflows registry..."
          pwsh scripts/regenerate-workflows-registry.ps1

      - name: 🔍 Deep semantic comparison (triggers + metadata)
        shell: pwsh
        run: |
          # Compare committed vs regenerated - must check triggers not just names
          $committed = Get-Content docs/status/workflows.json -Raw | ConvertFrom-Json
          git checkout docs/status/workflows.json 2>$null
          $original = Get-Content docs/status/workflows.json -Raw | ConvertFrom-Json
          
          $errors = @()
          
          # Check 1: Total count
          if ($committed.total -ne $original.total) {
            $errors += "Workflow count changed: $($original.total) → $($committed.total)"
          }
          
          # Check 2: Build lookup maps for comparison
          $committedMap = @{}
          $committed.items | ForEach-Object { $committedMap[$_.name] = $_ }
          
          $originalMap = @{}
          $original.items | ForEach-Object { $originalMap[$_.name] = $_ }
          
          # Check 3: Compare each workflow's triggers
          foreach ($name in $committedMap.Keys) {
            if (-not $originalMap.ContainsKey($name)) {
              $errors += "New workflow: $name (missing in committed registry)"
              continue
            }
            
            $cTriggers = $committedMap[$name].triggers
            $oTriggers = $originalMap[$name].triggers
            
            # Compare each trigger boolean
            $triggerKeys = @('push', 'pull_request', 'workflow_dispatch', 'workflow_call', 'workflow_run', 'schedule', 'release', 'issues')
            foreach ($key in $triggerKeys) {
              $cVal = if ($cTriggers.$key) { $cTriggers.$key } else { $false }
              $oVal = if ($oTriggers.$key) { $oTriggers.$key } else { $false }
              
              if ($cVal -ne $oVal) {
                $errors += "Workflow '$name' trigger '$key' changed: $oVal → $cVal"
              }
            }
          }
          
          # Check 4: Look for removed workflows
          foreach ($name in $originalMap.Keys) {
            if (-not $committedMap.ContainsKey($name)) {
              $errors += "Workflow removed: $name (still in committed registry)"
            }
          }
          
          # Report results
          if ($errors.Count -gt 0) {
            Write-Host "::error::Registry is out of date - $($errors.Count) issue(s) found"
            Write-Host ""
            foreach ($err in $errors) {
              Write-Host "  - $err"
            }
            Write-Host ""
            Write-Host "Fix: pwsh scripts/regenerate-workflows-registry.ps1"
            Write-Host "Then: git add docs/status/workflows.json && git commit"
            exit 1
          }
          
          Write-Host "✅ Registry is up to date (deep semantic check passed)"
          Write-Host "   Validated: $($committed.total) workflows, all triggers match"

      - name: 📐 Install JSON schema validator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📥 Install jsonschema
        run: pip install jsonschema

      - name: ✅ Validate against schema
        run: |
          python3 - <<'PY'
          import json, sys
          from jsonschema import validate, Draft7Validator, ValidationError

          # Load schema and data
          with open('docs/status/workflows.schema.json') as f:
              schema = json.load(f)
          with open('docs/status/workflows.json') as f:
              data = json.load(f)

          # Validate
          validator = Draft7Validator(schema)
          errors = sorted(validator.iter_errors(data), key=lambda e: e.path)

          if errors:
              print("❌ Schema validation errors:")
              for e in errors:
                  path = "/" + "/".join(map(str, e.path)) if e.path else "(root)"
                  print(f"  - {path}: {e.message}")
              sys.exit(1)
          
          print(f"✅ Schema validation: OK")
          print(f"   Total workflows: {data['total']}")
          print(f"   Source: {data['source']}")
          PY

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 🛡️ Registry Guard";
            echo "";
            echo "**Status:** ${{ job.status }}";
            echo "**Workflows:** $(jq '.total' docs/status/workflows.json)";
            echo "**Schema:** docs/status/workflows.schema.json";
            echo "";
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ Registry is fresh and schema-compliant";
            else
              echo "❌ Registry check failed - see logs above";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

