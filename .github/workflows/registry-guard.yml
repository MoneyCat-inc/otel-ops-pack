# KEEP -- Phase 0 workflow audit 2026-08-03: enforces docs/status/workflows.json freshness on workflow PRs
# 2026-09-02: also enforces docs/status/scripts.json freshness on scripts/ PRs (-Check).
# 2026-09-24: workflows.json checked with the generator's -Check (byte-deterministic since #811).
name: Registry Guard
# Enforce workflows.json and scripts.json stay in sync with the tree

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/status/workflows.json"
      - "docs/status/workflows.schema.json"
      - "docs/status/scripts.json"
      - ".github/workflows/registry-guard.yml"
  workflow_dispatch:

concurrency:
  group: registry-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Registry Freshness
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Workflow files that fail YAML parsing spawn a "workflow file issue" failure run on every
      # push, named by file path — noise everyone tunes out. Nine files did exactly that for two
      # weeks (broken by the #428 retirement edits) because nothing here could fail on invalid
      # YAML: actionlint in bosscat-gate-verify is continue-on-error, and the registry
      # regeneration script parses with tolerant regexes. This step is the check that can fail.
      - name: Workflow files must parse as YAML
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = []
          for p in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
              except yaml.YAMLError as e:
                  bad.append(f"{p}: {str(e).splitlines()[0]}")
          for b in bad:
              print(f"::error::{b}")
          print(f"checked {len(list(pathlib.Path('.github/workflows').glob('*.y*ml')))} files, {len(bad)} invalid")
          sys.exit(1 if bad else 0)
          PY

      # Both registries are byte-deterministic (tracked set + blob sizes, no dates or mtimes;
      # workflows.json since the generator rewrite on 2026-09-24), so each is checked with the
      # generator's own -Check. Fix: re-run the named script without -Check and commit the file.
      - name: 📜 Scripts registry must be current (scripts.json)
        shell: pwsh
        run: |
          pwsh scripts/regenerate-scripts-registry.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::docs/status/scripts.json is stale — run: pwsh scripts/regenerate-scripts-registry.ps1 && git add docs/status/scripts.json"
            exit 1
          }

      # The diff guard keeps this step from passing vacuously: a generator without a -Check
      # parameter would ignore the switch, rewrite the file and exit 0.
      - name: 🔍 Workflows registry must be current (workflows.json)
        shell: pwsh
        run: |
          pwsh scripts/regenerate-workflows-registry.ps1 -Check
          $rc = $LASTEXITCODE
          git diff --quiet -- docs/status/workflows.json
          if ($rc -ne 0 -or $LASTEXITCODE -ne 0) {
            Write-Host "::error::docs/status/workflows.json is stale — run: pwsh scripts/regenerate-workflows-registry.ps1 && git add docs/status/workflows.json"
            exit 1
          }

      - name: 📐 Install JSON schema validator
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 📥 Install jsonschema
        run: pip install jsonschema

      - name: ✅ Validate against schema
        run: |
          python3 - <<'PY'
          import json, sys
          from jsonschema import validate, Draft7Validator, ValidationError

          # Load schema and data
          with open('docs/status/workflows.schema.json') as f:
              schema = json.load(f)
          with open('docs/status/workflows.json') as f:
              data = json.load(f)

          # Validate
          validator = Draft7Validator(schema)
          errors = sorted(validator.iter_errors(data), key=lambda e: e.path)

          if errors:
              print("❌ Schema validation errors:")
              for e in errors:
                  path = "/" + "/".join(map(str, e.path)) if e.path else "(root)"
                  print(f"  - {path}: {e.message}")
              sys.exit(1)
          
          print(f"✅ Schema validation: OK")
          print(f"   Total workflows: {data['total']}")
          print(f"   Source: {data['source']}")
          PY

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 🛡️ Registry Guard";
            echo "";
            echo "**Status:** ${{ job.status }}";
            echo "**Workflows:** $(jq '.total' docs/status/workflows.json)";
            echo "**Scripts:** $(jq '.total' docs/status/scripts.json)";
            echo "**Schema:** docs/status/workflows.schema.json";
            echo "";
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ Registry is fresh and schema-compliant";
            else
              echo "❌ Registry check failed - see logs above";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

