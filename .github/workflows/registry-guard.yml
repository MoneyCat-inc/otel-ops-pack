name: Registry Guard
# Enforce workflows.json stays in sync with actual workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/regenerate-workflows-registry.ps1"
      - "docs/status/workflows.json"
      - "docs/status/workflows.schema.json"
      - ".github/workflows/registry-guard.yml"
  workflow_dispatch:

concurrency:
  group: registry-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Registry Freshness
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔄 Regenerate registry (location-independent)
        shell: pwsh
        run: |
          Write-Host "Regenerating workflows registry..."
          pwsh scripts/regenerate-workflows-registry.ps1

      - name: 🔍 Semantic comparison (JSON-aware)
        shell: pwsh
        run: |
          # Compare committed vs regenerated semantically (not text diff)
          $committed = Get-Content docs/status/workflows.json -Raw | ConvertFrom-Json
          git checkout docs/status/workflows.json 2>$null
          $original = Get-Content docs/status/workflows.json -Raw | ConvertFrom-Json
          
          # Compare total count
          if ($committed.total -ne $original.total) {
            Write-Host "::error::Workflow count changed: $($original.total) → $($committed.total)"
            Write-Host "Run: pwsh scripts/regenerate-workflows-registry.ps1"
            exit 1
          }
          
          # Compare workflow names (sorted)
          $committedNames = ($committed.items | Select-Object -ExpandProperty name | Sort-Object) -join ','
          $originalNames = ($original.items | Select-Object -ExpandProperty name | Sort-Object) -join ','
          
          if ($committedNames -ne $originalNames) {
            Write-Host "::error::Workflow names don't match"
            Write-Host "Committed: $committedNames"
            Write-Host "Original:  $originalNames"
            Write-Host "Run: pwsh scripts/regenerate-workflows-registry.ps1"
            exit 1
          }
          
          Write-Host "✅ Registry is up to date (semantic check passed)"

      - name: 📐 Install JSON schema validator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📥 Install jsonschema
        run: pip install jsonschema

      - name: ✅ Validate against schema
        run: |
          python3 - <<'PY'
          import json, sys
          from jsonschema import validate, Draft7Validator, ValidationError

          # Load schema and data
          with open('docs/status/workflows.schema.json') as f:
              schema = json.load(f)
          with open('docs/status/workflows.json') as f:
              data = json.load(f)

          # Validate
          validator = Draft7Validator(schema)
          errors = sorted(validator.iter_errors(data), key=lambda e: e.path)

          if errors:
              print("❌ Schema validation errors:")
              for e in errors:
                  path = "/" + "/".join(map(str, e.path)) if e.path else "(root)"
                  print(f"  - {path}: {e.message}")
              sys.exit(1)
          
          print(f"✅ Schema validation: OK")
          print(f"   Total workflows: {data['total']}")
          print(f"   Source: {data['source']}")
          PY

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 🛡️ Registry Guard";
            echo "";
            echo "**Status:** ${{ job.status }}";
            echo "**Workflows:** $(jq '.total' docs/status/workflows.json)";
            echo "**Schema:** docs/status/workflows.schema.json";
            echo "";
            if [ "${{ job.status }}" == "success" ]; then
              echo "✅ Registry is fresh and schema-compliant";
            else
              echo "❌ Registry check failed - see logs above";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

